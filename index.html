                                       {studentData.master.map((stu, i) => (
                                         <div key={i} className="flex justify-between">
                                            <span className="text-[color:var(--text)] text-base">{stu.name}</span>
                                            <span className="font-mono text-sm text-[color:var(--subtle)] bg-white px-2 py-0.5 rounded">{stu.year}</span>
                                         </div>
                                       ))}
                                    </div>
                                </div>
                            </div>

                            <div className="p-6 bg-white/80 rounded-xl border border-[var(--line)]">
                                <h4 className="text-[color:var(--ink)] font-bold flex items-center gap-2 mb-6 text-lg border-b border-[var(--line)] pb-4">
                                  <span className="w-2 h-2 rounded-full bg-[var(--soft)]"></span>
                                  Graduated Students
                                </h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                  {studentData.alumni.map((stu, i) => (
                                      <div key={i} className="flex flex-col p-3 rounded bg-white/50 hover:bg-white transition-colors border border-[var(--line)]">
                                        <div className="flex justify-between items-start mb-1">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[color:var(--text)] text-base">{stu.name}</span>
                                                <span className="text-sm bg-[var(--soft)] text-[color:var(--muted)] px-1 rounded">Master</span>
                                                {stu.honor && (
                                                    <span className="text-sm bg-[#f6efd9] text-[#926b23] px-1 rounded border border-[#e4d5a6] flex items-center gap-1" title={stu.honor}>
                                                        <i className="ph-fill ph-medal"></i> {stu.honor}
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-sm font-mono text-[color:var(--subtle)]">{stu.year}</span>
                                        </div>
                                        <span className="text-[color:var(--accent)] text-base flex items-center gap-1">
                                          <ChevronRight size={10} /> {stu.dest}
                                        </span>
                                      </div>
                                  ))}
                                </div>
                             </div>
                        </div>
                    </section>

                    {/* CV / Vita Section */}
                    <section id="cv" className="py-24 relative bg-transparent">
                        <div className="container mx-auto px-6">
                            <SectionHeader title="Career" subtitle="ACADEMIC & PROFESSIONAL HISTORY" />
                            
                            <div className="mt-12 grid lg:grid-cols-3 gap-12">

                                {/* Column 1: Education */}
                                <div>
                                    <h3 className="text-xl font-bold text-[color:var(--ink)] mb-6 flex items-center gap-2"><GraduationCap size={20} className="text-[color:var(--ink)]"/> Education</h3>
                                    <div className="space-y-8 pl-4 border-l-2 border-[var(--line)]">
                                        <TimelineItem year="2008-2011" title="Ph.D., Computer Science" org="Aalborg University, Denmark" />
                                        <TimelineItem year="2005-2008" title="M.Sci., Computer Science" org="Peking University, China" />
                                        <TimelineItem year="2001-2005" title="B. Eng., Computer Science" org="Huazhong University of Science and Technology" />
                                    </div>
                                </div>

                                {/* Column 2: Academic Positions */}
                                <div>
                                    <h3 className="text-xl font-bold text-[color:var(--ink)] mb-6 flex items-center gap-2"><Briefcase size={20} className="text-[color:var(--ink)]"/> Academic Positions</h3>
                                    <div className="space-y-8 pl-4 border-l-2 border-[var(--line)]">
                                        <TimelineItem year="2019-Present" title="Associate Professor" org="College of CS & SE, Shenzhen University" />
                                        <TimelineItem year="2015-2019" title="Assistant Professor" org="College of CS & SE, Shenzhen University" />
                                        <TimelineItem year="2013-2015" title="Postdoc" org="Dept. of CS, The University of Hong Kong" />
                                        <TimelineItem year="2011-2013" title="Postdoc" org="Dept. of CS, Hong Kong Baptist University" />
                                    </div>
                                </div>

                                {/* Column 3: Joint Appointments */}
                                <div>
                                    <h3 className="text-xl font-bold text-[color:var(--ink)] mb-6 flex items-center gap-2"><Network size={20} className="text-[color:var(--ink)]"/> Joint Appointments</h3>
                                    <div className="space-y-8 pl-4 border-l-2 border-[var(--line)]">
                                        <TimelineItem year="2023-Present" title="Joint Master Program Supervisor" org="Great Bay University, Dong Guan, Guangdong" />
                                        <TimelineItem year="2023-Present" title="Joint Master Program Supervisor" org="Shenzhen Institute for Quantum Science and Engineering" />
                                        <TimelineItem year="2019-2025" title="Joint Master Program Supervisor" org="Kazan Federal University, Russia" />
                                        <TimelineItem year="2020-2023" title="Joint Master Program Supervisor" org="Huawei" />
                                    </div>
                                </div>

                            </div>

                            {/* Professional Activities - full width */}
                            <div className="mt-12">
                                <h3 className="text-xl font-bold text-[color:var(--ink)] mb-6 flex items-center gap-2"><PenTool size={20}/> Professional Activities</h3>
                                <div className="bg-white/80 p-4 rounded border border-[var(--line)] grid sm:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-4">
                                    <ActivityItem year="2027" activities={[
                                        { label: "Senior PC Member", type: "chair", venues: "AAAI, ICDE" },
                                        { label: "Area Chair", type: "chair", venues: "SIGKDD" }
                                    ]} />
                                    <ActivityItem year="2026" activities={[
                                        { label: "Area Chair", type: "chair", venues: "SIGKDD" },
                                        { label: "PC Member", type: "pc",    venues: "KDD, ICDE, SIGIR, ICDM" }
                                    ]} />
                                    <ActivityItem year="2025" activities={[{ label: "PC Member", type: "pc", venues: "KDD, ICDE" }]} />
                                    <ActivityItem year="2024" activities={[{ label: "PC Member", type: "pc", venues: "KDD" }]} />
                                    <ActivityItem year="2022" activities={[{ label: "PC Member", type: "pc", venues: "ICDE, AAAI" }]} />
                                    <ActivityItem year="2021" activities={[{ label: "PC Member", type: "pc", venues: "IJCAI, WISE" }]} />
                                </div>
                            </div>

                            {/* Honors */}
                            <div className="mt-12">
                                <h3 className="text-xl font-bold text-[color:var(--ink)] mb-6 flex items-center gap-2"><Award size={20} className="text-[#926b23]"/> Honors & Awards</h3>
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    <HonorCard title="Graduate Education Innovation Program" year="2024" desc="Principal Investigator, SZU - Shenzhen International Quantum Research Institute Joint Graduate Training Practice Base" />
                                    <HonorCard title="First Prize, 9th National Competition" year="2024" desc="Experimental Teaching Cases in Computer Science Courses - Excellent Case" />
                                    <HonorCard title="Guangdong Province First-Class Course" year="2023" desc="Algorithm Design and Analysis" />
                                    <HonorCard title="Excellent Paper Award (2nd Prize)" year="2023" desc="Guangdong Computer Society. Paper: Density-Based Top-K Spatial Textual Clusters Retrieval (IEEE TKDE)" />
                                    <HonorCard title="Excellent Paper Award (2nd Prize)" year="2021" desc="Guangdong Computer Society. Paper: Density-Based Place Clustering Using Geo-Social Network Data (IEEE TKDE)" />
                                    <HonorCard title="Shenzhen Univ Teaching Achievement (1st Prize)" year="2021" desc="Innovation and Practice of Dual-Entity Collaborative Training of Master of Computer Engineering" />
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* Footer - Replaced from Document 1 */}
                    <footer className="py-20 border-t border-[var(--line)] relative z-10 bg-[var(--soft)] backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <h2 className="text-3xl font-bold text-[color:var(--ink)] mb-8">Get in Touch</h2>
                            <div className="flex flex-wrap justify-center gap-8 mb-12">
                                 <div className="flex items-center justify-center gap-3 text-[color:var(--muted)]">
                                    <Mail size={20} className="text-[color:var(--accent)]" />
                                    <a href={`mailto:${personalInfo.email2}`} target="_blank" rel="noreferrer" className="text-base hover:text-[color:var(--ink)] transition-colors">{personalInfo.email2}</a>
                                </div>

                            </div>
                            <div className="address text-[color:var(--subtle)] text-base mb-8 mx-auto flex items-center justify-center whitespace-nowrap">
                                <MapPin size={20} className="text-[color:var(--accent)] mr-2" />
                                {personalInfo.address}
                            </div>
                            <p className="text-base text-[color:var(--subtle)] font-mono">
                                © {new Date().getFullYear()} Dingming Wu. All Rights Reserved. <br/>
                                Designed with AI.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- Sub-Components ---

        const ContactBadge = ({ icon, text, href }) => {
            const content = (
                <div className="contact-badge flex items-center gap-2 px-4 py-2 bg-white rounded border border-[var(--line)] hover:border-[var(--line-strong)] transition-colors cursor-pointer group">
                    <span className="text-[color:var(--accent)] group-hover:text-[color:var(--accent)]">{icon}</span>
                    <span className="text-base text-[color:var(--text)]">{text}</span>
                </div>
            );

            return href ? (
                <a href={href} target="_blank" rel="noreferrer" className="no-underline">
                    {content}
                </a>
            ) : content;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="section-heading mb-8">
                <span className="text-[color:var(--accent)] font-mono text-sm tracking-widest uppercase mb-2 block">
                    {subtitle}
                </span>
                <h2 className="text-3xl md:text-4xl font-bold text-[color:var(--ink)] tracking-tight">
                    {title}
                </h2>
                <div className="section-rule"></div>
            </div>
        );

        const PatentItem = ({ id, title, date, authors, pdf }) => (
            <div className="p-4 bg-white/80 rounded border border-[var(--line)] flex flex-col md:flex-row gap-4 md:items-center">
                <div className="bg-white p-2 rounded border border-[var(--line)] font-mono text-base text-[color:var(--accent)] whitespace-nowrap">
                    {id}
                </div>
                <div className="flex-1">
                    <h4 className="text-[color:var(--ink)] font-bold">{title}</h4>
                    <p className="text-base text-[color:var(--muted)] mt-1" dangerouslySetInnerHTML={{ __html: authors.replace('Dingming Wu', '<b class="text-[color:var(--ink)]">Dingming Wu</b>') }}></p>
                </div>
                <div className="flex items-center gap-4 md:ml-auto">
                    <div className="text-base text-[color:var(--subtle)] font-mono whitespace-nowrap">{date}</div>
                    {/* PATENT ICON LINK */}
                    <a href={pdf} target="_blank" rel="noreferrer" className="text-[color:var(--subtle)] hover:text-[color:var(--accent)] transition-colors" title="View Patent">
                        <Scroll size={36} />
                    </a>
                </div>
            </div>
        );

        const CourseItem = ({ name, year, href }) => (
            <li className="flex justify-between items-center border-b border-[var(--line)] pb-2 last:border-0 last:pb-0">
                <div className="flex items-center gap-2">
                    <span className="text-[color:var(--text)] text-base">{name}</span>
                    {href && (
                        <a href={href} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-2 py-0.5 rounded border text-sm font-mono bg-[var(--tint)] text-[color:var(--accent)] border-[var(--line-strong)] hover:bg-[var(--tint)] hover:border-[var(--line-strong)] transition-colors no-underline whitespace-nowrap">
                            <i className="ph-bold ph-arrow-up-right" style={{fontSize: 12}}></i>
                            课程资料
                        </a>
                    )}
                </div>
                <span className="font-mono text-[color:var(--subtle)] text-base">{year}</span>
            </li>
        );

        const TimelineItem = ({ year, title, org }) => (
            <div className="relative">
                <div className="absolute -left-[21px] top-1.5 w-3 h-3 bg-white border-2 border-[var(--line-strong)] rounded-full"></div>
                <span className="block font-mono text-[color:var(--accent)] text-base mb-1">{year}</span>
                <h4 className="text-[color:var(--ink)] font-bold">{title}</h4>
                <p className="text-[color:var(--muted)] text-base">{org}</p>
            </div>
        );

        const ActivityItem = ({ year, event, activities }) => (
            <div className="flex gap-4 items-start">
                <span className="font-mono text-[color:var(--accent)] text-sm w-12 pt-1">{year}</span>
                <div className="border-l border-[var(--line)] pl-4 flex-1">
                    {activities ? (
                        <div className="flex flex-col gap-1.5">
                            {activities.map((act, i) => (
                                <div key={i} className="flex items-center gap-2">
                                    <span className={`text-sm font-mono px-1.5 py-0.5 rounded border whitespace-nowrap ${act.type === 'chair' ? 'bg-[#f6efd9] text-[#926b23] border-[#e4d5a6]' : 'bg-[var(--tint)] text-[color:var(--accent)] border-[var(--line-strong)]'}`}>
                                        {act.label}
                                    </span>
                                    <span className="text-[color:var(--text)] text-base">{act.venues}</span>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <span className="text-[color:var(--text)] text-base">{event}</span>
                    )}
                </div>
            </div>
        );

        const HonorCard = ({ title, year, desc }) => (
            <div className="p-4 bg-[var(--soft)] rounded border border-[var(--line)]">
                <div className="flex justify-between items-start mb-2">
                    <p className="text-[color:var(--ink)] font-bold text-base">{title}</p>
                    <span className="text-base font-mono text-[#926b23]">{year}</span>
                </div>
                <p className="text-base text-[color:var(--muted)] mt-1">{desc}</p>
            </div>
        );

        // --- Render ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
