            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

                                    <CodeBlock lang="cpp" filename="hello_world.cpp" code={`// 教学重点：区分CPU模式和NPU模式的头文件依赖
#ifdef RUN_MODE_CPU
#include <iostream>    // CPU模式：标准输入输出
#else
#include "kernel_operator.h" // NPU模式：AscendC核函数必备头文件
#endif

// 教学重点1：extern "C" 避免C++名称修饰，确保主机端能调用核函数
extern "C" {
#ifdef RUN_MODE_CPU
    // 教学重点2：核函数定义（NPU模式vs CPU模式对比）
    void hello_world() {
        // CPU模式：普通函数（模拟核函数逻辑）
        std::cout << "[CPU模式] Hello World from AscendC Teaching!" << std::endl;
    }
#else
    __global__ __aicore__ void hello_world() {
        // NPU模式：AscendC核函数（核心语法）
        // __global__：标识该函数是设备端核函数，由主机端启动
        // __aicore__：指定核函数在昇腾AI Core（算力核心）上运行
        // AscendC专用打印函数：设备端向主机端输出信息（类似printf，但适配AI Core）
        AscendC::printf("[NPU模式] Hello World from AscendC AI Core!\\n");
    }
#endif
}

// 教学重点3：核函数调用入口（统一CPU/NPU模式的调用接口）
// blockDim：线程块数量（NPU模式：启动多少个AI Core线程块；CPU模式：循环执行次数）
// stream：数据流（NPU模式：指定核函数在哪个流中执行，确保异步调度）
void hello_world_do(uint32_t blockDim, void *stream) {
#ifdef RUN_MODE_CPU
    // CPU模式：循环执行（模拟多线程块）
    for (uint32_t i = 0; i < blockDim; ++i) {
        hello_world();
    }
#else
    // NPU模式：启动核函数（AscendC核心语法）
    // <<<blockDim, nullptr, stream>>>：核函数启动配置
    // blockDim：线程块数量（此处=8，即启动8个线程块，每个线程块执行1次hello_world）
    // nullptr：线程数配置（默认1个线程/线程块，入门场景简化）
    // stream：绑定数据流（确保核函数异步执行）
    hello_world<<<blockDim, nullptr, stream>>>();
#endif
}`} />

                                    <CodeBlock lang="cpp" filename="main.cpp" code={`// 教学重点：区分CPU/NPU模式的头文件
#ifdef RUN_MODE_CPU
    #include <iostream>
#else
    #include <iostream>
    // NPU模式：ACL（Ascend Computing Language）运行时头文件（主机端操作设备的核心）
    #include "acl/acl.h"
#endif

// 声明核函数调用入口（主机端调用设备端核函数的桥梁）
extern void hello_world_do(uint32_t coreDim, void *stream);

int32_t main(int argc, char const *argv[]) {
    std::cout << "===== AscendC HelloWorld 教学示例 =====" << std::endl;
#ifdef RUN_MODE_CPU
    // CPU模式：简单调用（无设备交互，适合无硬件时演示）
    constexpr uint32_t blockDim = 8; // 模拟8个线程块
    std::cout << "[CPU模式] 启动 " << blockDim << " 个模拟线程块..." << std::endl;
    hello_world_do(blockDim, nullptr);
#else
    // NPU模式：主机端与设备端交互全流程
    // 步骤1：初始化ACL运行时（必须调用，建立主机与设备的连接）
    aclInit(nullptr);

    // 步骤2：指定设备（昇腾设备ID，默认0，多设备时需指定）
    // 根据同学使用的账号 stu1 就设置为0，stu2 就设为1
    int32_t deviceId = 0;
    aclrtSetDevice(deviceId);

    // 步骤3：创建数据流（stream：用于异步执行核函数，提升效率）
    aclrtStream stream = nullptr;
    aclrtCreateStream(&stream);

    // 步骤4：启动核函数（教学重点：调用设备端核函数）
    constexpr uint32_t blockDim = 8;
    std::cout << "步骤4：启动 " << blockDim << " 个AI Core线程块，执行核函数..." << std::endl;
    hello_world_do(blockDim, stream);

    // 步骤5：等待数据流完成（确保核函数执行完毕，再进行后续操作）
    aclrtSynchronizeStream(stream);

    // 步骤6：释放资源（教学重点：规范释放，避免内存泄漏）
    aclrtDestroyStream(stream);
    aclrtResetDevice(deviceId);
    aclFinalize();
#endif
    std::cout << "===== 程序执行完成 =====" << std::endl;
    return 0;
}`} />

cmake_minimum_required(VERSION 3.16.0)

# project information
project(Ascend_C)

# 根据运行模式选择不同的编译选项
if("\${RUN_MODE}" STREQUAL "npu")
    set(SOC_VERSION "Ascend910B3" CACHE STRING "system on chip type")
    # ... 自动查找 ASCEND_CANN_PACKAGE_PATH ...
    set(RUN_MODE "npu" CACHE STRING "run mode: npu")
    set(CMAKE_BUILD_TYPE "Debug" CACHE STRING "Build type")
    set(CMAKE_INSTALL_PREFIX "\${CMAKE_CURRENT_LIST_DIR}/out" CACHE STRING "path for install()")

    # 查找 ascendc_kernel_cmake 并引入
    include(\${ASCENDC_CMAKE_DIR}/ascendc.cmake)

    # ascendc_library：将核函数编译为 ascendc 静态库
    ascendc_library(kernels STATIC
        hello_world.cpp
    )
    add_executable(main main.cpp)
    target_link_libraries(main PRIVATE kernels)

elseif("\${RUN_MODE}" STREQUAL "cpu")
    add_definitions(-DRUN_MODE_CPU)  # 定义 CPU 模式宏
    add_executable(main main.cpp hello_world.cpp)
    target_link_libraries(main PRIVATE pthread)

else()
    message(FATAL_ERROR "Invalid RUN_MODE: \${RUN_MODE}. Please specify 'npu' or 'cpu'.")
endif()`} />

                                    <p className="text-slate-400 mb-4 text-sm">一键编译运行脚本，解析命令行参数（<code className="text-cyan-400">-m</code> 模式、<code className="text-cyan-400">-v</code> 芯片型号），设置环境变量，调用 CMake 编译并执行。</p>
                                    <CodeBlock lang="bash" filename="run.sh" code={`#!/bin/bash
# AscendC HelloWorld 一键运行脚本（教学版）
# 支持模式：npu（设备运行）/ cpu（CPU模拟）
# 使用方法：./run.sh -m 模式 [-v 芯片型号]
# 示例1：./run.sh -m npu -v Ascend310P3（310P3设备）
# 示例2：./run.sh -m cpu（无设备时模拟）

CURRENT_DIR=$(cd $(dirname \${BASH_SOURCE:-$0}) && pwd)
SHORT=v:m:,
LONG=soc-version:,mode:,
OPTS=$(getopt -a --options $SHORT --longoptions $LONG -- "$@")
eval set -- "$OPTS"
SOC_VERSION="Ascend910B3"
RUN_MODE="npu"

while :; do
    case "$1" in
    -v | --soc-version) SOC_VERSION="$2"; shift 2 ;;
    -m | --mode)        RUN_MODE="$2"; shift 2 ;;
    --)                 shift; break ;;
    *)                  echo "[ERROR] Unexpected option: $1"; break ;;
    esac
done

# NPU 模式：设置 ASCEND 环境变量
if [ "\${RUN_MODE}" == "npu" ]; then
    # 自动查找 ascend-toolkit 安装路径
    if [ -n "$ASCEND_INSTALL_PATH" ]; then
        _ASCEND_INSTALL_PATH=$ASCEND_INSTALL_PATH
    elif [ -n "$ASCEND_HOME_PATH" ]; then
        _ASCEND_INSTALL_PATH=$ASCEND_HOME_PATH
    else
        if [ -d "$HOME/Ascend/ascend-toolkit/latest" ]; then
            _ASCEND_INSTALL_PATH=$HOME/Ascend/ascend-toolkit/latest
        else
            _ASCEND_INSTALL_PATH=/usr/local/Ascend/ascend-toolkit/latest
        fi
    fi
    source $_ASCEND_INSTALL_PATH/bin/setenv.bash
fi

echo "Current compile soc version is \${SOC_VERSION}"
echo "Running in mode: \${RUN_MODE}"

rm -rf build && mkdir -p build
cmake -B build \\
    -DSOC_VERSION=\${SOC_VERSION} \\
    -DRUN_MODE=\${RUN_MODE} \\
    -DASCEND_CANN_PACKAGE_PATH=\${_ASCEND_INSTALL_PATH}
cmake --build build -j
cmake --install build

# 运行并验证（检查 "Hello World" 出现次数）
check_msg="Hello World"
file_path=output_msg.txt
./build/main | tee $file_path
count=$(grep -c "$check_msg" $file_path)

if [ $count -ne 8 ]; then
    echo "Error, Expected 8 occurrences of $check_msg, but found $count occurrences."
    exit 1
fi`} />
