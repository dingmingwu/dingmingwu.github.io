            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

                                        <p className="mt-3"><strong>提示：</strong></p>
                                        <ul className="list-disc list-inside space-y-1 ml-2">
                                            <li>参考 Lab 2 的 KernelAdd 和 Lab 3 的 KernelSigmoid</li>
                                            <li>Sinh 只有一个输入 x 和一个输出 y（与 Sigmoid 相同）</li>
                                            <li>Compute 中需要临时 LocalTensor 存放中间结果，记得释放</li>
                                            <li>使用 <code className="text-cyan-400">Muls(dst, src, (half)(-1.0), len)</code> 计算 -x</li>
                                            <li>使用 <code className="text-cyan-400">Muls(dst, src, (half)(0.5), len)</code> 除以 2</li>
                                        </ul>

                                <section id="faq" className="mb-16">

                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: Sinh 算子与 Sigmoid 算子的项目结构相同吗？</h4>
                                            <p className="text-sm text-slate-400">是的，两者项目结构完全相同：SinhCustom（算子核心）+ AclNNInvocation（测试工程）。区别仅在于 Compute 方法中的计算公式不同。</p>
                                        </div>
                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: Compute 中需要几个临时 LocalTensor？</h4>
                                            <p className="text-sm text-slate-400">至少需要 2-3 个临时缓冲区来存放 exp(x)、exp(-x) 等中间结果。可以复用缓冲区来减少内存占用。注意每个 AllocTensor 都需要对应的 FreeTensor。</p>
                                        </div>
                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: 遇到编译错误怎么办？</h4>
                                            <p className="text-sm text-slate-400">
                                                常见原因：<br/>
                                                1. 忘记 <code className="text-cyan-400">#include "kernel_operator.h"</code><br/>
                                                2. 未正确使用 <code className="text-cyan-400">using namespace AscendC;</code><br/>
                                                3. half 类型字面量需要后缀 <code className="text-cyan-400">h</code>（如 <code className="text-cyan-400">0.5h</code>、<code className="text-cyan-400">-1.0h</code>）或使用类型转换 <code className="text-cyan-400">(half)(-1.0)</code>
                                            </p>
                                        </div>
                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: 精度测试不通过？</h4>
                                            <p className="text-sm text-slate-400">Sinh 公式相对简单，通常不存在 Sigmoid 那样的 Reciprocal 精度问题。如果精度不通过，请检查：1) Muls 的标量值是否正确（-1 和 0.5）；2) Sub 的参数顺序是否正确（exp(x) - exp(-x)，不是反过来）；3) 是否有内存泄漏导致数据错乱。</p>
                                        </div>
                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: 更多常见问题？</h4>
