<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascend C 算子开发实践课程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const labs = [
            {
                num: '01',
                title: 'HelloAscendC',
                subtitle: '编程实践',
                desc: '从零搭建 AscendC 项目，理解 CPU/NPU 双模式编程模型，编写第一个 Hello World 核函数。',
                difficulty: 1,
                tags: ['入门', 'CPU/NPU', '核函数'],
                href: 'lab1.html'
            },
            {
                num: '02',
                title: 'Add 算子开发',
                subtitle: '实践课程',
                desc: '深入分析 Add 算子的完整实现，掌握 Tiling 分块策略、CopyIn/Compute/CopyOut 数据流水线。',
                difficulty: 2,
                tags: ['算子开发', 'Tiling', '数据流水线'],
                href: 'lab2.html'
            },
            {
                num: '03',
                title: 'Sigmoid 算子认证',
                subtitle: '实践课程',
                desc: '完成 Sigmoid 算子的 Host 端 Tiling 与 Kernel 端计算逻辑，解决精度问题并通过认证测试。',
                difficulty: 3,
                tags: ['认证考试', '精度优化', 'Sigmoid'],
                href: 'lab3.html'
            },
            {
                num: '04',
                title: 'Sinh 算子开发',
                subtitle: '实践课程',
                desc: '独立完成 Sinh 算子的 Kernel 端代码，综合运用前面所学的算子开发模式与调试技巧。',
                difficulty: 3,
                tags: ['综合实践', '独立开发', 'Sinh'],
                href: 'lab4.html'
            }
        ];

        const DifficultyStars = ({ level }) => (
            <div className="flex items-center gap-1">
                {[1, 2, 3].map(i => (
                    <svg key={i} width="14" height="14" viewBox="0 0 24 24" fill={i <= level ? 'rgb(6, 182, 212)' : 'none'} stroke="rgb(6, 182, 212)" strokeWidth="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                    </svg>
                ))}
            </div>
        );

        const LabCard = ({ lab }) => (
            <a href={lab.href} className="block no-underline group">
                <div className="glass-panel rounded-2xl p-6 h-full transition-all duration-300 group-hover:translate-y-[-4px]">
                    <div className="flex items-start justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <span className="text-cyan-500 font-mono text-3xl font-bold opacity-40">{lab.num}</span>
                            <div>
                                <h3 className="text-xl font-bold text-white group-hover:text-cyan-300 transition-colors">{lab.title}</h3>
                                <span className="text-xs font-mono text-slate-500">{lab.subtitle}</span>
                            </div>
                        </div>
                        <DifficultyStars level={lab.difficulty} />
                    </div>
                    <p className="text-slate-400 text-sm leading-relaxed mb-4">{lab.desc}</p>
                    <div className="flex flex-wrap gap-2">
                        {lab.tags.map((tag, i) => (
                            <span key={i} className="text-xs font-mono px-2 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">{tag}</span>
                        ))}
                    </div>
                    <div className="mt-4 flex items-center gap-2 text-sm font-mono text-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <span>进入实验</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </div>
            </a>
        );

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />

                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="../index.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Portfolio</span>
                            </a>
                            <div className="hidden md:flex gap-4">
                                {labs.map(l => (
                                    <a key={l.num} href={l.href} className="text-xs font-mono text-slate-500 hover:text-cyan-400 transition-colors no-underline">
                                        <span className="text-cyan-600">{l.num}</span> {l.title}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="pt-32 pb-16 px-6">
                        <div className="container mx-auto max-w-5xl text-center">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 border border-cyan-500/20 mb-6">
                                <i className="ph-fill ph-cpu text-cyan-400"></i>
                                <span className="text-sm font-mono text-cyan-400">Huawei Ascend</span>
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold text-white mb-4 tracking-tight">
                                Ascend C <span className="text-cyan-400">算子开发</span>实践课程
                            </h1>
                            
                            <div className="flex justify-center gap-6 mt-8 text-sm font-mono text-slate-500">
                                <div className="flex items-center gap-2"><i className="ph-fill ph-book-open text-cyan-500"></i> 4 个实验</div>
                                <div className="flex items-center gap-2"><i className="ph-fill ph-code text-cyan-500"></i> C++ / Python</div>
                                <div className="flex items-center gap-2"><i className="ph-fill ph-graduation-cap text-cyan-500"></i> 渐进难度</div>
                            </div>
                        </div>
                    </section>

                    {/* Lab Cards */}
                    <section className="px-6 pb-24">
                        <div className="container mx-auto max-w-5xl">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {labs.map(lab => <LabCard key={lab.num} lab={lab} />)}
                            </div>
                        </div>
                    </section>

                    {/* Learning Path */}
                    <section className="px-6 pb-24">
                        <div className="container mx-auto max-w-3xl">
                            <div className="text-center mb-12">
                                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// learning path</span>
                                <h2 className="text-3xl font-bold text-white">学习路径</h2>
                                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4 mx-auto"></div>
                            </div>
                            <div className="relative">
                                <div className="absolute left-6 top-0 bottom-0 w-px bg-gradient-to-b from-cyan-500/50 via-cyan-500/20 to-transparent"></div>
                                {[
                                    { step: '01', label: 'HelloAscendC', text: '理解 AscendC 基本编程模型，区分 CPU 模式与 NPU 模式' },
                                    { step: '02', label: 'Add 算子', text: '学习算子开发完整流程：Kernel 编写、数据生成、结果验证' },
                                    { step: '03', label: 'Sigmoid 算子', text: '掌握认证考试要求，填充 Tiling/Kernel 代码，解决精度问题' },
                                    { step: '04', label: 'Sinh 算子', text: '独立完成算子开发，综合运用所学知识' },
                                ].map((item, i) => (
                                    <div key={i} className="flex items-start gap-4 mb-8 ml-2">
                                        <div className="w-9 h-9 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-mono text-sm font-bold shrink-0 relative z-10">{item.step}</div>
                                        <div className="pt-1">
                                            <h4 className="text-white font-bold">{item.label}</h4>
                                            <p className="text-slate-400 text-sm">{item.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="border-t border-white/5 py-8 px-6">
                        <div className="container mx-auto max-w-5xl text-center">
                            <p className="text-sm text-slate-600 font-mono">Shenzhen University &middot; College of Computer Science &amp; Software Engineering</p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
