                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;

                                    <h4 className="text-lg font-bold text-white mb-3">1. 内核入口函数 add_custom</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — 入口" code={`extern "C" __global__ __aicore__ void add_custom(GM_ADDR x, GM_ADDR y, GM_ADDR z,
    AddCustomTilingData tiling)
{
    KernelAdd op;
    op.Init(x, y, z, tiling.totalLength, tiling.tileNum);
    op.Process();
}`} />
                                    <p className="text-sm text-slate-400 mb-6">创建 KernelAdd 实例，调用 Init 初始化内核，然后调用 Process 执行数据处理。</p>

                                    <h4 className="text-lg font-bold text-white mb-3">2. Init 方法 — 初始化</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — Init" code={`__aicore__ inline void Init(GM_ADDR x, GM_ADDR y, GM_ADDR z,
    uint32_t totalLength, uint32_t tileNum)
{
    // 计算当前 AI Core 负责的数据块长度
    this->blockLength = totalLength / AscendC::GetBlockNum();
    this->tileNum = tileNum;
    this->tileLength = this->blockLength / tileNum / BUFFER_NUM;

    // 设置全局内存张量（指向各 AI Core 负责的偏移位置）
    xGm.SetGlobalBuffer((__gm__ half *)x + this->blockLength *
        AscendC::GetBlockIdx(), this->blockLength);
    yGm.SetGlobalBuffer((__gm__ half *)y + this->blockLength *
        AscendC::GetBlockIdx(), this->blockLength);
    zGm.SetGlobalBuffer((__gm__ half *)z + this->blockLength *
        AscendC::GetBlockIdx(), this->blockLength);

    // 初始化双缓冲队列
    pipe.InitBuffer(inQueueX, BUFFER_NUM, this->tileLength * sizeof(half));
    pipe.InitBuffer(inQueueY, BUFFER_NUM, this->tileLength * sizeof(half));
    pipe.InitBuffer(outQueueZ, BUFFER_NUM, this->tileLength * sizeof(half));
}`} />
                                    <div className="text-sm text-slate-400 mb-6 space-y-1">
                                        <p><code className="text-cyan-400">blockLength</code>：每个 AI Core 处理的数据总量 = totalLength / 核心数</p>
                                        <p><code className="text-cyan-400">tileLength</code>：每次 CopyIn 的数据量 = blockLength / tileNum / BUFFER_NUM</p>
                                        <p><code className="text-cyan-400">BUFFER_NUM = 2</code>：双缓冲，实现流水线并行</p>
                                    </div>

                                    <h4 className="text-lg font-bold text-white mb-3">3. Process 方法 — 主循环</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — Process" code={`__aicore__ inline void Process()
{
    int32_t loopCount = this->tileNum * BUFFER_NUM;
    for (int32_t i = 0; i < loopCount; i++) {
        CopyIn(i);
        Compute(i);
        CopyOut(i);
    }
}`} />

                                    <h4 className="text-lg font-bold text-white mb-3">4. CopyIn — 全局内存 → 局部内存</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — CopyIn" code={`__aicore__ inline void CopyIn(int32_t progress)
{
    AscendC::LocalTensor<half> xLocal = inQueueX.AllocTensor<half>();
    AscendC::LocalTensor<half> yLocal = inQueueY.AllocTensor<half>();
    AscendC::DataCopy(xLocal, xGm[progress * this->tileLength], this->tileLength);
    AscendC::DataCopy(yLocal, yGm[progress * this->tileLength], this->tileLength);
    inQueueX.EnQue(xLocal);
    inQueueY.EnQue(yLocal);
}`} />
                                    <p className="text-sm text-slate-400 mb-6">从全局内存中将当前分块的数据拷贝到局部内存（LocalTensor），然后入队到输入队列。</p>

                                    <h4 className="text-lg font-bold text-white mb-3">5. Compute — 执行加法运算</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — Compute" code={`__aicore__ inline void Compute(int32_t progress)
{
    AscendC::LocalTensor<half> xLocal = inQueueX.DeQue<half>();
    AscendC::LocalTensor<half> yLocal = inQueueY.DeQue<half>();
    AscendC::LocalTensor<half> zLocal = outQueueZ.AllocTensor<half>();
    AscendC::Add(zLocal, xLocal, yLocal, this->tileLength);
    outQueueZ.EnQue<half>(zLocal);
    inQueueX.FreeTensor(xLocal);
    inQueueY.FreeTensor(yLocal);
}`} />
                                    <p className="text-sm text-slate-400 mb-6">从输入队列取出 xLocal 和 yLocal，分配输出缓冲区 zLocal，调用 <code className="text-cyan-400">AscendC::Add</code> 逐元素相加，结果入队到输出队列，释放输入缓冲。</p>

                                    <h4 className="text-lg font-bold text-white mb-3">6. CopyOut — 局部内存 → 全局内存</h4>
                                    <CodeBlock lang="cpp" filename="add_custom.cpp — CopyOut" code={`__aicore__ inline void CopyOut(int32_t progress)
{
    AscendC::LocalTensor<half> zLocal = outQueueZ.DeQue<half>();
    AscendC::DataCopy(zGm[progress * this->tileLength], zLocal, this->tileLength);
    outQueueZ.FreeTensor(zLocal);
}`} />

                                    <CodeBlock lang="cpp" filename="main.cpp — CPU 调试模式" code={`#ifdef ASCENDC_CPU_DEBUG
    // 内存分配（全局内存模拟）
    uint8_t *tiling = (uint8_t *)AscendC::GmAlloc(tilingSize);
    uint8_t *x = (uint8_t *)AscendC::GmAlloc(inputByteSize);
    uint8_t *y = (uint8_t *)AscendC::GmAlloc(inputByteSize);
    uint8_t *z = (uint8_t *)AscendC::GmAlloc(outputByteSize);

    // 读取输入数据
    ReadFile("./input/input_tiling.bin", tilingSize, tiling, tilingSize);
    ReadFile("./input/input_x.bin", inputByteSize, x, inputByteSize);
    ReadFile("./input/input_y.bin", inputByteSize, y, inputByteSize);

    // 设置内核模式并运行
    AscendC::SetKernelMode(KernelMode::AIV_MODE);
    ICPU_RUN_KF(add_custom, blockDim, x, y, z,
                *reinterpret_cast<AddCustomTilingData *>(tiling));

    WriteFile("./output/output_z.bin", z, outputByteSize);
    // 释放内存...
#endif`} />
                                    <CodeBlock lang="cpp" filename="main.cpp — NPU 设备模式" code={`#else
    CHECK_ACL(aclInit(nullptr));
    int32_t deviceId = 0;
    CHECK_ACL(aclrtSetDevice(deviceId));
    aclrtStream stream = nullptr;
    CHECK_ACL(aclrtCreateStream(&stream));

    // 分配主机内存（Host）和设备内存（Device）
    CHECK_ACL(aclrtMallocHost((void **)&xHost, inputByteSize));
    CHECK_ACL(aclrtMalloc((void **)&xDevice, inputByteSize, ACL_MEM_MALLOC_HUGE_FIRST));
    // ... 同理分配 yHost/yDevice, zHost/zDevice, tiling ...

    // 数据拷贝到设备
    CHECK_ACL(aclrtMemcpy(xDevice, inputByteSize, xHost, inputByteSize, ACL_MEMCPY_HOST_TO_DEVICE));

    // 启动核函数
    ACLRT_LAUNCH_KERNEL(add_custom)(blockDim, stream, xDevice, yDevice, zDevice, tiling);
    CHECK_ACL(aclrtSynchronizeStream(stream));

    // 将结果拷贝回主机
    CHECK_ACL(aclrtMemcpy(zHost, outputByteSize, zDevice, outputByteSize, ACL_MEMCPY_DEVICE_TO_HOST));
    // 释放所有资源...
#endif`} />

                                    <p className="text-slate-400 mb-4 text-sm">生成随机测试数据和标准答案（golden data）。输入为两个 [8, 2048] 的 float16 矩阵，golden = input_x + input_y。</p>
                                    <CodeBlock lang="python" filename="gen_data.py" code={`import numpy as np

def gen_golden_data_simple():
    input_x = np.random.uniform(1, 100, [8, 2048]).astype(np.float16)
    input_y = np.random.uniform(1, 100, [8, 2048]).astype(np.float16)
    golden = (input_x + input_y).astype(np.float16)

    # Tiling 信息：[totalLength=16384, tileNum=8]
    tiling = np.array([16384, 8], dtype=np.uint32)

    tiling.tofile("./input/input_tiling.bin")
    input_x.tofile("./input/input_x.bin")
    input_y.tofile("./input/input_y.bin")
    golden.tofile("./output/golden.bin")

if __name__ == "__main__":
    gen_golden_data_simple()`} />

                                    <p className="text-slate-400 mb-4 text-sm">使用 numpy 的 <code className="text-cyan-400">isclose</code> 函数比较实际输出与标准数据，允许相对误差 1e-3 和绝对误差 1e-5。</p>
                                    <CodeBlock lang="python" filename="verify_result.py" code={`import sys
import numpy as np

relative_tol = 1e-3
absolute_tol = 1e-5
error_tol = 1e-3

def verify_result(output, golden):
    output = np.fromfile(output, dtype=np.float16).reshape(-1)
    golden = np.fromfile(golden, dtype=np.float16).reshape(-1)
    different_element_results = np.isclose(output, golden,
                                           rtol=relative_tol,
                                           atol=absolute_tol,
                                           equal_nan=True)
    error_ratio = float(np.where(different_element_results == False)[0].size) / golden.size
    print("error ratio: %.4f, tolerance: %.4f" % (error_ratio, error_tol))
    return error_ratio <= error_tol

if __name__ == '__main__':
    try:
        res = verify_result(sys.argv[1], sys.argv[2])
        if not res:
            raise ValueError("[ERROR] result error")
        else:
            print("test pass")
    except Exception as e:
        print(e)
        sys.exit(1)`} />
