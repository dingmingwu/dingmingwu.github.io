                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;

const uint32_t BLOCK_DIM = 8;
const uint32_t TILE_NUM = 8;

static ge::graphStatus TilingFunc(gert::TilingContext* context)
{
    SigmoidCustomTilingData tiling;
    // 考生自行填充：
    uint32_t totalLength = context->GetInputShape(0)->
        GetOriginShape().GetShapeSize();
    context->SetBlockDim(BLOCK_DIM);
    tiling.set_totalLength(totalLength);
    tiling.set_tileNum(TILE_NUM);
    tiling.SaveToBuffer(context->GetRawTilingData()->GetData(),
        context->GetRawTilingData()->GetCapacity());
    context->GetRawTilingData()->SetDataSize(tiling.GetDataSize());
    size_t *currentWorkspace = context->GetWorkspaceSizes(1);
    currentWorkspace[0] = 0;
    return ge::GRAPH_SUCCESS;
}
}`} />

static ge::graphStatus InferShape(gert::InferShapeContext* context)
{

static ge::graphStatus InferDataType(gert::InferDataTypeContext *context)
{
    const auto inputDataType = context->GetInputDataType(0);
    context->SetOutputDataType(0, inputDataType);
    return ge::GRAPH_SUCCESS;
}

};
OP_ADD(SigmoidCustom);
}`} />

                                <section id="faq" className="mb-16">
                                    <SectionHeader title="常见问题" subtitle="FAQ" />
                                    <div className="space-y-4">
                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: Adds/Muls 与 Add/Mul 有什么区别？</h4>
                                            <p className="text-sm text-slate-400">
                                                <code className="text-cyan-400">Adds</code> / <code className="text-cyan-400">Muls</code>：<strong>向量与标量</strong>的运算（一个向量/矩阵与一个数的逐元素加/乘）。<br/>
                                                <code className="text-cyan-400">Add</code> / <code className="text-cyan-400">Mul</code>：<strong>向量与向量</strong>的运算（两个向量/矩阵的逐元素加/乘）。
                                            </p>
                                        </div>

                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: 申请新的向量空间后需要注意什么？</h4>
                                            <p className="text-sm text-slate-400">使用完成后需要对该向量空间进行释放空间资源，<strong>避免出现内存泄漏</strong>。每个 AllocTensor 都要对应一个 FreeTensor。</p>
                                        </div>

                                        <div className="glass-panel rounded-xl p-6">
                                            <h4 className="text-white font-bold mb-2">Q: 遇到 "Get Operator Workspace failed. error code is 161001" 怎么办？</h4>
                                            <div className="text-sm text-slate-400 space-y-1">
                                                <p>可能原因1：检查代码中是否有修改芯片选型为 <code className="text-cyan-400">Ascend310P</code></p>
                                                <p>可能原因2：NPU 内核出现问题，可能是有同学代码资源没释放所导致</p>
                                            </div>
                                        </div>

                                        <div className="glass-panel rounded-xl p-6" style={{ borderColor: 'rgba(234, 179, 8, 0.2)' }}>
                                            <h4 className="text-yellow-400 font-bold mb-3">Q: Reciprocal 在 float16 精度下误差大于 0.001，如何解决？</h4>
                                            <p className="text-sm text-slate-400 mb-4">Sigmoid 的标准实现 <Tex tex={"1/(1+e^{-x})"} /> 中使用 Reciprocal 可能产生精度缺失。有两种解决方案：</p>

                                            <div className="p-4 rounded-lg bg-slate-800/50 mb-4">
                                                <h5 className="text-cyan-400 font-bold mb-2">方案 1：修改计算公式（推荐）</h5>
                                                <div className="text-center py-2 mb-2">
                                                    <Tex tex={"\\displaystyle \\text{Sigmoid}(x) = \\frac{1 \\cdot \\exp(x)}{(1 + \\exp(-x)) \\cdot \\exp(x)} = \\frac{\\exp(x)}{\\exp(x) + 1}"} />
                                                </div>
                                                <div className="text-sm text-slate-400 font-mono space-y-1 p-3 bg-slate-900/50 rounded">
                                                    <p>1. 计算 exp(xLocal)  → 使用 Exp 算子</p>
                                                    <p>2. 计算 1 + exp(xLocal)  → 使用 Adds 算子</p>
                                                    <p>3. 计算 exp(xLocal) / (1 + exp(xLocal))  → 使用 Div 算子</p>
                                                </div>
                                            </div>

                                            <div className="p-4 rounded-lg bg-slate-800/50">
                                                <h5 className="text-cyan-400 font-bold mb-2">方案 2：牛顿迭代法 HighPrecisionReciprocal</h5>
                                                <p className="text-sm text-slate-400 mb-2">用牛顿迭代法构建私有函数，提升 Reciprocal 精度：</p>
                                                <CodeBlock lang="cpp" filename="HighPrecisionReciprocal" code={`__aicore__ inline void HighPrecisionReciprocal(
    LocalTensor<half>& dst,
    const LocalTensor<half>& src,
    int32_t length,
    int iterations = 2)
{
    LocalTensor<half> tmp = tmpBuffer.Get<half>();
    half two = 2.0h, negone = -1.0h;

    // 初始近似值（使用硬件 Reciprocal 的初始值）
    AscendC::Reciprocal(dst, src, length);

    // 牛顿迭代: x_{n+1} = x_n * (2 - a * x_n)
    for (int i = 0; i < iterations; ++i) {
        AscendC::Mul(tmp, src, dst, length);      // tmp = a * x_n
        AscendC::Muls(tmp, tmp, negone, length);  // tmp = 2 - a * x_n
        AscendC::Adds(tmp, tmp, two, length);
        AscendC::Mul(dst, dst, tmp, length);       // x_{n+1} = x_n * tmp
    }
}`} />
                                                <p className="text-sm text-slate-400 mt-2">然后在 Compute 中用 HighPrecisionReciprocal 替代 Reciprocal：</p>
                                                <div className="text-sm text-slate-400 font-mono space-y-1 p-3 bg-slate-900/50 rounded mt-2">
                                                    <p>1. 计算 -xLocal  → Muls 算子（乘以 -1）</p>
                                                    <p>2. 计算 exp(-xLocal)  → Exp 算子</p>
                                                    <p>3. 计算 1 + exp(-xLocal)  → Adds 算子</p>
                                                    <p>4. 计算 1 / (1 + exp(-xLocal))  → HighPrecisionReciprocal</p>
                                                </div>
                                            </div>
                                        </div>
