<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divide and Conquer - Algorithm Design and Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8">
                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// {subtitle}</span>
                <h2 className="text-3xl md:text-4xl font-bold text-white tracking-tight">{title}</h2>
                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4"></div>
            </div>
        );

        const StepButton = ({ step, setStep, maxStep, label }) => (
            <div className="flex items-center gap-3 mt-4">
                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-base font-mono hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Prev</button>
                <button onClick={() => setStep(Math.min(maxStep, step + 1))} disabled={step >= maxStep} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-base font-mono hover:bg-cyan-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Next</button>
                <span className="text-base text-slate-500 font-mono">{label || `Step ${step} / ${maxStep}`}</span>
            </div>
        );

        const KnowledgeCard = ({ title, children, onClick, active }) => (
            <div
                className={`glass-panel p-6 rounded-xl mb-4 transition-all duration-200 ${onClick ? 'cursor-pointer' : ''}`}
                onClick={onClick}
                style={active ? { borderColor: 'rgba(0, 240, 255, 0.5)', boxShadow: '0 0 20px rgba(0, 240, 255, 0.15)' } : {}}
            >
                <h4 className="text-lg font-bold mb-2 text-white">{title}</h4>
                {children && <div className="text-slate-400 text-base leading-relaxed">{children}</div>}
            </div>
        );

        const Tex = ({ tex, display }) => {
            const html = katex.renderToString(tex, { throwOnError: false, displayMode: !!display });
            return display
                ? <div dangerouslySetInnerHTML={{ __html: html }} />
                : <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        const sections = [
            { id: 'complexity', num: '01', title: '算法复杂度分析', titleEn: 'Complexity Analysis' },
            { id: 'divide', num: '02', title: '分治法', titleEn: 'Divide and Conquer' },
            { id: 'backtrack', num: '03', title: '回溯法', titleEn: 'Backtracking' },
            { id: 'dp', num: '04', title: '动态规划', titleEn: 'Dynamic Programming' },
            { id: 'greedy', num: '05', title: '贪心法', titleEn: 'Greedy Algorithms' },
            { id: 'maxflow', num: '06', title: '最大流', titleEn: 'Maximum Flow' },
            { id: 'amortized', num: '07', title: '摊还分析', titleEn: 'Amortized Analysis' },
            { id: 'np', num: '08', title: 'NP理论', titleEn: 'NP Theory' },
        ];

        const MergeSortAnimation = () => {
            const initial = [5, 3, 8, 1, 6, 2, 7, 4];
            const [step, setStep] = useState(0);

            const computeSteps = () => {
                const steps = [];
                steps.push({ label: 'Initial array', groups: [[...initial]], phase: 'init' });
                steps.push({ label: 'Split → 2 halves', groups: [[5,3,8,1],[6,2,7,4]], phase: 'split' });
                steps.push({ label: 'Split → 4 groups', groups: [[5,3],[8,1],[6,2],[7,4]], phase: 'split' });
                steps.push({ label: 'Split → 8 singles', groups: [[5],[3],[8],[1],[6],[2],[7],[4]], phase: 'split' });
                steps.push({ label: 'Merge pairs (sorted)', groups: [[3,5],[1,8],[2,6],[4,7]], phase: 'merge' });
                steps.push({ label: 'Merge groups of 4', groups: [[1,3,5,8],[2,4,6,7]], phase: 'merge' });
                steps.push({ label: 'Final merge — sorted!', groups: [[1,2,3,4,5,6,7,8]], phase: 'merge' });
                return steps;
            };
            const steps = computeSteps();
            const currentStep = steps[Math.min(step, steps.length - 1)];
            const w = 500, h = 120;

            return (
                <div>
                    <div className="text-base font-mono mb-3" style={{ color: currentStep.phase === 'split' ? '#fbbf24' : currentStep.phase === 'merge' ? '#34d399' : '#94a3b8' }}>{currentStep.label}</div>
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-lg mx-auto">
                        {(() => {
                            const groups = currentStep.groups;
                            const totalItems = groups.reduce((s, g) => s + g.length, 0);
                            const gapBetweenGroups = 12;
                            const totalGaps = (groups.length - 1) * gapBetweenGroups;
                            const cellW = Math.min(45, (w - 40 - totalGaps) / totalItems);
                            const cellH = 40;
                            const totalW = totalItems * cellW + totalGaps;
                            let offsetX = (w - totalW) / 2;
                            const y = (h - cellH) / 2;

                            return groups.map((group, gi) => {
                                const elems = group.map((val, vi) => {
                                    const x = offsetX + vi * cellW;
                                    return (
                                        <g key={`${gi}-${vi}`}>
                                            <rect x={x} y={y} width={cellW - 2} height={cellH} rx="4" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" strokeWidth="1" />
                                            <text x={x + (cellW - 2) / 2} y={y + cellH / 2 + 5} fill="white" fontSize="16" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">{val}</text>
                                        </g>
                                    );
                                });
                                offsetX += group.length * cellW + gapBetweenGroups;
                                return elems;
                            });
                        })()}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />

                    <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                        <div className="text-slate-500 font-mono text-base">{'// 归并排序三步骤'}</div>
                        {[
                            { label: '分解', color: '#fbbf24', desc: '将数组从中间一分为二，分成两个子数组' },
                            { label: '解决', color: '#34d399', desc: '递归地对两个子数组进行归并排序' },
                            { label: '合并', color: '#22d3ee', desc: <span>将两个已排好序的子数组合并成一个有序数组（这是算法的核心难点，也是 <Tex tex="O(n)" /> 的来源）</span> },
                        ].map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5"
                                    style={{ color: item.color, background: item.color + '18', border: `1px solid ${item.color}44` }}>
                                    {item.label}
                                </span>
                                <span className="text-slate-400 text-base leading-relaxed">{item.desc}</span>
                            </div>
                        ))}
                        <div className="pt-1 border-t border-white/5 text-base text-slate-400">
                            时间复杂度：<Tex tex="T(n) = 2T(n/2) + O(n) \Rightarrow T(n)=O(n \log n)" />
                        </div>
                    </div>
                </div>
            );
        };

        const QuickSortAnimation = () => {
            const [step, setStep] = useState(0);

            const typeColors = {
                normal: { fill: 'rgba(148,163,184,0.12)', stroke: '#475569',  text: '#e2e8f0' },
                pivot:  { fill: 'rgba(251,191,36,0.2)',   stroke: '#fbbf24',  text: '#fbbf24' },
                left:   { fill: 'rgba(167,139,250,0.15)', stroke: '#a78bfa',  text: '#a78bfa' },
                right:  { fill: 'rgba(34,211,238,0.15)',  stroke: '#22d3ee',  text: '#22d3ee' },
                sorted: { fill: 'rgba(52,211,153,0.15)',  stroke: '#34d399',  text: '#34d399' },
            };

            const steps = [
                {
                    label: '初始数组 — 选择末位元素 4 作为 pivot',
                    phase: 'init',
                    groups: [
                        { vals: [5,3,8,1,6,2,7], type: 'normal' },
                        { vals: [4], type: 'pivot' },
                    ],
                },
                {
                    label: 'Partition：小于 pivot 移至左侧，大于 pivot 移至右侧',
                    phase: 'partition',
                    groups: [
                        { vals: [3,1,2], type: 'left' },
                        { vals: [4],     type: 'pivot' },
                        { vals: [5,8,6,7], type: 'right' },
                    ],
                },
                {
                    label: '递归：对左右子数组分别选新 pivot 并 Partition',
                    phase: 'recurse',
                    groups: [
                        { vals: [1],   type: 'left'   },
                        { vals: [2],   type: 'pivot'  },
                        { vals: [3],   type: 'right'  },
                        { vals: [4],   type: 'sorted' },
                        { vals: [5,6], type: 'left'   },
                        { vals: [7],   type: 'pivot'  },
                        { vals: [8],   type: 'right'  },
                    ],
                },
                {
                    label: '排序完成！',
                    phase: 'done',
                    groups: [{ vals: [1,2,3,4,5,6,7,8], type: 'sorted' }],
                },
            ];

            const current = steps[step];
            const phaseColor = { init: '#94a3b8', partition: '#fbbf24', recurse: '#a78bfa', done: '#34d399' }[current.phase];
            const w = 500, h = 118, cellH = 40, gap = 14, cellY = 62;

            return (
                <div>
                    <div className="text-base font-mono mb-3" style={{ color: phaseColor }}>{current.label}</div>
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-lg mx-auto">
                        {(() => {
                            const totalItems = current.groups.reduce((s, g) => s + g.vals.length, 0);
                            const totalGaps = (current.groups.length - 1) * gap;
                            const cellW = Math.min(45, (w - 40 - totalGaps) / totalItems);
                            const totalW = totalItems * cellW + totalGaps;
                            let offsetX = (w - totalW) / 2;
                            return current.groups.map((group, gi) => {
                                const c = typeColors[group.type];
                                const isPivot = group.type === 'pivot';
                                const elems = group.vals.map((val, vi) => {
                                    const x = offsetX + vi * cellW;
                                    const cx = x + (cellW - 2) / 2;
                                    return (
                                        <g key={`${gi}-${vi}`}>
                                            {isPivot && (
                                                <>
                                                    <text x={cx} y={cellY - 18} fontSize="10" fill="#fbbf24"
                                                        textAnchor="middle" fontFamily="JetBrains Mono">pivot</text>
                                                    <polygon
                                                        points={`${cx - 5},${cellY - 13} ${cx + 5},${cellY - 13} ${cx},${cellY - 5}`}
                                                        fill="#fbbf24" opacity="0.8" />
                                                </>
                                            )}
                                            <rect x={x} y={cellY} width={cellW - 2} height={cellH} rx="4"
                                                fill={c.fill} stroke={c.stroke} strokeWidth="1.5" />
                                            <text x={cx} y={cellY + cellH / 2 + 5}
                                                fill={c.text} fontSize="16" fontWeight="bold"
                                                textAnchor="middle" fontFamily="JetBrains Mono">{val}</text>
                                        </g>
                                    );
                                });
                                offsetX += group.vals.length * cellW + gap;
                                return elems;
                            });
                        })()}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1}
                        label={['初始', 'Partition', '递归', '完成'][step]} />

                    <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                        <div className="text-slate-500 font-mono text-base">{'// 快速排序三步骤'}</div>
                        {[
                            { label: '分解', color: '#fbbf24', desc: <span>选择一个基准元素 (pivot)，将数组分为两部分：一部分比 pivot 小，一部分比 pivot 大（这一步叫做 Partition）</span> },
                            { label: '解决', color: '#34d399', desc: '递归地对这两部分进行快速排序' },
                            { label: '合并', color: '#22d3ee', desc: '不需要特殊的合并步骤，因为原数组已经在原处（in-place）被重排好了' },
                        ].map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5"
                                    style={{ color: item.color, background: item.color + '18', border: `1px solid ${item.color}44` }}>
                                    {item.label}
                                </span>
                                <span className="text-slate-400 text-base leading-relaxed">{item.desc}</span>
                            </div>
                        ))}
                        <div className="pt-1 border-t border-white/5 text-base text-slate-400">
                            时间复杂度：平均 <Tex tex="O(n \log n)" />，最坏 <Tex tex="O(n^2)" />
                        </div>
                    </div>
                </div>
            );
        };

        const BinarySearchAnimation = () => {
            const [step, setStep] = useState(0);

            const arr = [1, 3, 5, 7, 9, 11, 13, 15];
            const target = 13;

            const C = {
                active: { fill: 'rgba(34,211,238,0.10)',  stroke: '#22d3ee55', text: '#94a3b8' },
                mid:    { fill: 'rgba(251,191,36,0.20)',  stroke: '#fbbf24',   text: '#fbbf24' },
                found:  { fill: 'rgba(52,211,153,0.20)',  stroke: '#34d399',   text: '#34d399' },
                elim:   { fill: 'rgba(15,23,42,0.40)',    stroke: '#1e293b',   text: '#1e293b' },
            };

            const steps = [
                {
                    label: `在有序数组中查找 target = ${target}，计算 mid = 3，arr[3] = 7`,
                    phase: 'init',
                    types: ['active','active','active','mid','active','active','active','active'],
                    annotation: 'lo = 0,    hi = 7,    mid = 3',
                },
                {
                    label: 'arr[3] = 7 < 13，目标在右半段，新范围 [4..7]，mid = 5',
                    phase: 'search',
                    types: ['elim','elim','elim','elim','active','mid','active','active'],
                    annotation: 'lo = 4,    hi = 7,    mid = 5',
                },
                {
                    label: 'arr[5] = 11 < 13，目标在右半段，新范围 [6..7]，mid = 6',
                    phase: 'search',
                    types: ['elim','elim','elim','elim','elim','elim','mid','active'],
                    annotation: 'lo = 6,    hi = 7,    mid = 6',
                },
                {
                    label: 'arr[6] = 13 = target，查找成功！',
                    phase: 'found',
                    types: ['elim','elim','elim','elim','elim','elim','found','elim'],
                    annotation: '返回 index = 6',
                },
            ];

            const current = steps[step];
            const phaseColor = { init: '#94a3b8', search: '#fbbf24', found: '#34d399' }[current.phase];
            const w = 500, h = 112, cellH = 40, cellW = 48, gap = 4, cellY = 44;

            return (
                <div>
                    <div className="text-base font-mono mb-3 leading-relaxed" style={{ color: phaseColor, minHeight: '2.5rem' }}>
                        {current.label}
                    </div>
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-lg mx-auto">
                        {(() => {
                            const totalW = arr.length * cellW + (arr.length - 1) * gap;
                            const startX = (w - totalW) / 2;
                            return arr.map((val, i) => {
                                const x = startX + i * (cellW + gap);
                                const cx = x + cellW / 2;
                                const type = current.types[i];
                                const c = C[type];
                                return (
                                    <g key={i}>
                                        {type === 'mid' && (
                                            <>
                                                <text x={cx} y={cellY - 16} fontSize="10" fill="#fbbf24"
                                                    textAnchor="middle" fontFamily="JetBrains Mono">mid</text>
                                                <polygon points={`${cx-5},${cellY-11} ${cx+5},${cellY-11} ${cx},${cellY-3}`}
                                                    fill="#fbbf24" opacity="0.85" />
                                            </>
                                        )}
                                        {type === 'found' && (
                                            <>
                                                <text x={cx} y={cellY - 16} fontSize="10" fill="#34d399"
                                                    textAnchor="middle" fontFamily="JetBrains Mono">found</text>
                                                <polygon points={`${cx-5},${cellY-11} ${cx+5},${cellY-11} ${cx},${cellY-3}`}
                                                    fill="#34d399" opacity="0.85" />
                                            </>
                                        )}
                                        <rect x={x} y={cellY} width={cellW} height={cellH} rx="4"
                                            fill={c.fill} stroke={c.stroke} strokeWidth="1.5" />
                                        <text x={cx} y={cellY + cellH / 2 + 5}
                                            fill={c.text} fontSize="16" fontWeight="bold"
                                            textAnchor="middle" fontFamily="JetBrains Mono">{val}</text>
                                        <text x={cx} y={cellY + cellH + 13}
                                            fill="#334155" fontSize="10"
                                            textAnchor="middle" fontFamily="JetBrains Mono">{i}</text>
                                    </g>
                                );
                            });
                        })()}
                    </svg>
                    <div className="font-mono text-base text-slate-500 mt-1 text-center tracking-widest">
                        {current.annotation}
                    </div>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1}
                        label={['初始', '第 1 次', '第 2 次', '找到'][step]} />

                    <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                        <div className="text-slate-500 font-mono text-base">{'// 二分查找三步骤'}</div>
                        {[
                            { label: '分解', color: '#fbbf24', desc: '计算中间位置，将查找范围一分为二' },
                            { label: '解决', color: '#34d399', desc: '判断目标值与中间值的大小，决定是去左边找还是去右边找（只处理一边）' },
                            { label: '合并', color: '#22d3ee', desc: '无需合并' },
                        ].map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5"
                                    style={{ color: item.color, background: item.color + '18', border: `1px solid ${item.color}44` }}>
                                    {item.label}
                                </span>
                                <span className="text-slate-400 text-base leading-relaxed">{item.desc}</span>
                            </div>
                        ))}
                        <div className="pt-1 border-t border-white/5 text-base text-slate-400">
                            时间复杂度：<Tex tex="T(n) = T(n/2) + O(1) \Rightarrow T(n)=O(\log n)" />
                        </div>
                    </div>
                </div>
            );
        };

        const FastExpAnimation = () => {
            const [step, setStep] = useState(0);
            const powers = [
                { exp: 1, bit: 1, selected: true  },
                { exp: 2, bit: 0, selected: false },
                { exp: 4, bit: 1, selected: true  },
                { exp: 8, bit: 1, selected: true  },
            ];
            const W = 420, H = 104;
            const boxW = 62, boxH = 44, gap = 30;
            const startX = 18, boxY = 30;

            const cellFill = (p) => p.selected
                ? { fill: 'rgba(34,211,238,0.18)', stroke: '#22d3ee' }
                : { fill: 'rgba(15,23,42,0.6)',    stroke: '#1e293b' };
            const cellText = (p) => p.selected ? '#22d3ee' : '#334155';

            const stepLabels = [
                <span>计算 <Tex tex="x^n" />，将指数 <Tex tex="n=13" /> 写成二进制 <Tex tex="13 = (1101)_2" />，确定需要哪些幂次（位为 1 的对应幂次参与最终连乘）</span>,
                <span>从 <Tex tex="x^1" /> 开始反复平方，推导所有候选幂次（共 3 次平方）</span>,

                                    <polygon points="0 0, 8 4, 0 8" fill={divideColor} />
                                </marker>
                                <marker id="dc-com" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                                    <polygon points="0 0, 8 4, 0 8" fill={combineColor} />
                                </marker>
                            </defs>

                            <rect x={ox} y={oy} width={ow} height={oh} rx="6"
                                fill={step === 3 ? 'rgba(34,211,238,0.12)' : 'rgba(148,163,184,0.08)'}
                                stroke={step === 3 ? combineColor : '#475569'}
                                strokeWidth={step === 0 || step === 3 ? 2 : 1.5} />
                            <text x={ox + ow / 2} y={oy + oh / 2 + 5}
                                fill={step === 3 ? combineColor : '#e2e8f0'}
                                fontSize="13" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">
                                {step === 3 ? 'Solution(n)' : 'Problem(n)'}
                            </text>

                            {step >= 1 && step < 3 && subTops.map((t, i) => (
                                <line key={i}
                                    x1={arrowFrom.x} y1={arrowFrom.y} x2={t.x} y2={t.y}
                                    stroke={divideColor} strokeWidth="1.5" opacity="0.75"
                                    markerEnd="url(#dc-div)" />
                            ))}

                            {step === 3 && subTops.map((t, i) => (
                                <line key={i}
                                    x1={t.x} y1={t.y} x2={arrowFrom.x} y2={arrowFrom.y}
                                    stroke={combineColor} strokeWidth="1.5" opacity="0.8"
                                    markerEnd="url(#dc-com)" />
                            ))}

                            {step >= 1 && subs.map((s, i) => {
                                const color = step === 2 ? conquerColor : step === 3 ? combineColor : divideColor;
                                return (
                                    <g key={i}>
                                        <rect x={s.x} y={s.y} width={s.w} height={s.h} rx="5"
                                            fill={`${color}18`} stroke={color} strokeWidth="1.5" />
                                        <text x={s.x + s.w / 2} y={s.y + s.h / 2 + 4}
                                            fill={color} fontSize="12" textAnchor="middle" fontFamily="JetBrains Mono">
                                            {step >= 2 ? `子问题 ${i + 1} ✓` : `子问题 ${i + 1}`}
                                        </text>
                                    </g>
                                );
                            })}

                            {step > 0 && (
                                <text x={W / 2} y={H - 4} fontSize="11" textAnchor="middle"
                                    fontFamily="JetBrains Mono" fill={phaseColor} opacity="0.6">
                                    {['', '── 分解 ──', '── 解决 ──', '── 合并 ──'][step]}
                                </text>
                            )}
                        </svg>

                        <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                            <div className="text-slate-500 font-mono text-base">{'// 分治法适用条件'}</div>
                            {conditions.map((c, i) => (
                                <div key={i} className="flex items-start gap-3">
                                    <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5"
                                        style={{ color: c.color, background: c.color + '18', border: `1px solid ${c.color}44` }}>
                                        {c.label}
                                    </span>
                                    <span className="text-slate-400 text-base leading-relaxed">{c.desc}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="mt-auto pt-4">
                        <StepButton step={step} setStep={setStep} maxStep={maxStep}
                            label={['概述', '分解', '解决', '合并'][step]} />
                    </div>
                </div>
            );
        };

        const DivideConquerSection = () => {
            const [activePanel, setActivePanel] = useState('basics');
            return (
                <section id="divide" className="py-20">
                    <div className="container mx-auto px-6">
                        <SectionHeader title="分治法" subtitle="DIVIDE AND CONQUER" />
                        <div className="grid lg:grid-cols-[3fr_7fr] gap-8">
                            <div className="space-y-4">
                                <KnowledgeCard title="基本思想" onClick={() => setActivePanel('basics')} active={activePanel === 'basics'} />
                                <KnowledgeCard title="归并排序 (Merge Sort)" onClick={() => setActivePanel('merge')} active={activePanel === 'merge'} />
                                <KnowledgeCard title="快速排序 (Quick Sort)" onClick={() => setActivePanel('quick')} active={activePanel === 'quick'} />
                                <KnowledgeCard title="二分查找 (Binary Search)" onClick={() => setActivePanel('binary')} active={activePanel === 'binary'} />
                                <KnowledgeCard title="快速幂 (Fast Exponentiation)" onClick={() => setActivePanel('fastexp')} active={activePanel === 'fastexp'} />
                                <KnowledgeCard title="逆序对计数 (Counting Inversions)" onClick={() => setActivePanel('inversions')} active={activePanel === 'inversions'} />
                            </div>
                            <div className="glass-panel p-6 rounded-xl flex flex-col overflow-hidden">
                                <h4 className="text-white font-bold mb-4">
                                    {activePanel === 'basics'     ? '分治法：核心三步骤' :
                                     activePanel === 'quick'      ? 'Quick Sort Visualization' :
                                     activePanel === 'binary'     ? 'Binary Search Visualization' :
                                     activePanel === 'fastexp'    ? '快速幂 (Fast Exponentiation)' :
                                     activePanel === 'inversions' ? '逆序对计数 (Counting Inversions)' :
                                     'Merge Sort Visualization'}
                                </h4>
                                {activePanel === 'basics'     ? <DivideConquerBasicsPanel /> :
                                 activePanel === 'quick'      ? <QuickSortAnimation /> :
                                 activePanel === 'binary'     ? <BinarySearchAnimation /> :
                                 activePanel === 'fastexp'    ? <FastExpAnimation /> :
                                 activePanel === 'inversions' ? <CountingInversionsAnimation /> :
                                 <MergeSortAnimation />}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileNav, setMobileNav] = useState(false);
            const currentId = 'divide';

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="algorithm.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Course</span>
                            </a>
                            <div className="hidden lg:flex gap-4">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`text-xs font-mono transition-colors no-underline ${s.id === currentId ? 'text-cyan-400' : 'text-slate-500 hover:text-cyan-400'}`}>
                                        <span className="text-cyan-600">{s.num}</span> {s.titleEn}
                                    </a>
                                ))}
                            </div>
                            <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setMobileNav(!mobileNav)}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            </button>
                        </div>
                        {mobileNav && (
                            <div className="lg:hidden bg-slate-950/95 border-t border-white/5 px-6 py-4 space-y-2">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`block text-sm font-mono transition-colors no-underline py-1 ${s.id === currentId ? 'text-cyan-400' : 'text-slate-400 hover:text-cyan-400'}`} onClick={() => setMobileNav(false)}>
                                        <span className="text-cyan-600">{s.num}</span> {s.title}
                                    </a>
                                ))}
                            </div>
                        )}
                    </nav>
                    <DivideConquerSection />
                    <footer className="py-12 border-t border-white/5 bg-black/40 backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <p className="text-sm text-gray-600 font-mono">
                                © {new Date().getFullYear()} Dingming Wu. Algorithm Design and Analysis Course Material.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
