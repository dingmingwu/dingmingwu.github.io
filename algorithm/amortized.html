<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amortized Analysis - Algorithm Design and Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8">
                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// {subtitle}</span>
                <h2 className="text-3xl md:text-4xl font-bold text-white tracking-tight">{title}</h2>
                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4"></div>
            </div>
        );

        const StepButton = ({ step, setStep, maxStep, label }) => (
            <div className="flex items-center gap-3 mt-4">
                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-base font-mono hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Prev</button>
                <button onClick={() => setStep(Math.min(maxStep, step + 1))} disabled={step >= maxStep} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-base font-mono hover:bg-cyan-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Next</button>
                <span className="text-base text-slate-500 font-mono">{label || `Step ${step} / ${maxStep}`}</span>
            </div>
        );

        const KnowledgeCard = ({ title, children, onClick, active }) => (
            <div
                className={`glass-panel p-6 rounded-xl mb-4 transition-all duration-200${onClick ? ' cursor-pointer' : ''}`}
                onClick={onClick}
                style={active ? { borderColor: 'rgba(34,211,238,0.5)', background: 'rgba(6,182,212,0.07)', boxShadow: '0 0 16px rgba(34,211,238,0.1)' } : {}}
            >
                <h4 className={`text-lg font-bold mb-2 ${active ? 'text-cyan-300' : 'text-white'}`}>{title}</h4>
                {children && <div className="text-slate-400 text-base leading-relaxed">{children}</div>}
            </div>
        );

        const Tex = ({ tex }) => {
            const html = katex.renderToString(tex, { throwOnError: false });
            return <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        // Embeds HTML+KaTeX inside SVG via foreignObject.
        // x,y match SVG <text> semantics: x=left edge, y=baseline (unless center=true, then x=centerX).
        const SVGText = ({ x, y, width, color = '#64748b', fontSize = 16, center = false, children }) => {
            const h = fontSize + 10;
            return (
                <foreignObject x={center ? x - width / 2 : x} y={y - fontSize - 4} width={width} height={h}>
                    <div style={{
                        color, fontSize: `${fontSize}px`,
                        fontFamily: "'JetBrains Mono', monospace",
                        display: 'flex', alignItems: 'center',
                        justifyContent: center ? 'center' : 'flex-start',
                        height: '100%', whiteSpace: 'nowrap',
                    }}>
                        {children}
                    </div>
                </foreignObject>
            );
        };

        const sections = [
            { id: 'complexity', num: '01', title: '算法复杂度分析', titleEn: 'Complexity Analysis' },
            { id: 'divide', num: '02', title: '分治法', titleEn: 'Divide and Conquer' },
            { id: 'backtrack', num: '03', title: '回溯法', titleEn: 'Backtracking' },
            { id: 'dp', num: '04', title: '动态规划', titleEn: 'Dynamic Programming' },
            { id: 'greedy', num: '05', title: '贪心法', titleEn: 'Greedy Algorithms' },
            { id: 'maxflow', num: '06', title: '最大流', titleEn: 'Maximum Flow' },
            { id: 'amortized', num: '07', title: '摊还分析', titleEn: 'Amortized Analysis' },
            { id: 'np', num: '08', title: 'NP理论', titleEn: 'NP Theory' },
        ];

        const BinaryCounterAnim = () => {
            const [step, setStep] = useState(0);
            const maxSteps = 8;
            const costs       = [1, 2, 1, 3, 1, 2, 1, 4];
            const flippedBits = [[0],[0,1],[0],[0,1,2],[0],[0,1],[0],[0,1,2,3]];
            const cumulatives = [1, 3, 4, 7, 8, 10, 11, 15];

            // cumulative flip count per bit up to current step
            const bitFlips = [0,0,0,0];
            for (let s = 0; s < step; s++)
                for (const b of flippedBits[s]) bitFlips[b]++;

            const bits = [(step>>3)&1, (step>>2)&1, (step>>1)&1, step&1];
            const currentFlipped = step > 0 ? flippedBits[step-1] : [];
            const cost  = step > 0 ? costs[step-1] : 0;
            const total = step > 0 ? cumulatives[step-1] : 0;

            const cellW=55, cellH=52, cellStartX=140, cellY=8;
            const barW=26, barSpacing=34, barStartX=118, barBaseY=225, barMaxH=80;

            return (
                <div>
                    <div className="text-base font-mono mb-2" style={{minHeight:'3em'}}>
                        {step === 0
                            ? <span className="text-slate-400"></span>
                            : <span className={cost > 1 ? 'text-amber-400' : 'text-cyan-400'}>
                                {`Increment ${step}: 翻转位 {${currentFlipped.join(',')}}, 代价=${cost}, 累计=${total}, 均摊=${(total/step).toFixed(2)}`}
                              </span>
                        }
                    </div>
                    <svg viewBox="0 0 500 265" className="w-full max-w-lg mx-auto">
                        {/* Bit register cells — y 8-60 */}
                        {bits.map((bit, i) => {
                            const bitIdx = 3 - i;
                            const isFlipped = currentFlipped.includes(bitIdx);
                            const x = cellStartX + i * cellW;
                            const fill   = isFlipped ? 'rgba(251,191,36,0.3)'  : bit ? 'rgba(6,182,212,0.2)'  : 'rgba(30,41,59,0.5)';
                            const stroke = isFlipped ? '#fbbf24'                : bit ? '#06b6d4'              : '#334155';
                            const tFill  = isFlipped ? '#fbbf24'                : bit ? '#67e8f9'              : '#475569';
                            return (
                                <g key={i}>
                                    <rect x={x} y={cellY} width={cellW-3} height={cellH} rx="4"
                                        fill={fill} stroke={stroke} strokeWidth="1.5"/>
                                    <text x={x+(cellW-3)/2} y={cellY+36}
                                        fill={tFill} fontSize="22" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">{bit}</text>
                                   
                                </g>
                            );
                        })}

                        {/* Flip count row — y 108, each number centred under its cell */}
                        <text x={cellStartX-10} y={108} fill="#64748b" fontSize="16" textAnchor="end" fontFamily="JetBrains Mono">翻转次数:</text>
                        {[3,2,1,0].map((bitIdx, i) => (
                            <text key={i} x={cellStartX + i*cellW + (cellW-3)/2} y={108}
                                fill="#64748b" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{bitFlips[bitIdx]}</text>
                        ))}

                        {/* Y-axis — bars y 145-225 */}
                        <line x1={barStartX-5} y1={barBaseY-barMaxH} x2={barStartX-5} y2={barBaseY} stroke="#334155" strokeWidth="1"/>
                        <line x1={barStartX-5} y1={barBaseY} x2={barStartX+8*barSpacing} y2={barBaseY} stroke="#334155" strokeWidth="1"/>
                        <text x={barStartX-8} y={barBaseY-barMaxH+6} fill="#475569" fontSize="16" textAnchor="end" fontFamily="JetBrains Mono">4</text>
                        <text x={barStartX-8} y={barBaseY}            fill="#475569" fontSize="16" textAnchor="end" fontFamily="JetBrains Mono">0</text>

                        {/* Bars */}
                        {Array.from({length:8}, (_,i) => {
                            const c       = costs[i];
                            const isPast  = i < step;
                            const isActive= i === step-1;
                            const isMulti = c > 1;
                            const barH = (c/4)*barMaxH;
                            const barY = barBaseY - barH;
                            const x    = barStartX + i*barSpacing;
                            const fill   = !isPast  ? 'rgba(30,41,59,0.2)'
                                         : isActive ? (isMulti ? '#fbbf24' : '#22d3ee')
                                         : isMulti  ? 'rgba(251,191,36,0.45)' : 'rgba(6,182,212,0.35)';
                            const stroke = isActive ? (isMulti ? '#fbbf24' : '#22d3ee') : 'none';
                            return (
                                <g key={i}>
                                    <rect x={x} y={barY} width={barW} height={barH} rx="2"
                                        fill={fill} stroke={stroke} strokeWidth={isActive ? 1.5 : 0}/>
                                    {/* bar index — y 247 */}
                                    <text x={x+barW/2} y={barBaseY+22} fill={isPast ? '#64748b' : '#1e293b'}
                                        fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{i+1}</text>
                                </g>
                            );
                        })}

                        {/* Final summary — right of bars, x 441 */}
                        {step === maxSteps && (
                            <g>
                                <SVGText x={441} y={188} width={110} color="#94a3b8" center><Tex tex="T(8)=15"/></SVGText>
                                <SVGText x={441} y={210} width={110} color="#22d3ee" center><Tex tex="\leq 2\times 8=16"/></SVGText>
                            </g>
                        )}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={maxSteps} label={`Step ${step}/${maxSteps}`}/>
                </div>
            );
        };

        const DynArrayAccountingAnim = () => {
            const [step, setStep] = useState(0);
            // Each entry is a typed sub-step; expansion splits into expand_new + expand_copy.
            // expand_new: delta=null (operation not yet complete), bank=pre-op bank
            // expand_copy: delta=actual delta, bank=post-op bank
            const steps = [
                { type:'initial' },
                { type:'add',         pushN:1, cap:1,  size:1, actual:1, delta: 2,   bank:2 },
                { type:'expand_new',  pushN:2, oldCap:1, newCap:2, oldSize:1,            actual:2, delta:null, bank:2 },
                { type:'expand_copy', pushN:2, oldCap:1, newCap:2, oldSize:1, newSize:2, actual:2, delta: 1,   bank:3 },
                { type:'expand_new',  pushN:3, oldCap:2, newCap:4, oldSize:2,            actual:3, delta:null, bank:3 },
                { type:'expand_copy', pushN:3, oldCap:2, newCap:4, oldSize:2, newSize:3, actual:3, delta: 0,   bank:3 },
                { type:'add',         pushN:4, cap:4,  size:4, actual:1, delta: 2,   bank:5 },
                { type:'expand_new',  pushN:5, oldCap:4, newCap:8, oldSize:4,            actual:5, delta:null, bank:5 },
                { type:'expand_copy', pushN:5, oldCap:4, newCap:8, oldSize:4, newSize:5, actual:5, delta:-2,   bank:3 },
                { type:'add',         pushN:6, cap:8,  size:6, actual:1, delta: 2,   bank:5 },
                { type:'add',         pushN:7, cap:8,  size:7, actual:1, delta: 2,   bank:7 },
                { type:'add',         pushN:8, cap:8,  size:8, actual:1, delta: 2,   bank:9 },
            ];
            const maxSteps = steps.length - 1;
            const s = steps[step];
            const maxBank = 9;
            const bank   = s.bank   ?? 0;
            const actual = s.actual ?? 0;
            const delta  = s.delta;   // null | number
            const isExpand = s.type === 'expand_new' || s.type === 'expand_copy';

            // Layout — all rows are square cells (cellW × cellW).
            // Single-row: singleY=32, height=38, bottom=70
            // Two-row:    row1Y=4, height=38, bottom=42
            //             sep text at y=60 (gap≥6 from row1 bottom)
            //             row2Y=70, height=38, bottom=108
            // Fixed below: capLabelY=128, barY=142, boxY=167
            const cellW=38, cellGap=3, maxCap=8;
            const totalCW = maxCap*cellW + (maxCap-1)*cellGap;  // 325
            const cx = (500 - totalCW) / 2;                     // 87.5
            const singleY=32, singleH=38;
            const row1Y=4,  row1H=38;
            const sepY=60;
            const row2Y=70, row2H=38;
            const capLabelY=128;
            const barX=155, barY=142, barH=22, barMaxW=320;
            const boxW=145, boxH=72, boxGap=10;
            const boxStartX = (500 - (3*boxW + 2*boxGap)) / 2;
            const boxY=178;

            // Render one row of maxCap cells (all square: cellW × rowH where rowH=cellW)
            const renderRow = (rowY, rowH, cap, size, mode, oldSize, kpfx) =>
                Array.from({length: maxCap}, (_, i) => {
                    const inCap  = i < cap;
                    const filled = i < size;
                    const x = cx + i*(cellW+cellGap);
                    let fill, stroke, showNum=false, numFill='transparent';
                    if (!inCap) {
                        fill='rgba(15,23,42,0.12)'; stroke='#0f172a';
                    } else if (mode === 'normal') {
                        const isNew = filled && i === size-1;
                        if (isNew)       { fill='rgba(6,182,212,0.5)';   stroke='#22d3ee'; showNum=true; numFill='#22d3ee'; }
                        else if (filled) { fill='rgba(6,182,212,0.18)';  stroke='#06b6d4'; showNum=true; numFill='#67e8f9'; }
                        else             { fill='rgba(30,41,59,0.45)';   stroke='#334155'; }
                    } else if (mode === 'old_expand') {
                        if (filled) { fill='rgba(251,191,36,0.22)'; stroke='#fbbf24'; showNum=true; numFill='#fbbf24'; }
                        else        { fill='rgba(30,41,59,0.38)';   stroke='#334155'; }
                    } else if (mode === 'old_copy') {
                        if (filled) { fill='rgba(251,191,36,0.07)'; stroke='rgba(251,191,36,0.25)'; showNum=true; numFill='rgba(251,191,36,0.3)'; }
                        else        { fill='rgba(15,23,42,0.10)';   stroke='rgba(71,85,105,0.2)'; }
                    } else if (mode === 'new_expand') {
                        fill='rgba(30,41,59,0.42)'; stroke='#334155';
                    } else if (mode === 'new_copy') {
                        const isCopied = filled && i < oldSize;
                        const isNew    = filled && i === size-1;
                        if (isCopied)  { fill='rgba(6,182,212,0.22)'; stroke='#06b6d4'; showNum=true; numFill='#67e8f9'; }
                        else if (isNew){ fill='rgba(6,182,212,0.5)';  stroke='#22d3ee'; showNum=true; numFill='#22d3ee'; }
                        else           { fill='rgba(30,41,59,0.42)';  stroke='#334155'; }
                    }
                    return (
                        <g key={`${kpfx}_${i}`}>
                            <rect x={x} y={rowY} width={cellW} height={rowH} rx="3"
                                fill={fill} stroke={stroke} strokeWidth="1.5"/>
                            {showNum && (
                                <text x={x+cellW/2} y={rowY+rowH-9}
                                    fill={numFill} fontSize="16" fontWeight="bold"
                                    textAnchor="middle" fontFamily="JetBrains Mono">{i+1}</text>
                            )}
                        </g>
                    );
                });

            // Build cell elements for current step
            const cellEls = [];
            if (s.type === 'initial') {
                cellEls.push(...renderRow(singleY, singleH, 1, 0, 'normal', 0, 'r'));
            } else if (s.type === 'add') {
                cellEls.push(...renderRow(singleY, singleH, s.cap, s.size, 'normal', 0, 'r'));
            } else if (s.type === 'expand_new') {
                cellEls.push(...renderRow(row1Y, row1H, s.oldCap, s.oldSize, 'old_expand', 0, 'r1'));
                cellEls.push(
                    <SVGText key="sep" x={250} y={sepY} width={410} color="#fbbf24" center>
                        cap = {s.oldCap}，扩容 cap <Tex tex="\times"/> 2 = {s.newCap}，新建空数组 <Tex tex="\downarrow"/>
                    </SVGText>
                );
                cellEls.push(...renderRow(row2Y, row2H, s.newCap, 0, 'new_expand', 0, 'r2'));
            } else if (s.type === 'expand_copy') {
                cellEls.push(...renderRow(row1Y, row1H, s.oldCap, s.oldSize, 'old_copy', 0, 'r1'));
                cellEls.push(
                    <SVGText key="sep" x={250} y={sepY} width={350} color="#64748b" center>
                        复制 {s.oldSize} 个元素，插入第 {s.newSize} 个元素 <Tex tex="\downarrow"/>
                    </SVGText>
                );
                cellEls.push(...renderRow(row2Y, row2H, s.newCap, s.newSize, 'new_copy', s.oldSize, 'r2'));
            }

            // Cap label
            const capLabel =
                s.type === 'initial'      ? 'cap = 1   size = 0' :
                s.type === 'add'          ? `cap = ${s.cap}   size = ${s.size}` :
                s.type === 'expand_new'   ? `旧 cap = ${s.oldCap}  →  新 cap = ${s.newCap}` :
                                            `cap = ${s.newCap}   size = ${s.newSize}`;

            // Step label
            const stepLabel =
                s.type === 'initial'
                    ? <span className="text-slate-400">初始：cap = 1，size = 0；每次 add 均摊收费 <Tex tex="3"/>，当 size = cap 时 cap 翻倍并复制所有元素</span>
                : s.type === 'add'
                    ? <span className="text-cyan-400">{`Add ${s.pushN}：均摊收费 3，实际代价 ${actual}，${delta >= 0 ? '存入' : '动用'} ${Math.abs(delta)} credit，余额 → ${bank}`}</span>
                : s.type === 'expand_new'
                    ? <span className="text-amber-400">{`Add ${s.pushN}：size = cap = ${s.oldCap} → 扩容！新建空数组 cap × 2 = ${s.newCap}`}</span>
                :   <span className="text-amber-400">{`Add ${s.pushN}：复制 ${s.oldSize} 个元素 + 插入新元素，代价 ${actual}，余额变化 ${delta > 0 ? '+' : ''}${delta}，余额 → ${bank}`}</span>;

            // Info boxes — 余额变化 shows '—' while expand_new is pending
            const deltaDisplay = delta === null ? '—' : delta > 0 ? `+${delta}` : `${delta}`;
            const deltaColor  = delta === null || delta === 0 ? '#475569' : delta > 0 ? '#22c55e' : '#f87171';
            const deltaBorder = delta === null || delta === 0 ? 'rgba(71,85,105,0.3)' : delta > 0 ? 'rgba(34,197,94,0.4)' : 'rgba(248,113,113,0.4)';
            const deltaBg     = delta === null || delta === 0 ? 'rgba(30,41,59,0.3)'  : delta > 0 ? 'rgba(34,197,94,0.08)' : 'rgba(248,113,113,0.08)';
            const boxes = [
                { label:'均摊收费', value: s.type==='initial' ? '—' : '3',
                  color:'#22d3ee', border:'rgba(6,182,212,0.4)', bg:'rgba(6,182,212,0.08)' },
                { label:'实际代价', value: s.type==='initial' ? '—' : String(actual),
                  color:  isExpand ? '#fbbf24' : '#22d3ee',
                  border: isExpand ? 'rgba(251,191,36,0.4)' : 'rgba(6,182,212,0.4)',
                  bg:     isExpand ? 'rgba(251,191,36,0.08)' : 'rgba(6,182,212,0.08)' },
                { label:'余额变化', value: s.type==='initial' ? '—' : deltaDisplay,
                  color: deltaColor, border: deltaBorder, bg: deltaBg },
            ];

            return (
                <div>
                    <div className="text-base font-mono mb-2" style={{minHeight:'3em'}}>
                        {stepLabel}
                    </div>
                    <svg viewBox="0 0 500 258" className="w-full max-w-lg mx-auto">
                        {/* Cell area */}
                        {cellEls}

                        {/* Cap label — y 128 */}
                        {s.type === 'expand_new'
                            ? <SVGText x={250} y={capLabelY} width={330} color="#64748b" center>
                                旧 cap = {s.oldCap} <Tex tex="\rightarrow"/> 新 cap = {s.newCap}
                              </SVGText>
                            : <text x={250} y={capLabelY} fill="#64748b" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">
                                {capLabel}
                              </text>
                        }

                        {/* Credit bank bar — y 142-164 */}
                        <text x={10} y={barY+barH-4} fill="#64748b" fontSize="16" textAnchor="start" fontFamily="JetBrains Mono">Credit Bank:</text>
                        <rect x={barX} y={barY} width={barMaxW} height={barH} rx="3"
                            fill="rgba(30,41,59,0.5)" stroke="#334155" strokeWidth="1"/>
                        {bank > 0 && <rect x={barX} y={barY} width={(bank/maxBank)*barMaxW} height={barH} rx="3"
                            fill="rgba(34,197,94,0.35)" stroke="#22c55e" strokeWidth="1"/>}
                        <text x={barX+barMaxW/2} y={barY+barH-4} fill="#22c55e" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">
                            {bank}
                        </text>

                        {/* Info boxes — y 178-250 */}
                        {boxes.map((b, i) => {
                            const bx = boxStartX + i*(boxW+boxGap);
                            return (
                                <g key={i}>
                                    <rect x={bx} y={boxY} width={boxW} height={boxH} rx="4"
                                        fill={b.bg} stroke={b.border} strokeWidth="1"/>
                                    <text x={bx+boxW/2} y={boxY+22} fill="#64748b" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{b.label}</text>
                                    <text x={bx+boxW/2} y={boxY+57} fill={b.color} fontSize="22" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">{b.value}</text>
                                </g>
                            );
                        })}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={maxSteps} label={`Step ${step}/${maxSteps}`}/>
                </div>
            );
        };

        const MultipopStackAnim = () => {
            const [step, setStep] = useState(0);
            const steps = [
                { op: null,          stack: [],                    poppedEls: [],           phi: 0, actual: 0, dPhi:  0, amortized: 0 },
                { op: 'PUSH a',      stack: ['a'],                 poppedEls: [],           phi: 1, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'PUSH b',      stack: ['a','b'],             poppedEls: [],           phi: 2, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'PUSH c',      stack: ['a','b','c'],         poppedEls: [],           phi: 3, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'PUSH d',      stack: ['a','b','c','d'],     poppedEls: [],           phi: 4, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'PUSH e',      stack: ['a','b','c','d','e'], poppedEls: [],           phi: 5, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'MULTIPOP(3)', stack: ['a','b'],             poppedEls: ['c','d','e'], phi: 2, actual: 3, dPhi: -3, amortized: 0 },
                { op: 'PUSH f',      stack: ['a','b','f'],         poppedEls: [],           phi: 3, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'POP',         stack: ['a','b'],             poppedEls: ['f'],         phi: 2, actual: 1, dPhi: -1, amortized: 0 },
                { op: 'PUSH g',      stack: ['a','b','g'],         poppedEls: [],           phi: 3, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'PUSH h',      stack: ['a','b','g','h'],     poppedEls: [],           phi: 4, actual: 1, dPhi:  1, amortized: 2, newPush: true },
                { op: 'MULTIPOP(5)', stack: [],                    poppedEls: ['a','b','g','h'], phi: 0, actual: 4, dPhi: -4, amortized: 0 },
            ];
            const maxSteps = steps.length - 1;
            const s = steps[step];
            const { stack, poppedEls = [], newPush, phi, actual, dPhi, amortized } = s;
            const maxPhi = 5;
            // All visible stack elements: remaining (cyan) then popped (amber on top)
            const allEls = [...stack, ...poppedEls];

            // Layout
            const stackCX=110, cellW=82, cellH=20, stackBase=108;
            const barX=50, barY=120, barH=22, barMaxW=420;
            const boxW=145, boxH=72, boxGap=8;
            const boxStartX=(500-3*boxW-2*boxGap)/2;
            const boxY=155;

            const dPhiStr = dPhi >= 0 ? `+${dPhi}` : `${dPhi}`;

            const stepLabel = s.op === null
                ? <span className="text-slate-400">令 <Tex tex="\Phi = |\text{stack}|"/>，PUSH 均摊 = 2，POP / MULTIPOP 均摊 = 0</span>
                : <span className={poppedEls.length > 0 ? 'text-amber-400' : 'text-cyan-400'}>
                    {`${s.op}：实际代价 ${actual}，ΔΦ = ${dPhiStr}，均摊 = ${actual} + (${dPhiStr}) = ${amortized}`}
                  </span>;

            const infoBoxes = [
                { label: '实际代价', value: s.op ? String(actual) : '—',
                  color:  actual > 1 ? '#fbbf24' : s.op ? '#22d3ee' : '#475569',
                  border: actual > 1 ? 'rgba(251,191,36,0.4)' : 'rgba(6,182,212,0.4)',
                  bg:     actual > 1 ? 'rgba(251,191,36,0.08)' : 'rgba(6,182,212,0.08)' },
                { label: 'ΔΦ', labelTex: '\\Delta\\Phi', value: s.op ? dPhiStr : '—',
                  color:  dPhi > 0 ? '#22d3ee' : dPhi < 0 ? '#fbbf24' : '#475569',
                  border: dPhi > 0 ? 'rgba(6,182,212,0.4)' : dPhi < 0 ? 'rgba(251,191,36,0.4)' : 'rgba(71,85,105,0.3)',
                  bg:     dPhi > 0 ? 'rgba(6,182,212,0.08)' : dPhi < 0 ? 'rgba(251,191,36,0.08)' : 'rgba(30,41,59,0.3)' },
                { label: '均摊代价', value: s.op ? String(amortized) : '—',
                  color: s.op ? '#22d3ee' : '#475569',
                  border: 'rgba(6,182,212,0.4)', bg: 'rgba(6,182,212,0.08)' },
            ];

            return (
                <div>
                    <div className="text-base font-mono mb-2" style={{minHeight:'3em'}}>
                        {stepLabel}
                    </div>
                    <svg viewBox="0 0 500 235" className="w-full max-w-lg mx-auto">
                        {/* Stack base line */}
                        <line x1={stackCX-cellW/2-5} y1={stackBase} x2={stackCX+cellW/2+5} y2={stackBase}
                            stroke="#475569" strokeWidth="2"/>

                        {/* Stack elements (index 0 = bottom) */}
                        {allEls.map((el, i) => {
                            const isPopped = i >= stack.length;
                            const isNewTop = !isPopped && i === stack.length - 1 && !!newPush;
                            const yt = stackBase - (i + 1) * cellH;
                            const fill   = isPopped ? 'rgba(251,191,36,0.22)' : isNewTop ? 'rgba(6,182,212,0.5)'  : 'rgba(6,182,212,0.15)';
                            const stroke = isPopped ? '#fbbf24'               : isNewTop ? '#22d3ee'              : '#06b6d4';
                            const tFill  = isPopped ? '#fbbf24'               : isNewTop ? '#22d3ee'              : '#67e8f9';
                            return (
                                <g key={i}>
                                    <rect x={stackCX-cellW/2} y={yt} width={cellW} height={cellH} rx="3"
                                        fill={fill} stroke={stroke} strokeWidth="1.5"/>
                                    <text x={stackCX} y={yt+cellH-5}
                                        fill={tFill} fontSize="16" fontWeight="bold"
                                        textAnchor="middle" fontFamily="JetBrains Mono">{el}</text>
                                </g>
                            );
                        })}

                        {/* Empty stack indicator */}
                        {allEls.length === 0 && (
                            <text x={stackCX} y={stackBase-8} fill="#334155" fontSize="16"
                                textAnchor="middle" fontFamily="JetBrains Mono">空</text>
                        )}

                        {/* Right panel: formula for current step */}
                        {s.op ? (
                            <g>
                                <text x={205} y={30} fill={poppedEls.length > 0 ? '#fbbf24' : '#22d3ee'}
                                    fontSize="20" fontWeight="bold" fontFamily="JetBrains Mono">{s.op}</text>
                                <SVGText x={205} y={56} width={290} color="#475569" fontSize={16}>
                                    均摊 = 实际代价 + <Tex tex="\Delta\Phi"/>
                                </SVGText>
                                <text x={205} y={78} fill="#94a3b8" fontSize="16"
                                    fontFamily="JetBrains Mono">{`= ${actual} + (${dPhiStr}) = ${amortized}`}</text>
                                <SVGText x={205} y={100} width={200} color="#475569" fontSize={14}>
                                    <Tex tex="\Phi"/>: {phi - dPhi} <Tex tex="\rightarrow"/> {phi}
                                </SVGText>
                            </g>
                        ) : (
                            <g>
                                <SVGText x={205} y={30} width={200} color="#475569" fontSize={16}>
                                    初始：<Tex tex="\Phi = 0"/>
                                </SVGText>
                                <text x={205} y={56} fill="#334155" fontSize="16"
                                    fontFamily="JetBrains Mono">PUSH:  1 + (+1) = 2</text>
                                <text x={205} y={78} fill="#334155" fontSize="16"
                                    fontFamily="JetBrains Mono">POP:   1 + (-1) = 0</text>
                                <text x={205} y={100} fill="#334155" fontSize="16"
                                    fontFamily="JetBrains Mono">MULTI: k + (-k) = 0</text>
                            </g>
                        )}

                        {/* Potential bar — y 120-142 */}
                        <SVGText x={10} y={barY+barH-4} width={46} color="#64748b">
                            <Tex tex="\Phi ="/>
                        </SVGText>
                        <rect x={barX} y={barY} width={barMaxW} height={barH} rx="3"
                            fill="rgba(30,41,59,0.5)" stroke="#334155" strokeWidth="1"/>
                        {phi > 0 && <rect x={barX} y={barY} width={(phi/maxPhi)*barMaxW} height={barH} rx="3"
                            fill="rgba(6,182,212,0.3)" stroke="#06b6d4" strokeWidth="1"/>}
                        <text x={barX+barMaxW/2} y={barY+barH-4} fill="#22d3ee" fontSize="16"
                            textAnchor="middle" fontFamily="JetBrains Mono">{phi}</text>

                        {/* Info boxes — y 155-227 */}
                        {infoBoxes.map((b, i) => {
                            const bx = boxStartX + i*(boxW+boxGap);
                            return (
                                <g key={i}>
                                    <rect x={bx} y={boxY} width={boxW} height={boxH} rx="4"
                                        fill={b.bg} stroke={b.border} strokeWidth="1"/>
                                    {b.labelTex
                                        ? <SVGText x={bx+boxW/2} y={boxY+22} width={boxW} color="#64748b" center>
                                            <Tex tex={b.labelTex}/>
                                          </SVGText>
                                        : <text x={bx+boxW/2} y={boxY+22} fill="#64748b" fontSize="16"
                                            textAnchor="middle" fontFamily="JetBrains Mono">{b.label}</text>
                                    }
                                    <text x={bx+boxW/2} y={boxY+57} fill={b.color} fontSize="22" fontWeight="bold"
                                        textAnchor="middle" fontFamily="JetBrains Mono">{b.value}</text>
                                </g>
                            );
                        })}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={maxSteps} label={`Step ${step}/${maxSteps}`}/>
                </div>
            );
        };

        const AmortizedSection = () => {
            const [active, setActive] = useState('aggregate');
            return (
                <section id="amortized" className="py-20">
                    <div className="container mx-auto px-6">
                        <SectionHeader title="摊还分析" subtitle="AMORTIZED ANALYSIS" />
                        <div className="grid lg:grid-cols-[3fr_7fr] gap-8">
                            <div className="space-y-4">
                                <KnowledgeCard title="聚合法" onClick={() => setActive('aggregate')} active={active === 'aggregate'}>
                                </KnowledgeCard>
                                <KnowledgeCard title="核算法 (记账法)" onClick={() => setActive('accounting')} active={active === 'accounting'}>
                                </KnowledgeCard>
                                <KnowledgeCard title="势能法" onClick={() => setActive('potential')} active={active === 'potential'}>
                                </KnowledgeCard>
                            </div>
                            <div className="glass-panel p-6 rounded-xl">
                                {active === 'aggregate' && (
                                    <>
                                        <h4 className="text-white font-bold mb-4">二进制计数器 · 聚合法</h4>
                                        <p className="text-slate-400 text-base mb-4 leading-relaxed">
                                            对 <Tex tex="n"/> 次操作总代价 <Tex tex="T(n)"/> 求和，均摊代价 <Tex tex="= T(n)/n"/>。
                                            第 <Tex tex="i"/> 位每 <Tex tex="2^i"/> 次翻转一次，<Tex tex="T(n) < 2n"/>，均摊 <Tex tex="O(1)"/>。
                                        </p>
                                        <BinaryCounterAnim />
                                    </>
                                )}
                                {active === 'accounting' && (
                                    <>
                                        <h4 className="text-white font-bold mb-4">动态数组 · 核算法</h4>
                                        <p className="text-slate-400 text-base mb-4 leading-relaxed">
                                            设计一个均摊代价 <Tex tex="O(x)"/>，每次操作收取均摊代价 <Tex tex="x"/>，扣除实际代价后余额存为 credit，抵扣将来高代价操作，要求余额始终 <Tex tex="\geq 0"/>。
                                            
                                        </p>
                                        <DynArrayAccountingAnim />
                                    </>
                                )}
                                {active === 'potential' && (
                                    <>
                                        <h4 className="text-white font-bold mb-4">MULTIPOP 栈 · 势能法</h4>
                                        <p className="text-slate-400 text-base mb-4 leading-relaxed">
                                            定义势能 <Tex tex="\Phi"/>，均摊代价 <Tex tex="\hat{c}_i = c_i + \Delta\Phi_i"/>，需满足 <Tex tex="\Phi(D_n) \geq \Phi(D_0)"/>。
                                            
                                        </p>
                                        <MultipopStackAnim />
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileNav, setMobileNav] = useState(false);
            const currentId = 'amortized';

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="algorithm.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Course</span>
                            </a>
                            <div className="hidden lg:flex gap-4">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`text-xs font-mono transition-colors no-underline ${s.id === currentId ? 'text-cyan-400' : 'text-slate-500 hover:text-cyan-400'}`}>
                                        <span className="text-cyan-600">{s.num}</span> {s.titleEn}
                                    </a>
                                ))}
                            </div>
                            <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setMobileNav(!mobileNav)}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            </button>
                        </div>
                        {mobileNav && (
                            <div className="lg:hidden bg-slate-950/95 border-t border-white/5 px-6 py-4 space-y-2">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`block text-sm font-mono transition-colors no-underline py-1 ${s.id === currentId ? 'text-cyan-400' : 'text-slate-400 hover:text-cyan-400'}`} onClick={() => setMobileNav(false)}>
                                        <span className="text-cyan-600">{s.num}</span> {s.title}
                                    </a>
                                ))}
                            </div>
                        )}
                    </nav>
                    <AmortizedSection />
                    <footer className="py-12 border-t border-white/5 bg-black/40 backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <p className="text-sm text-gray-600 font-mono">
                                © {new Date().getFullYear()} Dingming Wu. Algorithm Design and Analysis Course Material.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
