<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexity Analysis - Algorithm Design and Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8">
                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// {subtitle}</span>
                <h2 className="text-3xl md:text-4xl font-bold text-white tracking-tight">{title}</h2>
                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4"></div>
            </div>
        );

        const StepButton = ({ step, setStep, maxStep, label }) => (
            <div className="flex items-center gap-3 mt-4">
                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-base font-mono hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Prev</button>
                <button onClick={() => setStep(Math.min(maxStep, step + 1))} disabled={step >= maxStep} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-base font-mono hover:bg-cyan-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Next</button>
                <span className="text-base text-slate-500 font-mono">{label || `Step ${step} / ${maxStep}`}</span>
            </div>
        );

        const KnowledgeCard = ({ title, children, onClick, active }) => (
            <div
                className={`glass-panel p-6 rounded-xl mb-4 transition-all duration-200 ${onClick ? 'cursor-pointer' : ''}`}
                onClick={onClick}
                style={active ? { borderColor: 'rgba(0, 240, 255, 0.5)', boxShadow: '0 0 20px rgba(0, 240, 255, 0.15)' } : {}}
            >
                <h4 className="text-lg font-bold mb-2 text-white">{title}</h4>
                {children && <div className="text-slate-400 text-base leading-relaxed">{children}</div>}
            </div>
        );

        const Tex = ({ tex, display }) => {
            const html = katex.renderToString(tex, { throwOnError: false, displayMode: !!display });
            return display
                ? <div dangerouslySetInnerHTML={{ __html: html }} />
                : <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        const sections = [
            { id: 'complexity', num: '01', title: '算法复杂度分析', titleEn: 'Complexity Analysis' },
            { id: 'divide', num: '02', title: '分治法', titleEn: 'Divide and Conquer' },
            { id: 'backtrack', num: '03', title: '回溯法', titleEn: 'Backtracking' },
            { id: 'dp', num: '04', title: '动态规划', titleEn: 'Dynamic Programming' },
            { id: 'greedy', num: '05', title: '贪心法', titleEn: 'Greedy Algorithms' },
            { id: 'maxflow', num: '06', title: '最大流', titleEn: 'Maximum Flow' },
            { id: 'amortized', num: '07', title: '摊还分析', titleEn: 'Amortized Analysis' },
            { id: 'np', num: '08', title: 'NP理论', titleEn: 'NP Theory' },
        ];

        const CountingMethodAnimation = () => {
            const [step, setStep] = useState(0);
            const maxStep = 6;

            const lines = [
                { num: 1, indent: 0, code: 'x = 0',                expr: '执行 1 次',          count: '1',                                          color: '#94a3b8' },
                { num: 2, indent: 0, code: 'for i in range(1, n+1):',       expr: '执行 n 次',          count: 'n',                                          color: '#22d3ee' },
                { num: 3, indent: 1, code: 'for j in range(1, i//2+1):',   expr: String.raw`\textstyle\sum_i\frac{i}{2}\text{ 次}`,  count: String.raw`\tfrac{n^2}{4}`,  color: '#34d399' },
                { num: 4, indent: 2, code: 'for k in range(1, j//2+1):',   expr: String.raw`\textstyle\sum_{i,j}\frac{j}{2}\text{ 次}`, count: String.raw`\tfrac{n^3}{48}`, color: '#fbbf24' },
                { num: 5, indent: 3, code: 'x = x + 1',            expr: String.raw`\approx\tfrac{n^3}{48}\text{ 次}`,  count: String.raw`\tfrac{n^3}{48}`,          color: '#f87171' },
            ];

            const statusTexts = [
                '逐行统计基本语句的执行次数',
                '第 1 行：赋值语句，执行 1 次',
                '第 2 行：外层循环，i 从 1 到 n，共 n 次',
                <span>第 3 行：中层循环，j 从 1 到 i/2，共 <Tex tex={String.raw`\sum_i \frac{i}{2} = \frac{n(n+1)}{4} \approx \frac{n^2}{4}`} /> 次</span>,
                <span>第 4 行：内层循环，k 从 1 到 j/2，共 <Tex tex={String.raw`\sum_{i,j} \frac{j}{2} \approx \frac{n^3}{48}`} /> 次</span>,
                <span>第 5 行：基本语句，共约执行 <Tex tex={String.raw`\frac{n^3}{48}`} /> 次</span>,
                <span>求和：<Tex tex={String.raw`T(n) = 1 + n + \frac{n^2}{4} + \frac{n^3}{48} + \frac{n^3}{48}`} />，保留最高次项 → <Tex tex="O(n^3)" /></span>,
            ];

            const activeLineIdx = step - 1;

            return (
                <div className="font-mono text-base flex-1 flex flex-col">
                    <div className="flex-1">
                    <div className="text-cyan-400 text-base mb-2" style={{height:'2rem'}}>{statusTexts[step]}</div>

                    <div className="space-y-0">
                        {lines.map((line, idx) => {
                            const revealed = idx < step;
                            const active = idx === activeLineIdx;
                            const opacity = step === 0 ? 1 : (active ? 1 : (revealed ? 0.6 : 0.3));

                            return (
                                <div
                                    key={idx}
                                    className="flex items-center gap-2 px-3 py-3 rounded transition-all duration-300"
                                    style={{
                                        opacity,
                                        background: active ? 'rgba(245,158,11,0.12)' : 'transparent',
                                        borderLeft: active ? '2px solid rgba(245,158,11,0.7)' : '2px solid transparent',
                                    }}
                                >
                                    <span className="text-slate-600 w-4 text-right select-none">{line.num}</span>
                                    <span
                                        className="flex-1 truncate"
                                        style={{ paddingLeft: `${line.indent * 1.5}rem`, color: active ? '#fcd34d' : line.color }}
                                    >
                                        {line.code}
                                    </span>
                                    {revealed || active ? (
                                        <>
                                            <span className="text-slate-500 text-base shrink-0">
                                                {line.expr.startsWith('\\') ? <Tex tex={line.expr} /> : line.expr}
                                            </span>
                                            <span
                                                className="ml-2 px-2 py-0.5 rounded text-base font-bold shrink-0"
                                                style={{ background: `${line.color}22`, color: line.color, border: `1px solid ${line.color}44` }}
                                            >
                                                {line.count.startsWith('\\') ? <Tex tex={line.count} /> : line.count}
                                            </span>
                                        </>
                                    ) : (
                                        <span className="w-16" />
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-4 p-4 rounded-lg border border-cyan-500/30 bg-cyan-900/10 leading-relaxed space-y-3"
                        style={{opacity: step === maxStep ? 1 : 0}}>
                        <div className="text-slate-400 text-base font-mono">{'// 计数求和'}</div>
                        <div className="text-white overflow-x-auto">
                            <Tex display={true} tex={String.raw`T(n) = 1 + n + \frac{n^2}{4} + \frac{n^3}{48} + \frac{n^3}{48} = \frac{n^3}{24} + \frac{n^2}{4} + n + 1`} />
                        </div>
                        <div className="text-cyan-300">
                            <Tex display={true} tex={String.raw`\therefore\; T(n) = O(n^3) \quad \text{（最高次项 } \tfrac{n^3}{24} \text{ 起决定作用）}`} />
                        </div>
                    </div>
                    </div>

                    <div className="mt-auto pt-4">
                    <StepButton
                        step={step}
                        setStep={setStep}
                        maxStep={maxStep}
                        label={step === 0 ? '准备开始' : step <= 5 ? `第 ${step}/5 行` : '汇总完成'}
                    />
                    </div>
                </div>
            );
        };

        const AsymptoticNotationAnimation = () => {
            const [mode, setMode] = useState('O');

            const W = 400, H = 220, PAD_L = 48, PAD_B = 38, PAD_T = 24, PAD_R = 70;
            const plotW = W - PAD_L - PAD_R;
            const plotH = H - PAD_T - PAD_B;
            const N = 80;
            const N0_FRAC = 0.38;

            const sx = (n) => PAD_L + (n / N) * plotW;
            const sy = (v, maxV) => H - PAD_B - Math.min(v / maxV, 1) * plotH;

            const makePath = (fn, maxV) => {
                let d = '';
                for (let i = 0; i <= N; i++) {
                    const x = sx(i), y = sy(fn(i), maxV);
                    d += i === 0 ? `M${x.toFixed(1)},${y.toFixed(1)}` : `L${x.toFixed(1)},${y.toFixed(1)}`;
                }
                return d;
            };

            const oMaxV = 180;
            const fO  = (n) => { if (n === 0) return 5; return 5 + 0.55 * n + 28 * Math.exp(-((n - 16) ** 2) / 40) - 14 * Math.exp(-((n - 28) ** 2) / 30); };
            const cgO = (n) => 2.8 + 1.9 * n;
            const n0O = Math.round(N * N0_FRAC);

            const omMaxV = 160;
            const fOm  = (n) => { if (n === 0) return 12; return 12 + 1.55 * n + 20 * Math.sin(n * 0.22) * Math.exp(-n * 0.04); };
            const cgOm = (n) => 2 + 0.7 * n;
            const n0Om = Math.round(N * N0_FRAC);

            const thMaxV = 240;
            const fTh  = (n) => { if (n === 0) return 10; return 10 + 1.15 * n + 15 * Math.exp(-((n - 12) ** 2) / 25); };
            const c1gTh = (n) => 0.6 * n + 2;
            const c2gTh = (n) => 2.5 * n + 5;
            const n0Th = Math.round(N * N0_FRAC);

            const configs = {
                O: {
                    meaning: <span>存在正常数 <Tex tex="c" /> 和 <Tex tex="n_0" />，使得对所有 <Tex tex="n \geq n_0" /> 有 <Tex tex="f(n) \leq c \cdot g(n)" /></span>,
                    color: '#22d3ee',
                    curves: [
                        { fn: fO,  maxV: oMaxV,  color: '#94a3b8', labelTex: 'f(n)',    labelOff: -8 },
                        { fn: cgO, maxV: oMaxV,  color: '#22d3ee', labelTex: 'cg(n)',   labelOff: 12 },
                    ],
                    n0: n0O,
                    annotation: <span><Tex tex="f(n)" /> 在 <Tex tex="n_0" /> 之后始终位于 <Tex tex="c \cdot g(n)" /> 下方</span>,
                },
                Omega: {
                    meaning: <span>存在正常数 <Tex tex="c" /> 和 <Tex tex="n_0" />，使得对所有 <Tex tex="n \geq n_0" /> 有 <Tex tex="f(n) \geq c \cdot g(n)" /></span>,
                    color: '#a78bfa',
                    curves: [
                        { fn: fOm,  maxV: omMaxV, color: '#94a3b8', labelTex: 'f(n)',   labelOff: 12 },
                        { fn: cgOm, maxV: omMaxV, color: '#a78bfa', labelTex: 'cg(n)',  labelOff: -8 },
                    ],
                    n0: n0Om,
                    annotation: <span><Tex tex="f(n)" /> 在 <Tex tex="n_0" /> 之后始终位于 <Tex tex="c \cdot g(n)" /> 上方</span>,
                },
                Theta: {
                    meaning: <span>存在正常数 <Tex tex="c_1, c_2" /> 和 <Tex tex="n_0" />，使得对所有 <Tex tex="n \geq n_0" /> 有 <Tex tex="c_1 \cdot g(n) \leq f(n) \leq c_2 \cdot g(n)" /></span>,
                    color: '#34d399',
                    curves: [
                        { fn: c2gTh, maxV: thMaxV, color: '#22d3ee', labelTex: 'c_2 g(n)', labelOff: 14 },
                        { fn: fTh,   maxV: thMaxV, color: '#94a3b8', labelTex: 'f(n)',      labelOff: 0 },
                        { fn: c1gTh, maxV: thMaxV, color: '#34d399', labelTex: 'c_1 g(n)', labelOff: -14 },
                    ],
                    n0: n0Th,
                    annotation: <span><Tex tex="f(n)" /> 在 <Tex tex="n_0" /> 之后被夹在 <Tex tex="c_1 \cdot g(n)" /> 和 <Tex tex="c_2 \cdot g(n)" /> 之间</span>,
                },
            };

            const cfg = configs[mode];

            const buildShadePathO = () => {
                let top = '';
                let revBot = '';
                for (let i = n0O; i <= N; i++) {
                    const x = sx(i).toFixed(1);
                    const yTop = sy(cgO(i), oMaxV).toFixed(1);
                    top += i === n0O ? `M${x},${yTop}` : `L${x},${yTop}`;
                }
                for (let i = N; i >= n0O; i--) {
                    const x = sx(i).toFixed(1);
                    const y = sy(fO(i), oMaxV).toFixed(1);
                    revBot += `L${x},${y}`;
                }
                return top + revBot + `Z`;
            };

            const buildShadePathOm = () => {
                let d = '';
                for (let i = n0Om; i <= N; i++) {
                    const x = sx(i).toFixed(1);
                    const yBot = sy(cgOm(i), omMaxV).toFixed(1);
                    if (i === n0Om) d += `M${x},${yBot}`;
                    else d += `L${x},${yBot}`;
                }
                for (let i = N; i >= n0Om; i--) {
                    const x = sx(i).toFixed(1);
                    const y = sy(fOm(i), omMaxV).toFixed(1);
                    d += `L${x},${y}`;
                }
                return d + 'Z';
            };

            const buildShadePathTh = () => {
                let d = '';
                for (let i = n0Th; i <= N; i++) {
                    const x = sx(i).toFixed(1);
                    const y = sy(c2gTh(i), thMaxV).toFixed(1);
                    if (i === n0Th) d += `M${x},${y}`;
                    else d += `L${x},${y}`;
                }
                for (let i = N; i >= n0Th; i--) {
                    const x = sx(i).toFixed(1);
                    const y = sy(c1gTh(i), thMaxV).toFixed(1);
                    d += `L${x},${y}`;
                }
                return d + 'Z';
            };

            const shadePaths = { O: buildShadePathO, Omega: buildShadePathOm, Theta: buildShadePathTh };
            const shadeColors = { O: '#22d3ee', Omega: '#a78bfa', Theta: '#34d399' };

            return (
                <div className="font-mono">
                    <div className="flex gap-4 items-start">
                    <div className="flex flex-col gap-2 shrink-0 pt-1">
                        {[
                            { key: 'O',     label: 'O',         suffix: '上界',   color: '#22d3ee' },
                            { key: 'Omega', label: '\\Omega',   suffix: '下界',   color: '#a78bfa' },
                            { key: 'Theta', label: '\\Theta',   suffix: '紧界',   color: '#34d399' },
                        ].map(t => (
                            <button key={t.key} onClick={() => setMode(t.key)}
                                className="px-3 py-1.5 rounded text-base font-mono transition-all duration-200 flex items-center gap-1.5"
                                style={{
                                    background: mode === t.key ? t.color + '22' : 'rgba(30,41,59,0.5)',
                                    color: mode === t.key ? t.color : '#64748b',
                                    border: `1px solid ${mode === t.key ? t.color + '88' : 'rgba(51,65,85,0.5)'}`,
                                    fontWeight: mode === t.key ? 'bold' : 'normal',
                                }}>
                                <Tex tex={t.label} /><span>{t.suffix}</span>
                            </button>
                        ))}
                    </div>

                    <svg viewBox={`0 0 ${W} ${H}`} className="flex-1 min-w-0" style={{ maxWidth: '600px' }}>
                        <defs>
                            <marker id="asym-arr"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#64748b"/></marker>
                            <marker id="asym-arrV" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 9 4.5, 0 9" fill="#64748b"/></marker>
                        </defs>
                        <line x1={PAD_L} y1={H - PAD_B} x2={W - PAD_R + 4} y2={H - PAD_B} stroke="#475569" strokeWidth="2" markerEnd="url(#asym-arr)" />
                        <line x1={PAD_L} y1={H - PAD_B} x2={PAD_L} y2={PAD_T - 4} stroke="#475569" strokeWidth="2" markerEnd="url(#asym-arrV)" />
                        <foreignObject x={W - PAD_R + 8} y={H - PAD_B - 8} width="24" height="16" style={{ overflow: 'visible' }}>
                            <span xmlns="http://www.w3.org/1999/xhtml"
                                style={{ color: '#94a3b8', fontSize: '12px', fontFamily: 'JetBrains Mono' }}
                                dangerouslySetInnerHTML={{ __html: katex.renderToString('n', { throwOnError: false }) }} />
                        </foreignObject>
                        <foreignObject x={4} y={PAD_T - 10} width="40" height="16" style={{ overflow: 'visible' }}>
                            <span xmlns="http://www.w3.org/1999/xhtml"
                                style={{ color: '#94a3b8', fontSize: '12px', fontFamily: 'JetBrains Mono' }}
                                dangerouslySetInnerHTML={{ __html: katex.renderToString('T(n)', { throwOnError: false }) }} />
                        </foreignObject>
                        <path d={shadePaths[mode]()} fill={shadeColors[mode]} opacity="0.08" />
                        {cfg.curves.map((c, i) => (
                            <path key={i} d={makePath(c.fn, c.maxV)} fill="none" stroke={c.color} strokeWidth="2" strokeLinecap="round" />
                        ))}
                        {cfg.curves.map((c, i) => {
                            const xPos = sx(N);
                            const yPos = sy(c.fn(N), c.maxV) + c.labelOff;
                            const labelHtml = katex.renderToString(c.labelTex, { throwOnError: false });
                            return (
                                <foreignObject key={i} x={xPos + 4} y={yPos - 8} width="70" height="16" style={{ overflow: 'visible' }}>
                                    <span xmlns="http://www.w3.org/1999/xhtml"
                                        style={{ color: c.color, fontSize: '12px', fontFamily: 'JetBrains Mono', whiteSpace: 'nowrap' }}
                                        dangerouslySetInnerHTML={{ __html: labelHtml }} />
                                </foreignObject>
                            );
                        })}
                        <line x1={sx(cfg.n0)} y1={H - PAD_B} x2={sx(cfg.n0)} y2={PAD_T + 10}
                            stroke="#64748b" strokeWidth="1" strokeDasharray="4,3" />
                        <foreignObject x={sx(cfg.n0) - 14} y={H - PAD_B + 5} width="28" height="16" style={{ overflow: 'visible' }}>
                            <span xmlns="http://www.w3.org/1999/xhtml"
                                style={{ color: '#94a3b8', fontSize: '12px', fontFamily: 'JetBrains Mono', display: 'block', textAlign: 'center' }}
                                dangerouslySetInnerHTML={{ __html: katex.renderToString('n_0', { throwOnError: false }) }} />
                        </foreignObject>
                    </svg>
                    </div>

                    <div className="mt-3 p-4 rounded-lg border space-y-2"
                        style={{ borderColor: cfg.color + '44', background: cfg.color + '08' }}>
                        <div className="text-base font-bold" style={{ color: cfg.color }}>
                            <Tex tex={
                                mode === 'O'     ? 'f(n) = O(g(n))' :
                                mode === 'Omega' ? 'f(n) = \\Omega(g(n))' :
                                                   'f(n) = \\Theta(g(n))'
                            } />
                        </div>
                        <div className="text-slate-400 text-base leading-relaxed">{cfg.meaning}</div>
                        <div className="text-base font-mono mt-1" style={{ color: cfg.color + 'cc' }}>
                            // <span className="not-italic">{cfg.annotation}</span>
                        </div>
                    </div>

                    <div className="mt-4 border border-white/5 rounded-lg overflow-hidden text-base">
                        <div className="bg-slate-800/40 px-3 py-1.5 text-slate-400 font-mono">// 三种渐近记号对比</div>
                        <table className="w-full">
                            <thead>
                                <tr className="border-b border-white/5">
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">记号</th>
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">含义</th>
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">条件</th>
                                </tr>
                            </thead>
                            <tbody>
                                {[
                                    { sym: 'O',     tex: 'O(g)',       meaning: '上界',   condTex: 'f(n) \\leq c\\cdot g(n)',                   color: '#22d3ee' },
                                    { sym: 'Omega', tex: '\\Omega(g)', meaning: '下界',   condTex: 'f(n) \\geq c\\cdot g(n)',                   color: '#a78bfa' },
                                    { sym: 'Theta', tex: '\\Theta(g)', meaning: '紧界',   condTex: 'c_1\\cdot g(n) \\leq f(n) \\leq c_2\\cdot g(n)',        color: '#34d399' },
                                ].map(row => (
                                    <tr key={row.sym} className="border-b border-white/5 transition-colors"
                                        style={{ background: mode === row.sym ? row.color + '0a' : 'transparent' }}>

                                            <Tex tex={row.tex} />

                                        <td className="px-3 py-2 text-slate-400">{row.meaning}</td>
                                        <td className="px-3 py-2 text-slate-500"><Tex tex={row.condTex} /></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const ComplexityChart = () => {
            const [step, setStep] = useState(0);
            const maxN = 20;
            const w = 560, h = 300, padL = 50, padT = 20, padB = 30, padR = 110;

            const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };

            const fns = [
                { tex: 'O(1)',          color: '#22d3ee', fn: () => 1 },
                { tex: 'O(\\log n)',    color: '#a78bfa', fn: (n) => Math.log2(n + 1) },
                { tex: 'O(n)',          color: '#34d399', fn: (n) => n },
                { tex: 'O(n \\log n)',  color: '#fbbf24', fn: (n) => n * Math.log2(n + 1) },
                { tex: 'O(n^2)',        color: '#f87171', fn: (n) => n * n },
                { tex: 'O(n^3)',        color: '#fb923c', fn: (n) => n * n * n },
                { tex: 'O(2^n)',        color: '#e879f9', fn: (n) => Math.pow(2, n) },
                { tex: 'O(n!)',         color: '#94a3b8', fn: (n) => fact(n) },
            ];

            const maxY = maxN * maxN;
            const scaleX = (n) => padL + (n / maxN) * (w - padL - padR);
            const scaleY = (v) => h - padB - (Math.min(v, maxY) / maxY) * (h - padT - padB);

            const visibleN = Math.min(maxN, step + 1);

            const paths = fns.map((f) => {
                let d = '';
                for (let i = 0; i <= visibleN; i++) {
                    const x = scaleX(i), y = scaleY(f.fn(i));
                    d += i === 0 ? `M${x},${y}` : `L${x},${y}`;
                }
                return { ...f, d };
            });

            return (
                <div>
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full">
                        <line x1={padL} y1={h - padB} x2={w - padR + 8} y2={h - padB} stroke="#334155" strokeWidth="1" />
                        <line x1={padL} y1={padT} x2={padL} y2={h - padB} stroke="#334155" strokeWidth="1" />
                        <foreignObject x={(padL + w - padR) / 2 - 8} y={h - padB + 8} width="16" height="20" style={{ overflow: 'visible' }}>
                            <span xmlns="http://www.w3.org/1999/xhtml" style={{ color: '#64748b', fontSize: '12px', fontFamily: 'JetBrains Mono' }}
                                dangerouslySetInnerHTML={{ __html: katex.renderToString('n', { throwOnError: false }) }} />
                        </foreignObject>
                        <foreignObject x={2} y={padT} width="40" height="16" style={{ overflow: 'visible' }}>
                            <span xmlns="http://www.w3.org/1999/xhtml" style={{ color: '#64748b', fontSize: '12px', fontFamily: 'JetBrains Mono' }}
                                dangerouslySetInnerHTML={{ __html: katex.renderToString('T(n)', { throwOnError: false }) }} />
                        </foreignObject>
                        {[0.25, 0.5, 0.75].map((f, i) => (
                            <line key={i} x1={padL} y1={padT + f * (h - padT - padB)} x2={w - padR} y2={padT + f * (h - padT - padB)} stroke="#1e293b" strokeWidth="0.5" />
                        ))}
                        {paths.map((p, i) => (
                            <path key={i} d={p.d} fill="none" stroke={p.color} strokeWidth="2" strokeLinecap="round" opacity="0.9" />
                        ))}
                        {fns.map((f, i) => (
                            <g key={i} transform={`translate(${w - padR + 12}, ${padT + i * 22})`}>
                                <rect width="14" height="3" fill={f.color} y="-1" rx="1" />
                                <foreignObject x="18" y="-8" width="80" height="18" style={{ overflow: 'visible' }}>
                                    <span xmlns="http://www.w3.org/1999/xhtml"
                                        style={{ color: f.color, fontSize: '10px', fontFamily: 'JetBrains Mono', whiteSpace: 'nowrap' }}
                                        dangerouslySetInnerHTML={{ __html: katex.renderToString(f.tex, { throwOnError: false }) }} />
                                </foreignObject>
                            </g>
                        ))}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={maxN} label={`n = ${visibleN}`} />
                </div>
            );
        };

        const RecursionTreeAnimation = () => {
            const [step, setStep] = useState(0);
            const maxStep = 5;

            const W = 530, H = 228;
            const SEP_X = 418, COST_X = 474;
            const S0 = [28,13], S1 = [24,11], S2 = [19,9], Sl = [14,8];
            const l0x = 210, l0y = 36;
            const l1x = [90, 330], l1y = 96;
            const l2x = [30, 150, 270, 390], l2y = 156;
            const leafY = 212;

            const show = (n) => step >= n;
            const bez = (x1, y1, x2, y2) => {
                const my = (y1 + y2) / 2;
                return `M ${x1},${y1} C ${x1},${my} ${x2},${my} ${x2},${y2}`;
            };

            const statusTexts = [
                <span>递归程序满足 <Tex tex="T(n) = 2T(n/2) + n" />，逐层展开递归树分析</span>,
                <span>根（第 0 层）：规模 <Tex tex="n" />，非递归开销 <Tex tex="n" /></span>,
                <span>第 1 层展开：2 个规模 <Tex tex="n/2" /> 的子问题，本层总开销 <Tex tex="\tfrac{n}{2}\times 2=n" /></span>,
                <span>第 2 层展开：4 个规模 <Tex tex="n/4" /> 的子问题，本层总开销 <Tex tex="\tfrac{n}{4}\times 4=n" /></span>,
                <span>叶节点（第 <Tex tex="\log_2 n" /> 层）：共 <Tex tex="n" /> 个规模为 1，本层开销 <Tex tex="\Theta(n)" /></span>,
                <span>每层开销均为 <Tex tex="n" />，共 <Tex tex="\log_2 n+1" /> 层 → <Tex tex="T(n)=O(n\log n)" /></span>,
            ];

            const costLabel = (y, label, minStep) => show(minStep) && (
                <text x={COST_X} y={y} fill="#4ade80" fontSize="12"
                    textAnchor="middle" fontFamily="JetBrains Mono">{label}</text>
            );

            return (
                <div className="font-mono text-base">
                    <div className="text-base bg-slate-900/60 rounded-lg px-4 py-3 mb-4 border border-slate-700/40 leading-relaxed">
                        <div className="text-slate-500 mb-1">{'// 归并排序（递归程序）'}</div>
                        <div className="text-slate-400"><span className="text-cyan-400">def </span><span className="text-green-400">mergeSort</span>(arr, n):</div>
                        <div className="pl-6 text-slate-400">{'if n <= 1: return'}</div>
                        <div className="pl-6 text-slate-400"><span className="text-green-400">mergeSort</span>{'(left,  n//2)'}<span className="text-slate-600">{' # T(n/2)'}</span></div>
                        <div className="pl-6 text-slate-400"><span className="text-green-400">mergeSort</span>{'(right, n//2)'}<span className="text-slate-600">{' # T(n/2)'}</span></div>
                        <div className="pl-6 text-slate-400"><span className="text-yellow-400">merge</span>{'(left, right)'}<span className="text-slate-600">{' # 合并两半，花费 n 步'}</span></div>
                        <div className="mt-2 text-cyan-400 font-bold"><Tex tex="T(n) = 2T(n/2) + n" /></div>
                    </div>

                    <div className="text-cyan-400 text-base mb-3 min-h-[1.5rem]">{statusTexts[step]}</div>

                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
                        {show(1) && <g>
                            <line x1={SEP_X} y1={l0y - S0[1] - 6} x2={SEP_X} y2={leafY + Sl[1] + 6}
                                stroke="#1e293b" strokeWidth="1" strokeDasharray="3,3" />
                            <text x={COST_X} y={l0y - S0[1] - 10} fill="#475569" fontSize="10"
                                textAnchor="middle" fontFamily="JetBrains Mono">行开销</text>
                        </g>}

                        {show(2) && l1x.map((cx, i) => (
                            <path key={i} d={bez(l0x, l0y + S0[1], cx, l1y - S1[1])}
                                fill="none" stroke="#1e3a8a" strokeWidth="1.5" opacity="0.8" />
                        ))}

                        {show(3) && [[0,0],[0,1],[1,2],[1,3]].map(([pi,ci]) => (
                            <path key={`${pi}-${ci}`} d={bez(l1x[pi], l1y + S1[1], l2x[ci], l2y - S2[1])}
                                fill="none" stroke="#1e3a8a" strokeWidth="1.5" opacity="0.6" />
                        ))}

                        {show(4) && (
                            <text x={l0x} y={(l2y + S2[1] + leafY - Sl[1]) / 2 + 6}
                                fill="#334155" fontSize="16" textAnchor="middle">⋮</text>
                        )}

                        {show(1) && <g>
                            <rect x={l0x-S0[0]} y={l0y-S0[1]} width={S0[0]*2} height={S0[1]*2} rx="6"
                                fill="rgba(34,211,238,0.15)" stroke="#22d3ee" strokeWidth="1.5" />
                            <text x={l0x} y={l0y+5} fill="#22d3ee" fontSize="13" fontWeight="bold"
                                textAnchor="middle" fontFamily="JetBrains Mono">n</text>
                            {costLabel(l0y + 5, '= n', 1)}
                        </g>}

                        {show(2) && l1x.map((x, i) => (
                            <g key={i}>
                                <rect x={x-S1[0]} y={l1y-S1[1]} width={S1[0]*2} height={S1[1]*2} rx="5"
                                    fill="rgba(6,182,212,0.12)" stroke="#06b6d4" strokeWidth="1.5" />
                                <text x={x} y={l1y+4} fill="#67e8f9" fontSize="11"
                                    textAnchor="middle" fontFamily="JetBrains Mono">n/2</text>
                                {i === 1 && costLabel(l1y + 4, '= n', 2)}
                            </g>
                        ))}

                        {show(3) && l2x.map((x, i) => (
                            <g key={i}>
                                <rect x={x-S2[0]} y={l2y-S2[1]} width={S2[0]*2} height={S2[1]*2} rx="4"
                                    fill="rgba(8,145,178,0.10)" stroke="#0891b2" strokeWidth="1.5" />
                                <text x={x} y={l2y+4} fill="#7dd3fc" fontSize="9"
                                    textAnchor="middle" fontFamily="JetBrains Mono">n/4</text>
                                {i === 3 && costLabel(l2y + 4, '= n', 3)}
                            </g>
                        ))}

                        {show(4) && <g>
                            {[30, 90, 150].map((x, i) => (
                                <g key={i}>
                                    <rect x={x-Sl[0]} y={leafY-Sl[1]} width={Sl[0]*2} height={Sl[1]*2} rx="3"
                                        fill="rgba(71,85,105,0.15)" stroke="#475569" strokeWidth="1" />
                                    <text x={x} y={leafY+4} fill="#64748b" fontSize="9"
                                        textAnchor="middle" fontFamily="JetBrains Mono">1</text>
                                </g>
                            ))}
                            <text x={l0x} y={leafY+5} fill="#334155" fontSize="15" textAnchor="middle">···</text>
                            {[270, 330, 390].map((x, i) => (
                                <g key={i}>
                                    <rect x={x-Sl[0]} y={leafY-Sl[1]} width={Sl[0]*2} height={Sl[1]*2} rx="3"
                                        fill="rgba(71,85,105,0.15)" stroke="#475569" strokeWidth="1" />
                                    <text x={x} y={leafY+4} fill="#64748b" fontSize="9"
                                        textAnchor="middle" fontFamily="JetBrains Mono">1</text>
                                </g>
                            ))}
                            {costLabel(leafY + 5, '≈ n', 4)}
                        </g>}
                    </svg>

                    {show(5) && (
                        <div className="mt-3 p-4 rounded-lg border border-cyan-500/30 bg-cyan-900/10 leading-relaxed space-y-2">
                            <div className="text-slate-400 text-base font-mono">{'// 递归树逐层求和'}</div>
                            <div className="text-white overflow-x-auto">
                                <Tex display={true} tex={String.raw`T(n) = \underbrace{n + n + \cdots + n}_{\log_2 n + 1 \;\text{层}} = n(\log_2 n + 1)`} />
                            </div>
                            <div className="text-cyan-300">
                                <Tex display={true} tex={String.raw`\therefore\; T(n) = O(n \log n)`} />
                            </div>
                        </div>
                    )}

                    <StepButton step={step} setStep={setStep} maxStep={maxStep}
                        label={
                            step === 0 ? '准备开始' :
                            step === 1 ? '根节点' :
                            step <= 3 ? `展开第 ${step - 1} 层` :
                            step === 4 ? '叶节点' : '求和完成'
                        }
                    />
                </div>
            );
        };

        const CaseComplexityAnimation = () => {
            const [caseType, setCaseType] = useState('best');
            const [step, setStep] = useState(0);

            const arr = [7, 3, 9, 1, 5, 8, 2, 6, 4, 10];

            const cases = {
                best:  { target: 7,  label: '最好情况', color: '#34d399', notation: '\\Omega(1)',   complexity: 'O(1)',   desc: '目标 7 恰在首位，仅需 1 次比较即可找到' },
                avg:   { target: 5,  label: '平均情况', color: '#fbbf24', notation: '\\Theta(n/2)', complexity: 'O(n)',   desc: '目标 5 在第 5 位，平均需要 n/2 次比较' },
                worst: { target: 11, label: '最坏情况', color: '#f87171', notation: 'O(n)',          complexity: 'O(n)',   desc: '目标 11 不存在，必须遍历全部 n 个元素' },
            };

            const getSteps = (ct) => {
                const { target } = cases[ct];
                const steps = [{ checking: -1, found: false, done: false, comparisons: 0, label: '初始化顺序查找，从 arr[0] 开始' }];
                for (let i = 0; i < arr.length; i++) {
                    const found = arr[i] === target;
                    steps.push({
                        checking: i, found, done: found, comparisons: i + 1,
                        label: found
                            ? `arr[${i}] = ${arr[i]} = ${target}  ✓  找到目标！`
                            : `arr[${i}] = ${arr[i]} ≠ ${target}，继续向后查找`,
                    });
                    if (found) break;
                }
                if (!steps.some(s => s.found)) {
                    steps.push({ checking: -1, found: false, done: true, comparisons: arr.length, label: '遍历结束，未找到目标元素' });
                }
                return steps;
            };

            const handleCaseChange = (ct) => { setCaseType(ct); setStep(0); };

            const currentCase = cases[caseType];
            const steps = getSteps(caseType);
            const maxStep = steps.length - 1;
            const cur = steps[Math.min(step, maxStep)];

            const caseResults = {
                best:  getSteps('best').at(-1).comparisons,
                avg:   getSteps('avg').at(-1).comparisons,
                worst: getSteps('worst').at(-1).comparisons,
            };

            return (
                <div className="font-mono text-base">
                    <div className="flex gap-2 mb-5">
                        {Object.entries(cases).map(([key, c]) => (
                            <button
                                key={key}
                                onClick={() => handleCaseChange(key)}
                                className="px-3 py-1.5 rounded text-base font-mono transition-all duration-200"
                                style={{
                                    background: caseType === key ? `${c.color}22` : 'rgba(30,41,59,0.5)',
                                    color: caseType === key ? c.color : '#64748b',
                                    border: `1px solid ${caseType === key ? c.color + '66' : 'rgba(51,65,85,0.5)'}`,
                                    fontWeight: caseType === key ? 'bold' : 'normal',
                                }}
                            >
                                {c.label}
                            </button>
                        ))}
                    </div>

                    <div className="mb-4 p-3 rounded-lg bg-slate-900/50 border border-white/5 text-base leading-relaxed space-y-1">
                        <div className="text-slate-400">
                            <span className="text-cyan-400">def </span>
                            <span className="text-green-400">linearSearch</span>
                            (arr, target):
                        </div>
                        <div className="pl-5 text-slate-400">
                            <span className="text-cyan-400">for </span>i <span className="text-cyan-400">in range</span>(len(arr)):
                        </div>
                        <div className="pl-10 text-slate-400">
                            <span className="text-cyan-400">if </span>arr[i] == target: <span className="text-green-400">return</span> i
                        </div>
                        <div className="pl-5 text-slate-400"><span className="text-red-400">return</span> -1</div>
                        <div className="mt-2 pt-2 border-t border-white/5" style={{ color: currentCase.color }}>
                            // {currentCase.desc}
                        </div>
                    </div>

                    <div className="text-base mb-3 min-h-[1.5rem] flex items-center gap-3">
                        <span style={{ color: cur.found ? '#34d399' : cur.done ? '#f87171' : '#22d3ee' }}>
                            {cur.label}
                        </span>
                        <span className="text-slate-500 ml-auto shrink-0">
                            比较: <span className="text-white font-bold">{cur.comparisons}</span> / {arr.length}
                        </span>
                    </div>

                    <div className="flex justify-center gap-1 mb-3">
                        {arr.map((val, i) => {
                            const isChecking = cur.checking === i;
                            const isFound    = isChecking && cur.found;
                            const isPast     = cur.checking >= 0 ? i < cur.checking : false;

                            let bg = 'rgba(30,41,59,0.5)';
                            let border = '#334155';
                            let textColor = '#64748b';

                            if (isFound)      { bg = `${currentCase.color}33`; border = currentCase.color; textColor = currentCase.color; }
                            else if (isChecking) { bg = 'rgba(250,204,21,0.18)'; border = '#fbbf24'; textColor = '#fbbf24'; }
                            else if (isPast)  { bg = 'rgba(239,68,68,0.07)'; border = 'rgba(239,68,68,0.25)'; textColor = '#475569'; }

                            return (
                                <div key={i} className="flex flex-col items-center gap-0.5">
                                    <div
                                        className="w-10 h-10 flex items-center justify-center rounded text-base font-bold transition-all duration-200"
                                        style={{ background: bg, border: `1.5px solid ${border}`, color: textColor }}
                                    >
                                        {val}
                                    </div>
                                    <div className="text-sm text-slate-600">{i}</div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mb-4">
                        <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div
                                className="h-full rounded-full transition-all duration-300"
                                style={{
                                    width: `${(cur.comparisons / arr.length) * 100}%`,
                                    background: currentCase.color,
                                }}
                            />
                        </div>
                    </div>

                    <div className="p-3 rounded-lg border mb-4 transition-all"
                        style={{
                            visibility: cur.done ? 'visible' : 'hidden',
                            borderColor: currentCase.color + '55',
                            background: currentCase.color + '0d',
                        }}>
                        <div className="flex items-center justify-between">
                            <div>
                                <span className="text-slate-400 text-base">此情况渐近记号：</span>
                                <span className="ml-2 font-bold" style={{ color: currentCase.color }}><Tex tex={currentCase.notation} /></span>
                            </div>
                            <div>
                                <span className="text-slate-400 text-base">时间复杂度：</span>
                                <span className="ml-2 font-bold text-white">{currentCase.complexity}</span>
                            </div>
                            <div>
                                <span className="text-slate-400 text-base">比较次数：</span>
                                <span className="ml-2 font-bold" style={{ color: currentCase.color }}>{cur.comparisons}</span>
                            </div>
                        </div>
                    </div>

                    <div className="mt-5 border border-white/5 rounded-lg overflow-hidden text-base">
                        <div className="bg-slate-800/40 px-3 py-1.5 text-slate-400 font-mono">// 顺序查找 (n={arr.length})：三种情况对比</div>
                        <table className="w-full">
                            <thead>
                                <tr className="border-b border-white/5">
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">情况</th>
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">触发条件</th>
                                    <th className="text-center px-3 py-2 text-slate-500 font-normal">比较次数</th>
                                    <th className="text-center px-3 py-2 text-slate-500 font-normal">渐近记号</th>
                                </tr>
                            </thead>
                            <tbody>
                                {[
                                    { key: 'best',  label: '最好', cond: '目标在首位',    n: caseResults.best,  note: '\\Omega(1)',   color: '#34d399' },
                                    { key: 'avg',   label: '平均', cond: '目标在中间位置', n: caseResults.avg,  note: '\\Theta(n/2)', color: '#fbbf24' },
                                    { key: 'worst', label: '最坏', cond: '目标不存在',    n: caseResults.worst, note: 'O(n)',         color: '#f87171' },
                                ].map(row => (
                                    <tr key={row.key}
                                        className="border-b border-white/5 transition-colors"
                                        style={{ background: caseType === row.key ? row.color + '0a' : 'transparent' }}
                                    >
                                        <td className="px-3 py-2 font-bold" style={{ color: row.color }}>{row.label}</td>
                                        <td className="px-3 py-2 text-slate-400">{row.cond}</td>
                                        <td className="px-3 py-2 text-center text-white font-bold">{row.n}</td>
                                        <td className="px-3 py-2 text-center font-bold" style={{ color: row.color }}><Tex tex={row.note} /></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <StepButton step={step} setStep={setStep} maxStep={maxStep}
                        label={step === 0 ? '准备开始' : cur.done ? '搜索结束' : `第 ${step} 步`}
                    />
                </div>
            );
        };

        const MasterTheoremPanel = () => {
            const cases = [
                {
                    num: '1',
                    color: '#22d3ee',
                    cond: <span>若 <Tex tex="f(n) = O\!\left(n^{\log_b a - \varepsilon}\right)" /> 对某 <Tex tex="\varepsilon > 0" /> 成立</span>,
                    result: <span><Tex tex="T(n) = \Theta\!\left(n^{\log_b a}\right)" /></span>,
                    note: <span><Tex tex="f(n)" /> 增长慢于 <Tex tex="n^{\log_b a}" />，递归项占主导</span>,
                },
                {
                    num: '2',
                    color: '#a78bfa',
                    cond: <span>若 <Tex tex="f(n) = \Theta\!\left(n^{\log_b a}\right)" /></span>,
                    result: <span><Tex tex="T(n) = \Theta\!\left(n^{\log_b a} \log n\right)" /></span>,
                    note: <span><Tex tex="f(n)" /> 与递归项同阶，多一个 <Tex tex="\log" /> 因子</span>,
                },
                {
                    num: '3',
                    color: '#34d399',
                    cond: <span>若 <Tex tex="f(n) = \Omega\!\left(n^{\log_b a + \varepsilon}\right)" /> 且 <Tex tex="af(n/b) \leq cf(n)" /></span>,
                    result: <span><Tex tex="T(n) = \Theta(f(n))" /></span>,
                    note: <span><Tex tex="f(n)" /> 增长快于 <Tex tex="n^{\log_b a}" />，<Tex tex="f(n)" /> 占主导</span>,
                },
            ];

            const examples = [
                { recur: 'T(n) = 2T(n/2) + n',     a:'2', b:'2', logba:'1', caseNum:'2', result:'\\Theta(n \\log n)', algo:'归并排序' },
                { recur: 'T(n) = T(n/2) + O(1)',    a:'1', b:'2', logba:'0', caseNum:'2', result:'\\Theta(\\log n)',   algo:'二分查找' },
                { recur: 'T(n) = 7T(n/2) + n^2',   a:'7', b:'2', logba:'\\approx 2.81', caseNum:'1', result:'\\Theta(n^{\\log_2 7})', algo:'Strassen' },
                { recur: 'T(n) = 4T(n/2) + n^2',   a:'4', b:'2', logba:'2', caseNum:'2', result:'\\Theta(n^2 \\log n)', algo:'' },
                { recur: 'T(n) = 3T(n/3) + n',     a:'3', b:'3', logba:'1', caseNum:'2', result:'\\Theta(n \\log n)', algo:'三路归并' },
            ];

            const caseColors = { '1': '#22d3ee', '2': '#a78bfa', '3': '#34d399' };

            return (
                <div className="font-mono text-base space-y-5">
                    <div className="p-4 rounded-lg bg-slate-900/60 border border-white/5">
                        <div className="text-slate-500 text-base mb-2">// 递归式形式</div>
                        <div className="text-center">
                            <Tex display={true} tex="T(n) = aT(n/b) + f(n)" />
                        </div>
                        <div className="text-slate-400 text-base mt-3 flex gap-6 justify-center flex-wrap">
                            <span><Tex tex="a \geq 1" />（子问题数）</span>
                            <span><Tex tex="b > 1" />（规模缩小因子）</span>
                            <span><Tex tex="f(n)" />（合并代价）</span>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <div className="text-slate-500 text-base">// 三种情况（关键量：<Tex tex="n^{\log_b a}" />）</div>
                        {cases.map(c => (
                            <div key={c.num} className="p-3 rounded-lg border"
                                style={{ borderColor: c.color + '44', background: c.color + '08' }}>
                                <div className="flex items-start gap-3">
                                    <span className="text-xs font-bold px-1.5 py-0.5 rounded shrink-0 mt-0.5"
                                        style={{ background: c.color + '22', color: c.color }}>
                                        情况 {c.num}
                                    </span>
                                    <div className="space-y-1 min-w-0">
                                        <div className="text-slate-300 text-base leading-relaxed">{c.cond}</div>
                                        <div className="font-bold" style={{ color: c.color }}>{c.result}</div>
                                        <div className="text-slate-500 text-sm">{c.note}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="border border-white/5 rounded-lg overflow-hidden">
                        <div className="bg-slate-800/40 px-3 py-1.5 text-slate-400 text-base">// 经典例题</div>
                        <table className="w-full text-base">
                            <thead>
                                <tr className="border-b border-white/5">
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">递归式</th>
                                    <th className="text-center px-2 py-2 text-slate-500 font-normal"><Tex tex="\log_b a" /></th>
                                    <th className="text-center px-2 py-2 text-slate-500 font-normal">情况</th>
                                    <th className="text-left px-3 py-2 text-slate-500 font-normal">结论</th>
                                </tr>
                            </thead>
                            <tbody>
                                {examples.map((ex, i) => (
                                    <tr key={i} className="border-b border-white/5">
                                        <td className="px-3 py-2 text-slate-300">
                                            <Tex tex={ex.recur.replace(/\s/g, '\\,')} />
                                            {ex.algo && <span className="text-slate-600 ml-2 text-xs">({ex.algo})</span>}
                                        </td>
                                        <td className="px-2 py-2 text-center text-slate-400"><Tex tex={ex.logba} /></td>
                                        <td className="px-2 py-2 text-center font-bold" style={{ color: caseColors[ex.caseNum] }}>{ex.caseNum}</td>
                                        <td className="px-3 py-2 font-bold" style={{ color: caseColors[ex.caseNum] }}><Tex tex={ex.result} /></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const SpaceComplexityPanel = () => {
            const [step, setStep] = useState(0);
            const maxDepth = 4;

            const recSteps = [
                { stack: [],                                                            ret: null },
                { stack: ['factorial(4)'],                                              ret: null },
                { stack: ['factorial(4)','factorial(3)'],                               ret: null },
                { stack: ['factorial(4)','factorial(3)','factorial(2)'],                ret: null },
                { stack: ['factorial(4)','factorial(3)','factorial(2)','factorial(1)'], ret: null },
                { stack: ['factorial(4)','factorial(3)','factorial(2)'],                ret: 1    },
                { stack: ['factorial(4)','factorial(3)'],                               ret: 2    },
                { stack: ['factorial(4)'],                                              ret: 6    },
                { stack: [],                                                            ret: 24   },
            ];

            const iterSteps = [
                { res: 1,  i: '初始', active: 'res' },
                { res: 1,  i: 2,      active: 'i'   },
                { res: 2,  i: 2,      active: 'res' },
                { res: 6,  i: 3,      active: 'res' },
                { res: 24, i: 4,      active: 'res' },
                { res: 24, i: '✓',   active: null  },
                { res: 24, i: '✓',   active: null  },
                { res: 24, i: '✓',   active: null  },
                { res: 24, i: '✓',   active: null  },
            ];

            const recLabels = [
                '调用栈为空',
                '调用 factorial(4)，压入一帧',
                '递归调用 factorial(3)，再压一帧',
                '递归调用 factorial(2)，再压一帧',
                '递归调用 factorial(1)，栈深度达到最大值 n',
                'factorial(1) 返回 1，弹出一帧',
                'factorial(2) 返回 2，弹出一帧',
                'factorial(3) 返回 6，弹出一帧',
                'factorial(4) 返回 24，调用栈清空',
            ];

            const iterLabels = [
                '初始化：res = 1',
                'i = 2，准备执行 res *= i',
                'res = 1 × 2 = 2，i 推进至 3',
                'res = 2 × 3 = 6，i 推进至 4',
                'res = 6 × 4 = 24，循环结束',
                '计算已完成，res = 24',
                '计算已完成，res = 24',
                '计算已完成，res = 24',
                '计算已完成，res = 24',
            ];

            const rec = recSteps[step];
            const iter = iterSteps[step];

            const MemCell = ({ name, value, active }) => (
                <div className="flex flex-col items-center gap-1">
                    <div className="text-sm text-slate-500">{name}</div>
                    <div className="w-16 h-10 flex items-center justify-center rounded text-base font-bold transition-all duration-300"
                        style={{
                            background: active ? 'rgba(52,211,153,0.18)' : 'rgba(30,41,59,0.7)',
                            border: `1px solid ${active ? '#34d399' : '#334155'}`,
                            color: active ? '#34d399' : '#94a3b8',
                        }}>
                        {value}
                    </div>
                </div>
            );

            return (
                <div className="font-mono text-base space-y-3">
                    <div className="p-3 rounded-lg bg-slate-900/60 border border-white/5 text-base text-slate-400 leading-relaxed">
                        空间复杂度衡量算法运行时所需的<span className="text-cyan-400">额外存储空间</span>随输入规模 <Tex tex="n" /> 的增长趋势，包括辅助变量、递归调用栈等。
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="p-3 rounded-lg border border-cyan-500/25 bg-cyan-900/8 space-y-3">
                            <div className="text-base font-bold text-cyan-400">递归版本</div>
                            <div className="text-base leading-relaxed space-y-0.5 text-slate-400 bg-slate-900/50 rounded p-2">
                                <div><span className="text-cyan-400">def </span><span className="text-green-400">factorial</span>(n):</div>
                                <div className="pl-4"><span className="text-cyan-400">if </span>n == 1: <span className="text-green-400">return</span> 1</div>
                                <div className="pl-4"><span className="text-cyan-400">return </span>n * <span className="text-green-400">factorial</span>(n-1)</div>
                            </div>
                            <div className="text-base text-cyan-400 min-h-[2rem] leading-relaxed">{recLabels[step]}</div>
                            <div className="text-base text-slate-500">调用栈（深度 {rec.stack.length} / {maxDepth}）</div>
                            <div className="flex flex-col-reverse gap-1">
                                {Array.from({ length: maxDepth }, (_, i) => {
                                    const frame = rec.stack[i];
                                    const isTop = frame !== undefined && i === rec.stack.length - 1;
                                    return frame !== undefined ? (
                                        <div key={i} className="px-2 py-1.5 rounded text-base font-bold text-center transition-all duration-300"
                                            style={{
                                                background: isTop ? 'rgba(34,211,238,0.18)' : 'rgba(30,41,59,0.7)',
                                                border: `1px solid ${isTop ? '#22d3ee' : '#334155'}`,
                                                color: isTop ? '#22d3ee' : '#94a3b8',
                                            }}>
                                            {frame}
                                            {isTop && rec.ret !== null && <span className="text-green-400 ml-1 font-normal">→ {rec.ret}</span>}
                                        </div>
                                    ) : (
                                        <div key={i} className="px-2 py-1.5 rounded text-base text-center border border-dashed border-slate-800 text-slate-700">—</div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="p-3 rounded-lg border border-green-500/25 bg-green-900/8 space-y-3">
                            <div className="text-base font-bold text-green-400">迭代版本</div>
                            <div className="text-base leading-relaxed space-y-0.5 text-slate-400 bg-slate-900/50 rounded p-2">
                                <div><span className="text-cyan-400">def </span><span className="text-green-400">factorial</span>(n):</div>
                                <div className="pl-4">res = 1</div>
                                <div className="pl-4"><span className="text-cyan-400">for </span>i <span className="text-cyan-400">in range</span>(2, n+1):</div>
                                <div className="pl-8">res *= i</div>
                                <div className="pl-4"><span className="text-cyan-400">return </span>res</div>
                            </div>
                            <div className="text-base text-green-400 min-h-[2rem] leading-relaxed">{iterLabels[step]}</div>
                            <div className="text-base text-slate-500">内存（始终只有 3 个变量）</div>
                            <div className="flex gap-3 justify-center" style={{ minHeight: `${maxDepth * 24}px`, alignItems: 'flex-start', paddingTop: '8px' }}>
                                <MemCell name="n"   value={4}        active={false} />
                                <MemCell name="res" value={iter.res} active={iter.active === 'res'} />
                                <MemCell name="i"   value={iter.i}   active={iter.active === 'i'} />
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4" style={{ visibility: step === recSteps.length - 1 ? 'visible' : 'hidden' }}>
                        <div className="p-3 rounded-lg border border-cyan-500/25 bg-cyan-900/8 space-y-1">
                            <div className="text-base text-slate-400">最大栈深度 <Tex tex="= n" />，随输入线性增长</div>
                            <div className="text-base font-bold text-cyan-400">空间复杂度 <Tex tex="= O(n)" /></div>
                        </div>
                        <div className="p-3 rounded-lg border border-green-500/25 bg-green-900/8 space-y-1">
                            <div className="text-base text-slate-400">变量数与 <Tex tex="n" /> 无关，始终只有 3 个</div>
                            <div className="text-base font-bold text-green-400">空间复杂度 <Tex tex="= O(1)" /></div>
                        </div>
                    </div>

                    <StepButton step={step} setStep={setStep} maxStep={recSteps.length - 1}
                        label={step === 0 ? '开始' : step === recSteps.length - 1 ? '完成' : `第 ${step} 步`} />
                </div>
            );
        };

        const ComplexitySection = () => {
            const [activePanel, setActivePanel] = useState('counting');
            return (
                <section id="complexity" className="py-20">
                    <div className="container mx-auto px-6">
                        <SectionHeader title="算法复杂度分析" subtitle="COMPLEXITY ANALYSIS" />
                        <div className="grid lg:grid-cols-[3fr_7fr] gap-8">
                            <div className="space-y-4">
                                <KnowledgeCard title="计数法分析时间复杂度" onClick={() => setActivePanel('counting')} active={activePanel === 'counting'} />
                                <KnowledgeCard title="递归树法分析时间复杂度" onClick={() => setActivePanel('recurse')} active={activePanel === 'recurse'} />
                                <KnowledgeCard title="最坏、最好、平均情况的时间复杂度" onClick={() => setActivePanel('cases')} active={activePanel === 'cases'} />
                                <KnowledgeCard title={<span>渐近记号 <Tex tex="O" />、<Tex tex="\Omega" />、<Tex tex="\Theta" /></span>} onClick={() => setActivePanel('asymptotic')} active={activePanel === 'asymptotic'} />
                                <KnowledgeCard title="渐近增长率对比" onClick={() => setActivePanel('chart')} active={activePanel === 'chart'} />
                                <KnowledgeCard title="主定理 (Master Theorem)" onClick={() => setActivePanel('master')} active={activePanel === 'master'} />
                                <KnowledgeCard title="空间复杂度" onClick={() => setActivePanel('space')} active={activePanel === 'space'} />
                            </div>
                            <div className="glass-panel p-6 rounded-xl flex flex-col overflow-hidden">
                                <h4 className="text-white font-bold mb-4">
                                    {activePanel === 'counting'   ? '计数法：逐行操作计数' :
                                     activePanel === 'recurse'    ? '递归树法：逐层展开分析' :
                                     activePanel === 'cases'      ? '顺序查找：三种情况时间复杂度' :
                                     activePanel === 'asymptotic' ? <span>渐近记号 <Tex tex="O" />、<Tex tex="\Omega" />、<Tex tex="\Theta" /> 的几何含义</span> :
                                     activePanel === 'master'     ? '主定理 (Master Theorem)' :
                                     activePanel === 'space'      ? '空间复杂度' :
                                     '渐近增长率对比'}
                                </h4>
                                {activePanel === 'counting'   ? <CountingMethodAnimation /> :
                                 activePanel === 'recurse'    ? <RecursionTreeAnimation /> :
                                 activePanel === 'cases'      ? <CaseComplexityAnimation /> :
                                 activePanel === 'asymptotic' ? <AsymptoticNotationAnimation /> :
                                 activePanel === 'master'     ? <MasterTheoremPanel /> :
                                 activePanel === 'space'      ? <SpaceComplexityPanel /> :
                                 <ComplexityChart />}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileNav, setMobileNav] = useState(false);
            const currentId = 'complexity';

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="algorithm.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Course</span>
                            </a>
                            <div className="hidden lg:flex gap-4">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`text-xs font-mono transition-colors no-underline ${s.id === currentId ? 'text-cyan-400' : 'text-slate-500 hover:text-cyan-400'}`}>
                                        <span className="text-cyan-600">{s.num}</span> {s.titleEn}
                                    </a>
                                ))}
                            </div>
                            <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setMobileNav(!mobileNav)}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            </button>
                        </div>
                        {mobileNav && (
                            <div className="lg:hidden bg-slate-950/95 border-t border-white/5 px-6 py-4 space-y-2">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`block text-sm font-mono transition-colors no-underline py-1 ${s.id === currentId ? 'text-cyan-400' : 'text-slate-400 hover:text-cyan-400'}`} onClick={() => setMobileNav(false)}>
                                        <span className="text-cyan-600">{s.num}</span> {s.title}
                                    </a>
                                ))}
                            </div>
                        )}
                    </nav>
                    <ComplexitySection />
                    <footer className="py-12 border-t border-white/5 bg-black/40 backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <p className="text-sm text-gray-600 font-mono">
                                © {new Date().getFullYear()} Dingming Wu. Algorithm Design and Analysis Course Material.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
