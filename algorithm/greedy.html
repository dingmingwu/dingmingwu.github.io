<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greedy Algorithms - Algorithm Design and Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.6); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8">
                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// {subtitle}</span>
                <h2 className="text-3xl md:text-4xl font-bold text-white tracking-tight">{title}</h2>
                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4"></div>
            </div>
        );

        const StepButton = ({ step, setStep, maxStep, label }) => (
            <div className="flex items-center gap-3 mt-4">
                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-base font-mono hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Prev</button>
                <button onClick={() => setStep(Math.min(maxStep, step + 1))} disabled={step >= maxStep} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-base font-mono hover:bg-cyan-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Next</button>
                <span className="text-base text-slate-500 font-mono">{label || `Step ${step} / ${maxStep}`}</span>
            </div>
        );

        const KnowledgeCard = ({ title, children, onClick, active }) => (
            <div
                className={`glass-panel p-6 rounded-xl mb-4 transition-all duration-200${onClick ? ' cursor-pointer' : ''}`}
                onClick={onClick}
                style={active ? { borderColor: 'rgba(34,211,238,0.5)', background: 'rgba(6,182,212,0.07)', boxShadow: '0 0 16px rgba(34,211,238,0.1)' } : {}}
            >
                <h4 className={`text-lg font-bold mb-2 ${active ? 'text-cyan-300' : 'text-white'}`}>{title}</h4>
                {children && <div className="text-slate-400 text-base leading-relaxed">{children}</div>}
            </div>
        );

        const Tex = ({ tex }) => {
            const html = katex.renderToString(tex, { throwOnError: false });
            return <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        const sections = [
            { id: 'complexity', num: '01', title: '算法复杂度分析', titleEn: 'Complexity Analysis' },
            { id: 'divide', num: '02', title: '分治法', titleEn: 'Divide and Conquer' },
            { id: 'backtrack', num: '03', title: '回溯法', titleEn: 'Backtracking' },
            { id: 'dp', num: '04', title: '动态规划', titleEn: 'Dynamic Programming' },
            { id: 'greedy', num: '05', title: '贪心法', titleEn: 'Greedy Algorithms' },
            { id: 'maxflow', num: '06', title: '最大流', titleEn: 'Maximum Flow' },
            { id: 'amortized', num: '07', title: '摊还分析', titleEn: 'Amortized Analysis' },
            { id: 'np', num: '08', title: 'NP理论', titleEn: 'NP Theory' },
        ];

        const BasicIdeaAnimation = () => {
            const denoms = [25, 10, 5, 1];
            const computeSteps = () => {
                const steps = [];
                let remaining = 41;
                const selected = [];
                steps.push({ remaining, selected: [], active: -1, label: 'Target: 41¢ — pick largest coin that fits' });
                for (let di = 0; di < denoms.length; di++) {
                    while (remaining >= denoms[di]) {
                        selected.push(denoms[di]);
                        remaining -= denoms[di];
                        steps.push({ remaining, selected: [...selected], active: di, label: `Pick ${denoms[di]}¢ → Remaining: ${remaining}¢` });
                    }
                }
                steps.push({ remaining: 0, selected: [...selected], active: -1, label: `Done! ${selected.length} coins total` });
                return steps;
            };
            const steps = computeSteps();
            const [step, setStep] = useState(0);
            const current = steps[step];
            const w = 500, h = 290;
            const denomCx = [80, 200, 320, 430];
            const denomCy = 115, selCy = 225, r = 32;
            return (
                <div className="flex flex-col flex-1">
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-lg mx-auto mt-4">
                        <text x={w / 2} y="18" fill="#22d3ee" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{current.label}</text>

                        <text x="8" y="64" fill="#475569" fontSize="16" fontFamily="JetBrains Mono" letterSpacing="2">DENOMINATIONS</text>
                        {denoms.map((d, i) => {
                            const isActive = current.active === i;
                            return (
                                <g key={d}>
                                    <circle cx={denomCx[i]} cy={denomCy} r={r}
                                        fill={isActive ? 'rgba(6,182,212,0.25)' : 'rgba(30,41,59,0.8)'}
                                        stroke={isActive ? '#06b6d4' : '#334155'}
                                        strokeWidth={isActive ? 2 : 1} />
                                    <text x={denomCx[i]} y={denomCy + 6} fill={isActive ? '#22d3ee' : '#475569'}
                                        fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{d}¢</text>
                                </g>
                            );
                        })}
                        <text x="8" y="183" fill="#475569" fontSize="16" fontFamily="JetBrains Mono" letterSpacing="2">SELECTED</text>
                        {current.selected.length === 0 && (
                            <text x="10" y={selCy + 6} fill="#1e293b" fontSize="16" fontFamily="JetBrains Mono">—</text>
                        )}
                        {current.selected.map((coin, i) => (
                            <g key={i}>
                                <circle cx={55 + i * 75} cy={selCy} r={26}
                                    fill="rgba(6,182,212,0.2)" stroke="#06b6d4" strokeWidth="1.5" />
                                <text x={55 + i * 75} y={selCy + 6} fill="#22d3ee"
                                    fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{coin}¢</text>
                            </g>
                        ))}
                        <text x={w - 10} y={h - 8} fill={current.remaining === 0 ? '#22d3ee' : '#94a3b8'}
                            fontSize="16" textAnchor="end" fontFamily="JetBrains Mono" fontWeight="bold">
                            Remaining: {current.remaining}¢
                        </text>
                    </svg>
                    <div className="mt-auto">
                        <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                    </div>
                </div>
            );
        };

        const LocalVsGlobalAnimation = () => {
            const nodes = [
                { val: 3, x: 260, y: 35 },
                { val: 7, x: 130, y: 120 },
                { val: 4, x: 390, y: 120 },
                { val: 2, x: 60,  y: 205 },
                { val: 4, x: 200, y: 205 },
                { val: 6, x: 320, y: 205 },
                { val: 9, x: 460, y: 205 },
            ];
            const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
            const steps = [
                { gN: [], oN: [], gE: [], oE: [], label: 'Which path from root to leaf maximizes the sum?', final: false },
                { gN: [0,1], oN: [], gE: ['0-1'], oE: [], label: 'Greedy picks 7 (larger child: 7 > 4)', final: false },
                { gN: [0,1,4], oN: [], gE: ['0-1','1-4'], oE: [], label: 'Greedy picks 4 (larger child: 4 > 2) → sum = 3+7+4 = 14', final: false },
                { gN: [0,1,4], oN: [0,2,6], gE: ['0-1','1-4'], oE: ['0-2','2-6'], label: 'Optimal path: 3 → 4 → 9 = 16', final: false },
                { gN: [0,1,4], oN: [0,2,6], gE: ['0-1','1-4'], oE: ['0-2','2-6'], label: 'Greedy fails to find global optimum', final: true },
            ];
            const [step, setStep] = useState(0);
            const cur = steps[step];
            const gNSet = new Set(cur.gN), oNSet = new Set(cur.oN);
            const gESet = new Set(cur.gE), oESet = new Set(cur.oE);

            const nodeStyle = (i) => {
                if (oNSet.has(i)) return { fill: 'rgba(6,182,212,0.25)', stroke: '#06b6d4', text: '#22d3ee' };
                if (gNSet.has(i)) return { fill: 'rgba(239,68,68,0.2)', stroke: '#ef4444', text: '#fca5a5' };
                return { fill: 'rgba(30,41,59,0.8)', stroke: '#334155', text: '#475569' };
            };
            const edgeStyle = (a, b) => {
                const k = `${a}-${b}`;
                if (oESet.has(k)) return { stroke: '#06b6d4', strokeWidth: 2 };
                if (gESet.has(k)) return { stroke: '#ef4444', strokeWidth: 2 };
                return { stroke: '#1e293b', strokeWidth: 1 };
            };

            return (
                <div className="flex flex-col flex-1">
                    <div className="text-base font-mono text-cyan-400 mb-2">{cur.label}</div>
                    <svg viewBox="0 0 520 230" className="w-full max-w-lg mx-auto">
                        {edges.map(([a, b]) => {
                            const { stroke, strokeWidth } = edgeStyle(a, b);
                            return <line key={`${a}-${b}`} x1={nodes[a].x} y1={nodes[a].y} x2={nodes[b].x} y2={nodes[b].y} stroke={stroke} strokeWidth={strokeWidth} />;
                        })}
                        {nodes.map((n, i) => {
                            const { fill, stroke, text } = nodeStyle(i);
                            return (
                                <g key={i}>
                                    <circle cx={n.x} cy={n.y} r={22} fill={fill} stroke={stroke} strokeWidth="1.5" />
                                    <text x={n.x} y={n.y + 5} fill={text} fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{n.val}</text>
                                </g>
                            );
                        })}
                    </svg>
                    {cur.final && (
                        <div className="flex gap-8 mt-2 font-mono text-base justify-center">
                            <span className="text-red-400">Greedy: 3+7+4 = 14 ✗</span>
                            <span className="text-cyan-400">Optimal: 3+4+9 = 16 ✓</span>
                        </div>
                    )}
                    <div className="mt-auto">
                        <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                    </div>
                </div>
            );
        };

        const HuffmanAnimation = () => {
            const r = 24;
            const treeNodes = {
                root: { label:'100', x:310, y:30,  leaf:false },
                f:    { label:'f',   x:90,  y:105, leaf:true  },
                n55:  { label:'55',  x:460, y:105, leaf:false },
                n25:  { label:'25',  x:340, y:185, leaf:false },
                n30:  { label:'30',  x:545, y:185, leaf:false },
                c:    { label:'c',   x:260, y:265, leaf:true  },
                d:    { label:'d',   x:385, y:265, leaf:true  },
                n14:  { label:'14',  x:490, y:265, leaf:false },
                e:    { label:'e',   x:590, y:265, leaf:true  },
                a:    { label:'a',   x:450, y:345, leaf:true  },
                b:    { label:'b',   x:530, y:345, leaf:true  },
            };
            const treeEdges = [
                { from:'root', to:'f',   bit:'0' },
                { from:'root', to:'n55', bit:'1' },
                { from:'n55',  to:'n25', bit:'0' },
                { from:'n55',  to:'n30', bit:'1' },
                { from:'n25',  to:'c',   bit:'0' },
                { from:'n25',  to:'d',   bit:'1' },
                { from:'n30',  to:'n14', bit:'0' },
                { from:'n30',  to:'e',   bit:'1' },
                { from:'n14',  to:'a',   bit:'0' },
                { from:'n14',  to:'b',   bit:'1' },
            ];
            const freqs = { f:45, c:12, d:13, a:5, b:9, e:16 };
            const codes = { f:'0', c:'100', d:'101', a:'1100', b:'1101', e:'111' };
            const steps = [
                { vis:['a','b','c','d','e','f'], edges:[], newN:['a','b','c','d','e','f'], showCodes:false,
                  queue:[{l:'a',f:5,t:'leaf'},{l:'b',f:9,t:'leaf'},{l:'c',f:12,t:'leaf'},{l:'d',f:13,t:'leaf'},{l:'e',f:16,t:'leaf'},{l:'f',f:45,t:'leaf'}],
                  label:<span>按频率排列：<Tex tex="a(5),\;b(9),\;c(12),\;d(13),\;e(16),\;f(45)"/>（最小堆）</span> },
                { vis:['a','b','c','d','e','f','n14'], edges:['n14-a','n14-b'], newN:['n14'], showCodes:false,
                  queue:[{l:'c',f:12,t:'leaf'},{l:'d',f:13,t:'leaf'},{l:'·',f:14,t:'new'},{l:'e',f:16,t:'leaf'},{l:'f',f:45,t:'leaf'}],
                  label:<span>取出 <Tex tex="a(5)+b(9)"/>，合并为内部节点 <Tex tex="14"/></span> },
                { vis:['a','b','c','d','e','f','n14','n25'], edges:['n14-a','n14-b','n25-c','n25-d'], newN:['n25'], showCodes:false,
                  queue:[{l:'·',f:14,t:'old'},{l:'e',f:16,t:'leaf'},{l:'·',f:25,t:'new'},{l:'f',f:45,t:'leaf'}],
                  label:<span>取出 <Tex tex="c(12)+d(13)"/>，合并为内部节点 <Tex tex="25"/></span> },
                { vis:['a','b','c','d','e','f','n14','n25','n30'], edges:['n14-a','n14-b','n25-c','n25-d','n30-n14','n30-e'], newN:['n30'], showCodes:false,
                  queue:[{l:'·',f:25,t:'old'},{l:'·',f:30,t:'new'},{l:'f',f:45,t:'leaf'}],
                  label:<span>取出 <Tex tex="14+e(16)"/>，合并为内部节点 <Tex tex="30"/></span> },
                { vis:['a','b','c','d','e','f','n14','n25','n30','n55'], edges:['n14-a','n14-b','n25-c','n25-d','n30-n14','n30-e','n55-n25','n55-n30'], newN:['n55'], showCodes:false,
                  queue:[{l:'f',f:45,t:'leaf'},{l:'·',f:55,t:'new'}],
                  label:<span>取出 <Tex tex="25+30"/>，合并为内部节点 <Tex tex="55"/></span> },
                { vis:['a','b','c','d','e','f','n14','n25','n30','n55','root'], edges:['n14-a','n14-b','n25-c','n25-d','n30-n14','n30-e','n55-n25','n55-n30','root-f','root-n55'], newN:['root'], showCodes:false,
                  queue:[{l:'·',f:100,t:'new'}],
                  label:<span>取出 <Tex tex="f(45)+55"/>，合并为根节点 <Tex tex="100"/>，Huffman 树构建完成！</span> },
                { vis:['a','b','c','d','e','f','n14','n25','n30','n55','root'], edges:['n14-a','n14-b','n25-c','n25-d','n30-n14','n30-e','n55-n25','n55-n30','root-f','root-n55'], newN:[], showCodes:true,
                  queue:[],
                  label:<span>Huffman 编码——最优无前缀编码</span> },
            ];
            const qStyle = t => t==='new'
                ? {bg:'rgba(234,179,8,0.15)',border:'#eab308',text:'#fde047'}
                : t==='old'
                ? {bg:'rgba(6,182,212,0.1)',border:'#0891b2',text:'#22d3ee'}
                : {bg:'rgba(30,41,59,0.8)',border:'#334155',text:'#94a3b8'};
            const [step, setStep] = useState(0);
            const cur = steps[step];
            const visSet = new Set(cur.vis), edgeSet = new Set(cur.edges), newSet = new Set(cur.newN);
            return (
                <div>
                    <div className="text-base font-mono text-cyan-400 mb-2">{cur.label}</div>
                    <div className="flex gap-2 items-center flex-wrap mb-3" style={{minHeight: '2rem'}}>
                        {cur.queue.length > 0 && <span className="text-slate-500 font-mono text-base">队列:</span>}
                        {cur.queue.map((node, i) => {
                            const s = qStyle(node.t);
                            return (
                                <span key={i} className="font-mono text-base rounded px-2 py-0.5"
                                    style={{background:s.bg, border:`1px solid ${s.border}`, color:s.text}}>
                                    {node.l}({node.f})
                                </span>
                            );
                        })}
                    </div>
                    <svg viewBox="0 0 650 410" className="w-full max-w-lg mx-auto">
                        {treeEdges.map(({from, to, bit}) => {
                            const key = `${from}-${to}`;
                            if (!edgeSet.has(key)) return null;
                            const fn = treeNodes[from], tn = treeNodes[to];
                            const dx = tn.x-fn.x, dy = tn.y-fn.y, len = Math.sqrt(dx*dx+dy*dy);
                            const sx = fn.x+(dx/len)*r, sy = fn.y+(dy/len)*r;
                            const ex = tn.x-(dx/len)*r, ey = tn.y-(dy/len)*r;
                            const mx = (sx+ex)/2, my = (sy+ey)/2;
                            const isNew = newSet.has(from) || newSet.has(to);
                            const ox = -dy/len*10, oy = dx/len*10;
                            return (
                                <g key={key}>
                                    <line x1={sx} y1={sy} x2={ex} y2={ey}
                                        stroke={isNew ? '#eab308' : '#1e3a5f'} strokeWidth={isNew ? 2 : 1.5} />
                                    <text x={mx+ox} y={my+oy+5} fill={isNew ? '#fde047' : '#475569'}
                                        fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{bit}</text>
                                </g>
                            );
                        })}
                        {Object.entries(treeNodes).map(([id, node]) => {
                            if (!visSet.has(id)) return null;
                            const isNew = newSet.has(id);
                            let fill, stroke, textCol;
                            if (isNew) {
                                fill='rgba(234,179,8,0.25)'; stroke='#eab308'; textCol='#fde047';
                            } else if (cur.showCodes && node.leaf) {
                                fill='rgba(6,182,212,0.2)'; stroke='#06b6d4'; textCol='#22d3ee';
                            } else if (node.leaf) {
                                fill='rgba(30,41,59,0.8)'; stroke='#334155'; textCol='#94a3b8';
                            } else {
                                fill='rgba(6,182,212,0.08)'; stroke='#0891b2'; textCol='#22d3ee';
                            }
                            return (
                                <g key={id}>
                                    <circle cx={node.x} cy={node.y} r={r} fill={fill} stroke={stroke} strokeWidth="1.5" />
                                    <text x={node.x} y={node.y+6} fill={textCol}
                                        fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{node.label}</text>
                                    {node.leaf && (
                                        <text x={node.x} y={node.y+r+18} fill={cur.showCodes ? '#fde047' : '#475569'}
                                            fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">
                                            {cur.showCodes ? codes[id] : freqs[id]}
                                        </text>
                                    )}
                                </g>
                            );
                        })}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                </div>
            );
        };

        const MSTAnimation = () => {
            const pos = { A:[80,40], B:[220,40], C:[150,120], D:[80,200], E:[220,200] };
            const edges = [
                {u:'A',v:'C',w:2},{u:'C',v:'D',w:3},{u:'B',v:'C',w:4},
                {u:'A',v:'D',w:5},{u:'C',v:'E',w:6},{u:'B',v:'E',w:7},{u:'D',v:'E',w:8},
            ];
            const E = (u,v,w) => <span><Tex tex={`(${u},${v})`}/> <Tex tex={`w=${w}`}/></span>;
            const steps = [
                {
                    k: { mst:[], skip:[] },
                    p: { inTree:['A'], mstEdges:[], newEdge:null, newVertex:null },
                    kLabel: <span>按权重排序所有边，逐一考虑</span>,
                    pLabel: <span>从顶点 <Tex tex="A"/> 出发，初始化前沿</span>,
                },
                {
                    k: { mst:['A-C'], skip:[] },
                    p: { inTree:['A','C'], mstEdges:['A-C'], newEdge:'A-C', newVertex:'C' },
                    kLabel: <span>加入 {E('A','C',2)}，不成环</span>,
                    pLabel: <span>前沿最短边 {E('A','C',2)}，加入顶点 <Tex tex="C"/></span>,
                },
                {
                    k: { mst:['A-C','C-D'], skip:[] },
                    p: { inTree:['A','C','D'], mstEdges:['A-C','C-D'], newEdge:'C-D', newVertex:'D' },
                    kLabel: <span>加入 {E('C','D',3)}，不成环</span>,
                    pLabel: <span>前沿最短边 {E('C','D',3)}，加入顶点 <Tex tex="D"/></span>,
                },
                {
                    k: { mst:['A-C','C-D','B-C'], skip:[] },
                    p: { inTree:['A','B','C','D'], mstEdges:['A-C','C-D','B-C'], newEdge:'B-C', newVertex:'B' },
                    kLabel: <span>加入 {E('B','C',4)}，不成环</span>,
                    pLabel: <span>前沿最短边 {E('B','C',4)}，加入顶点 <Tex tex="B"/></span>,
                },
                {
                    k: { mst:['A-C','C-D','B-C'], skip:['A-D'] },
                    p: { inTree:['A','B','C','D'], mstEdges:['A-C','C-D','B-C'], newEdge:null, newVertex:null },
                    kLabel: <span>跳过 {E('A','D',5)}，会成环</span>,
                    pLabel: <span>前沿：<Tex tex="C\text{-}E(6),\;B\text{-}E(7),\;D\text{-}E(8)"/>，选最短 {E('C','E',6)}</span>,
                },
                {
                    k: { mst:['A-C','C-D','B-C','C-E'], skip:['A-D'] },
                    p: { inTree:['A','B','C','D','E'], mstEdges:['A-C','C-D','B-C','C-E'], newEdge:'C-E', newVertex:'E' },
                    kLabel: <span>加入 {E('C','E',6)}，MST 完成！总权重 <Tex tex="=15"/></span>,
                    pLabel: <span>加入 {E('C','E',6)}，顶点 <Tex tex="E"/> 入树，MST 完成！总权重 <Tex tex="=15"/></span>,
                },
            ];
            const [step, setStep] = useState(0);
            const cur = steps[step];
            const kMstSet = new Set(cur.k.mst), kSkipSet = new Set(cur.k.skip);
            const pInTree = new Set(cur.p.inTree), pMstSet = new Set(cur.p.mstEdges);

            const GraphSVG = ({ edgeStyle, nodeStyle }) => (
                <svg viewBox="0 0 300 240" className="w-full" style={{maxWidth: '400px', margin: '0 auto', display: 'block'}}>
                    {edges.map(({u, v, w}) => {
                        const [x1,y1]=pos[u], [x2,y2]=pos[v];
                        const mx=(x1+x2)/2, my=(y1+y2)/2;
                        const { stroke, sw } = edgeStyle(u, v);
                        return (
                            <g key={`${u}-${v}`}>
                                <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={stroke} strokeWidth={sw} />
                                <rect x={mx-9} y={my-16} width={18} height={16} rx="2" fill="#020617" />
                                <text x={mx} y={my-3} fill={stroke === '#1e293b' ? '#334155' : stroke}
                                    fontSize="12" textAnchor="middle" fontFamily="JetBrains Mono">{w}</text>
                            </g>
                        );
                    })}
                    {Object.entries(pos).map(([name, [x, y]]) => {
                        const { fill, stroke, textCol } = nodeStyle(name);
                        return (
                            <g key={name}>
                                <circle cx={x} cy={y} r={22} fill={fill} stroke={stroke} strokeWidth="1.5" />
                                <text x={x} y={y+6} fill={textCol} fontSize="12" textAnchor="middle"
                                    fontFamily="JetBrains Mono" fontWeight="bold">{name}</text>
                            </g>
                        );
                    })}
                </svg>
            );

            const kEdgeStyle = (u, v) => {
                const k = `${u}-${v}`;
                if (kMstSet.has(k)) return { stroke:'#06b6d4', sw:2 };
                if (kSkipSet.has(k)) return { stroke:'#ef4444', sw:2 };
                return { stroke:'#1e293b', sw:1 };
            };
            const kNodeStyle = (name) => {
                const inMst = cur.k.mst.some(k => k.includes(name));
                return inMst
                    ? { fill:'rgba(6,182,212,0.2)', stroke:'#06b6d4', textCol:'#22d3ee' }
                    : { fill:'rgba(30,41,59,0.8)', stroke:'#334155', textCol:'#475569' };
            };

            const pEdgeStyle = (u, v) => {
                const k = `${u}-${v}`;
                if (cur.p.newEdge === k) return { stroke:'#eab308', sw:2.5 };
                if (pMstSet.has(k)) return { stroke:'#06b6d4', sw:2 };
                return { stroke:'#1e293b', sw:1 };
            };
            const pNodeStyle = (name) => {
                if (name === cur.p.newVertex) return { fill:'rgba(234,179,8,0.25)', stroke:'#eab308', textCol:'#fde047' };
                if (pInTree.has(name)) return { fill:'rgba(6,182,212,0.2)', stroke:'#06b6d4', textCol:'#22d3ee' };
                return { fill:'rgba(30,41,59,0.8)', stroke:'#334155', textCol:'#475569' };
            };

            return (
                <div>
                    <div className="grid grid-cols-2 gap-6">
                        <div>
                            <div className="text-center font-mono text-base font-bold text-white mb-1">Kruskal</div>
                            <div className="text-base font-mono text-cyan-400 mb-2 min-h-[3rem]">{cur.kLabel}</div>
                            <GraphSVG edgeStyle={kEdgeStyle} nodeStyle={kNodeStyle} />
                        </div>
                        <div>
                            <div className="text-center font-mono text-base font-bold text-white mb-1">Prim</div>
                            <div className="text-base font-mono text-cyan-400 mb-2 min-h-[3rem]">{cur.pLabel}</div>
                            <GraphSVG edgeStyle={pEdgeStyle} nodeStyle={pNodeStyle} />
                        </div>
                    </div>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                </div>
            );
        };

        const DijkstraAnimation = () => {
            const nodePos = { s:[55,105], a:[175,45], b:[175,165], c:[305,45], t:[415,105] };
            const graphEdges = [
                {u:'s',v:'a',w:4},{u:'s',v:'b',w:2},{u:'b',v:'a',w:1},
                {u:'a',v:'c',w:2},{u:'b',v:'c',w:8},{u:'c',v:'t',w:3},
            ];
            const INF = '∞';
            const D = (a,b) => <span><Tex tex={a}/>=<Tex tex={String(b)}/></span>;
            const steps = [
                { vis:[], cur:null, dist:{s:0,a:INF,b:INF,c:INF,t:INF}, prev:{s:'-',a:'-',b:'-',c:'-',t:'-'}, ae:null,
                  label:<span>初始化：<Tex tex="d[s]=0"/>，其余顶点 <Tex tex="\infty"/></span> },
                { vis:['s'], cur:'s', dist:{s:0,a:4,b:INF,c:INF,t:INF}, prev:{s:'-',a:'s',b:'-',c:'-',t:'-'}, ae:['s','a'],
                  label:<span>访问 <Tex tex="s"/>：松弛 <Tex tex="s\to a"/>，<Tex tex="d[a]=4"/></span> },
                { vis:['s'], cur:'s', dist:{s:0,a:4,b:2,c:INF,t:INF}, prev:{s:'-',a:'s',b:'s',c:'-',t:'-'}, ae:['s','b'],
                  label:<span>访问 <Tex tex="s"/>：松弛 <Tex tex="s\to b"/>，<Tex tex="d[b]=2"/></span> },
                { vis:['s','b'], cur:'b', dist:{s:0,a:3,b:2,c:INF,t:INF}, prev:{s:'-',a:'b',b:'s',c:'-',t:'-'}, ae:['b','a'],
                  label:<span>访问 <Tex tex="b"/>（<Tex tex="d=2"/>）：松弛 <Tex tex="b\to a"/>，更新 <Tex tex="d[a]=3"/></span> },
                { vis:['s','b'], cur:'b', dist:{s:0,a:3,b:2,c:10,t:INF}, prev:{s:'-',a:'b',b:'s',c:'b',t:'-'}, ae:['b','c'],
                  label:<span>访问 <Tex tex="b"/>：松弛 <Tex tex="b\to c"/>，<Tex tex="d[c]=10"/></span> },
                { vis:['s','b','a'], cur:'a', dist:{s:0,a:3,b:2,c:5,t:INF}, prev:{s:'-',a:'b',b:'s',c:'a',t:'-'}, ae:['a','c'],
                  label:<span>访问 <Tex tex="a"/>（<Tex tex="d=3"/>）：松弛 <Tex tex="a\to c"/>，更新 <Tex tex="d[c]=5"/></span> },
                { vis:['s','b','a','c'], cur:'c', dist:{s:0,a:3,b:2,c:5,t:8}, prev:{s:'-',a:'b',b:'s',c:'a',t:'c'}, ae:['c','t'],
                  label:<span>访问 <Tex tex="c"/>（<Tex tex="d=5"/>）：松弛 <Tex tex="c\to t"/>，<Tex tex="d[t]=8"/></span> },
                { vis:['s','b','a','c','t'], cur:null, dist:{s:0,a:3,b:2,c:5,t:8}, prev:{s:'-',a:'b',b:'s',c:'a',t:'c'}, ae:null,
                  label:<span>完成！最短路径 <Tex tex="s\to t"/> 距离为 <Tex tex="8"/>（<Tex tex="s\to b\to a\to c\to t"/>）</span> },
            ];
            const [step, setStep] = useState(0);
            const c = steps[step];
            const visSet = new Set(c.vis);
            const r = 20;
            const nodeOrder = ['s','a','b','c','t'];
            const nodeStyle = (n) => {
                if (n === c.cur) return { fill:'rgba(234,179,8,0.25)', stroke:'#eab308', text:'#fde047' };
                if (visSet.has(n)) return { fill:'rgba(6,182,212,0.2)', stroke:'#06b6d4', text:'#22d3ee' };
                return { fill:'rgba(30,41,59,0.8)', stroke:'#334155', text:'#475569' };
            };
            return (
                <div className="flex flex-col flex-1">
                    <div className="text-base font-mono text-cyan-400 mb-3">{c.label}</div>
                    <div className="flex gap-4 items-start">
                        <div className="font-mono text-base flex-shrink-0 min-w-[110px]">
                            <div className="grid grid-cols-3 gap-x-3 pb-1 border-b border-slate-700 mb-1">
                                <span className="text-slate-500">NODE</span>
                                <span className="text-slate-500">DIST</span>
                                <span className="text-slate-500">PREV</span>
                            </div>
                            {nodeOrder.map(n => {
                                const cls = n === c.cur ? 'text-yellow-300' : visSet.has(n) ? 'text-cyan-300' : 'text-slate-500';
                                return (
                                    <div key={n} className={`grid grid-cols-3 gap-x-3 py-0.5 ${cls}`}>
                                        <span className="font-bold"><Tex tex={n}/></span>
                                        <span>{c.dist[n] === INF ? <Tex tex="\infty"/> : c.dist[n]}</span>
                                        <span>{c.prev[n] === '-' ? '—' : <Tex tex={c.prev[n]}/>}</span>
                                    </div>
                                );
                            })}
                        </div>
                        <svg viewBox="0 0 470 210" className="flex-1" style={{maxWidth: '600px', margin: '0 auto', display: 'block'}}>
                            <defs>
                                <marker id="dijk-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
                                    <polygon points="0 0, 8 3, 0 6" fill="#1e293b" />
                                </marker>
                                <marker id="dijk-arr-act" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
                                    <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
                                </marker>
                            </defs>
                            {graphEdges.map(({u, v, w}) => {
                                const [x1,y1]=nodePos[u],[x2,y2]=nodePos[v];
                                const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
                                const sx=x1+(dx/len)*r, sy=y1+(dy/len)*r;
                                const ex=x2-(dx/len)*r, ey=y2-(dy/len)*r;
                                const active = c.ae && c.ae[0]===u && c.ae[1]===v;
                                const mx=(sx+ex)/2, my=(sy+ey)/2;
                                return (
                                    <g key={`${u}-${v}`}>
                                        <line x1={sx} y1={sy} x2={ex} y2={ey}
                                            stroke={active ? '#06b6d4' : '#1e293b'} strokeWidth={active ? 2 : 1}
                                            markerEnd={active ? 'url(#dijk-arr-act)' : 'url(#dijk-arr)'} />
                                        <rect x={mx-10} y={my-16} width={20} height={16} rx="2" fill="#020617" />
                                        <text x={mx} y={my-3} fill={active ? '#22d3ee' : '#334155'}
                                            fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{w}</text>
                                    </g>
                                );
                            })}
                            {nodeOrder.map(n => {
                                const [x,y]=nodePos[n];
                                const {fill, stroke, text} = nodeStyle(n);
                                return (
                                    <g key={n}>
                                        <circle cx={x} cy={y} r={r} fill={fill} stroke={stroke} strokeWidth="1.5" />
                                        <text x={x} y={y+6} fill={text} fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="bold">{n}</text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                    <div className="mt-auto">
                        <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                    </div>
                </div>
            );
        };

        const ActivitySelectionAnimation = () => {
            const activities = [
                { id: 'A', s: 0, e: 6 }, { id: 'B', s: 1, e: 4 }, { id: 'C', s: 3, e: 5 },
                { id: 'D', s: 5, e: 7 }, { id: 'E', s: 3, e: 9 }, { id: 'F', s: 5, e: 9 },
                { id: 'G', s: 6, e: 10 }, { id: 'H', s: 8, e: 11 }, { id: 'I', s: 8, e: 12 },
                { id: 'J', s: 2, e: 14 }, { id: 'K', s: 12, e: 16 },
            ];
            const sorted = [...activities].sort((a, b) => a.e - b.e);

            const computeSteps = () => {
                const steps = [{ selected: [], considering: -1, label: <span>按结束时间排序所有活动</span> }];
                const selected = [];
                let lastEnd = 0;
                for (let i = 0; i < sorted.length; i++) {
                    const { id, s, e } = sorted[i];
                    if (s >= lastEnd) {
                        selected.push(i);
                        lastEnd = e;
                        steps.push({ selected: [...selected], considering: i,
                            label: <span>选 <Tex tex={id}/>：<br/><Tex tex={`s_i=${s},\\;f_i=${e}`}/>，<br/><Tex tex={`s_i=${s}\\geq\\text{last}=${s}`}/></span> });
                    } else {
                        steps.push({ selected: [...selected], considering: i, rejected: true,
                            label: <span>跳过 <Tex tex={id}/>：<br/><Tex tex={`s_i=${s}<\\text{last}=${lastEnd}`}/></span> });
                    }
                }
                steps.push({ selected: [...selected], considering: -1,
                    label: <span>完成！共选出 <Tex tex={String(selected.length)}/> 个活动</span> });
                return steps;
            };
            const steps = computeSteps();
            const [step, setStep] = useState(0);
            const current = steps[Math.min(step, steps.length - 1)];

            const padL = 80, padR = 30, padT = 20;
            const maxTime = 16;
            const barH = 26, gap = 6;
            const w = 540, h = sorted.length * (barH + gap) + padT + 20;
            const scaleX = (t) => padL + (t / maxTime) * (w - padL - padR);
            const selectedSet = new Set(current.selected);

            return (
                <div>
                    <div className="flex gap-4 items-start">
                        <div className="w-52 flex-shrink-0 text-base font-mono text-cyan-400 pt-5 leading-relaxed">{current.label}</div>
                        <svg viewBox={`0 0 ${w} ${h}`} className="flex-1" style={{maxWidth: '600px'}}>
                            {Array.from({ length: maxTime + 1 }, (_, t) => (
                                <g key={t}>
                                    <line x1={scaleX(t)} y1={padT - 5} x2={scaleX(t)} y2={h - 5} stroke="#1e293b" strokeWidth="0.5" />
                                    <text x={scaleX(t)} y={h} fill="#475569" fontSize="16" textAnchor="middle" fontFamily="JetBrains Mono">{t}</text>
                                </g>
                            ))}
                            {sorted.map((act, i) => {
                                const x1 = scaleX(act.s), x2 = scaleX(act.e);
                                const y = padT + i * (barH + gap);
                                const isSelected = selectedSet.has(i);
                                const isConsidering = current.considering === i;
                                let fill = 'rgba(71, 85, 105, 0.4)', stroke = '#475569';
                                if (isSelected) { fill = 'rgba(6, 182, 212, 0.3)'; stroke = '#06b6d4'; }
                                if (isConsidering && current.rejected) { fill = 'rgba(239, 68, 68, 0.2)'; stroke = '#ef4444'; }
                                else if (isConsidering && !isSelected && !current.rejected) { fill = 'rgba(250, 204, 21, 0.2)'; stroke = '#fbbf24'; }
                                return (
                                    <g key={i}>
                                        <rect x={x1} y={y} width={x2 - x1} height={barH} rx="3" fill={fill} stroke={stroke} strokeWidth="1" />
                                        <text x={x1 + 6} y={y + barH/2 + 6} fill={isSelected ? '#22d3ee' : '#94a3b8'} fontSize="16" fontFamily="JetBrains Mono" fontWeight={isSelected ? 'bold' : 'normal'}>{act.id}</text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                </div>
            );
        };

        const GreedySection = () => {
            const [activeCard, setActiveCard] = useState('basic');
            const animationMap = {
                basic: <BasicIdeaAnimation />,
                localvsglobal: <LocalVsGlobalAnimation />,
                activity: <ActivitySelectionAnimation />,
                huffman: <HuffmanAnimation />,
                mst: <MSTAnimation />,
                dijkstra: <DijkstraAnimation />,
            };
            const titleMap = {
                basic: 'Coin Change (Greedy)',
                localvsglobal: 'Local vs Global Optimal',
                activity: 'Activity Selection (Greedy)',
                huffman: 'Huffman Encoding',
                mst: "最小生成树：Kruskal vs Prim",
                dijkstra: "Dijkstra's Shortest Path",
            };
            const descMap = {
                basic: '每步做出局部最优选择，期望产生全局最优解。需满足贪心选择性质和最优子结构。',
                localvsglobal: '贪心并非总能得到全局最优解。',
                activity: '选最多不冲突活动：按结束时间排序，每次选最早结束且不冲突的。',
                huffman: '按字符频率构建最优前缀码：频率低的字符对应更长的编码。',
                mst: 'Kruskal 按权排序边，用并查集判断成环；Prim 从一个顶点出发，每次选前沿最短边扩展。',
                dijkstra: '维护距离表，每次从未访问节点中选距离最小的进行松弛。',
            };
            const problemMap = {
                activity: <span>给定 <Tex tex="n"/> 个活动，每个活动有开始时间 <Tex tex="s_i"/> 和结束时间 <Tex tex="f_i"/>，从中选出最多的互不冲突（无重叠）的活动。</span>,
                huffman: <span>给定字母表 <Tex tex="C"/>，每个字符 <Tex tex="c"/> 具有频率 <Tex tex="f[c]"/>，构造最优前缀码，使总编码长度 <Tex tex={"B(T)=\\sum_{c\\in C}f[c]\\cdot d_T(c)"}/> 最小，其中 <Tex tex="d_T(c)"/> 为字符 <Tex tex="c"/> 在编码树中的深度。</span>,
                mst: <span>给定连通无向带权图 <Tex tex="G=(V,E,w)"/>，找一棵生成树 <Tex tex={"T\\subseteq E"}/>，使所有树边的总权重 <Tex tex={"\\sum_{e\\in T}w(e)"}/> 最小。</span>,
                dijkstra: <span>给定有向图 <Tex tex="G=(V,E)"/>，边权非负 <Tex tex={"w(u,v)\\geq 0"}/>，以及源点 <Tex tex="s"/>，求从 <Tex tex="s"/> 到所有顶点 <Tex tex={"v\\in V"}/> 的最短路径距离 <Tex tex={"\\delta(s,v)"}/>。</span>,
            };
            return (
                <section id="greedy" className="py-20">
                    <div className="container mx-auto px-6">
                        <SectionHeader title="贪心法" subtitle="GREEDY ALGORITHMS" />
                        <div className="grid lg:grid-cols-[3fr_7fr] gap-8">
                            <div className="space-y-4">
                                <KnowledgeCard title="基本思想" onClick={() => setActiveCard('basic')} active={activeCard === 'basic'} />
                                <KnowledgeCard title="局部最优 vs 全局最优" onClick={() => setActiveCard('localvsglobal')} active={activeCard === 'localvsglobal'} />
                                <KnowledgeCard title="活动选择问题" onClick={() => setActiveCard('activity')} active={activeCard === 'activity'} />
                                <KnowledgeCard title="Huffman编码" onClick={() => setActiveCard('huffman')} active={activeCard === 'huffman'} />
                                <KnowledgeCard title="最小生成树" onClick={() => setActiveCard('mst')} active={activeCard === 'mst'} />
                                <KnowledgeCard title="最短路径: Dijkstra" onClick={() => setActiveCard('dijkstra')} active={activeCard === 'dijkstra'} />
                            </div>
                            <div className="glass-panel p-6 rounded-xl flex flex-col">
                                <h4 className="text-white font-bold mb-1">{titleMap[activeCard]}</h4>
                                {problemMap[activeCard] && (
                                    <div className="bg-slate-900/60 border border-slate-700/60 rounded-lg px-4 py-3 mb-3">
                                        <span className="text-cyan-600 font-mono text-base uppercase tracking-widest block mb-1">问题描述</span>
                                        <p className="text-slate-300 text-base leading-relaxed">{problemMap[activeCard]}</p>
                                    </div>
                                )}
                                <p className="text-slate-400 text-base mb-4">{descMap[activeCard]}</p>
                                <div className="flex flex-col flex-1">
                                    {animationMap[activeCard] || <ActivitySelectionAnimation />}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileNav, setMobileNav] = useState(false);
            const currentId = 'greedy';

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="algorithm.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Course</span>
                            </a>
                            <div className="hidden lg:flex gap-4">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`text-xs font-mono transition-colors no-underline ${s.id === currentId ? 'text-cyan-400' : 'text-slate-500 hover:text-cyan-400'}`}>
                                        <span className="text-cyan-600">{s.num}</span> {s.titleEn}
                                    </a>
                                ))}
                            </div>
                            <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setMobileNav(!mobileNav)}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            </button>
                        </div>
                        {mobileNav && (
                            <div className="lg:hidden bg-slate-950/95 border-t border-white/5 px-6 py-4 space-y-2">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`block text-sm font-mono transition-colors no-underline py-1 ${s.id === currentId ? 'text-cyan-400' : 'text-slate-400 hover:text-cyan-400'}`} onClick={() => setMobileNav(false)}>
                                        <span className="text-cyan-600">{s.num}</span> {s.title}
                                    </a>
                                ))}
                            </div>
                        )}
                    </nav>
                    <GreedySection />
                    <footer className="py-12 border-t border-white/5 bg-black/40 backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <p className="text-base text-gray-600 font-mono">
                                © {new Date().getFullYear()} Dingming Wu. Algorithm Design and Analysis Course Material.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
