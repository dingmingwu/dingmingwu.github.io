<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtracking - Algorithm Design and Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #cbd5e1; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(0, 240, 255, 0.3); box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.6); }
        html { scroll-behavior: smooth; overflow-y: scroll; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [], animationFrameId;
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.size = Math.random() * 2 + 1; }
                    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
                    draw() { ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                }
                const init = () => { particles = []; const count = Math.min(window.innerWidth / 15, 80); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) { ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/120})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                        }
                        particles[i].update(); particles[i].draw();
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                window.addEventListener('resize', () => { resize(); init(); });
                resize(); init(); animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-8">
                <span className="text-cyan-500 font-mono text-sm tracking-widest uppercase mb-2 block">// {subtitle}</span>
                <h2 className="text-3xl md:text-4xl font-bold text-white tracking-tight">{title}</h2>
                <div className="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mt-4"></div>
            </div>
        );

        const StepButton = ({ step, setStep, maxStep, label }) => (
            <div className="flex items-center gap-3 mt-4">
                <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-base font-mono hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Prev</button>
                <button onClick={() => setStep(Math.min(maxStep, step + 1))} disabled={step >= maxStep} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-base font-mono hover:bg-cyan-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Next</button>
                <span className="text-base text-slate-500 font-mono">{label || `Step ${step} / ${maxStep}`}</span>
            </div>
        );

        const KnowledgeCard = ({ title, children, onClick, active }) => (
            <div
                className={`glass-panel p-6 rounded-xl mb-4 transition-all duration-200${onClick ? ' cursor-pointer' : ''}`}
                onClick={onClick}
                style={active ? { borderColor: 'rgba(34,211,238,0.5)', background: 'rgba(6,182,212,0.07)', boxShadow: '0 0 16px rgba(34,211,238,0.1)' } : {}}
            >
                <h4 className={`text-lg font-bold mb-2 ${active ? 'text-cyan-300' : 'text-white'}`}>{title}</h4>
                {children && <div className="text-slate-400 text-base leading-relaxed">{children}</div>}
            </div>
        );

        const Tex = ({ tex }) => {
            const html = katex.renderToString(tex, { throwOnError: false });
            return <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        const sections = [
            { id: 'complexity', num: '01', title: '算法复杂度分析', titleEn: 'Complexity Analysis' },
            { id: 'divide', num: '02', title: '分治法', titleEn: 'Divide and Conquer' },
            { id: 'backtrack', num: '03', title: '回溯法', titleEn: 'Backtracking' },
            { id: 'dp', num: '04', title: '动态规划', titleEn: 'Dynamic Programming' },
            { id: 'greedy', num: '05', title: '贪心法', titleEn: 'Greedy Algorithms' },
            { id: 'maxflow', num: '06', title: '最大流', titleEn: 'Maximum Flow' },
            { id: 'amortized', num: '07', title: '摊还分析', titleEn: 'Amortized Analysis' },
            { id: 'np', num: '08', title: 'NP理论', titleEn: 'NP Theory' },
        ];

        const BasicIdeasPanel = () => {
            const [step, setStep] = useState(0);
            const W = 460;
            const phaseLabel = ['迷宫比喻', '深度优先搜索 + 剪枝', '核心逻辑三部曲'][step];
            const phaseColor = ['#fbbf24', '#22d3ee', '#a78bfa'][step];
            const boxW = 86, boxH = 54, boxGap = 30;
            const totalW = 4 * boxW + 3 * boxGap;
            const s0startX = (W - totalW) / 2;
            const boxes = [
                { label: '尝试', sub: 'Try',      color: '#fbbf24' },
                { label: '校验', sub: 'Check',    color: '#f87171' },
                { label: '回溯', sub: 'Backtrack', color: '#a78bfa' },
                { label: '重试', sub: 'Retry',    color: '#34d399' },
            ];
            return (
                <div className="font-mono">
                    <div className="text-base mb-3" style={{ color: phaseColor }}>{phaseLabel}</div>
                    <div style={{ minHeight: '18rem' }}>
                    {step === 0 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">将求解过程比作在迷宫中找出口：沿一条路走下去，遇到死胡同就退回，换另一条路。</div>
                            <svg viewBox={`0 0 ${W} 132`} className="w-full max-w-lg mx-auto">
                                <defs>
                                    {boxes.map((b,i) => (
                                        <marker key={i} id={`arr${i}`} markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                                            <polygon points="0 0,7 3.5,0 7" fill={b.color}/>
                                        </marker>
                                    ))}
                                    <marker id="arrBack" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                                        <polygon points="0 0,7 3.5,0 7" fill="#fbbf24"/>
                                    </marker>
                                </defs>
                                {boxes.map((b, i) => {
                                    const x = s0startX + i * (boxW + boxGap);
                                    return (
                                        <g key={i}>
                                            <rect x={x} y={20} width={boxW} height={boxH} rx="5" fill={b.color + '1a'} stroke={b.color} strokeWidth="1.2"/>
                                            <text x={x+boxW/2} y={37} dominantBaseline="middle" fill={b.color} fontSize="14" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">{b.label}</text>
                                            <text x={x+boxW/2} y={57} dominantBaseline="middle" fill={b.color+'99'} fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">{b.sub}</text>
                                            {i < 3 && (
                                                <line x1={x+boxW+2} y1={47} x2={x+boxW+boxGap-2} y2={47} stroke={boxes[i+1].color} strokeWidth="1.5" markerEnd={`url(#arr${i+1})`}/>
                                            )}
                                        </g>
                                    );
                                })}
                                <path d={`M ${s0startX+3*boxW+3*boxGap+boxW/2} 74 Q ${W/2} 112 ${s0startX+boxW/2} 74`} fill="none" stroke="#fbbf24" strokeWidth="1.2" strokeDasharray="4,3" markerEnd="url(#arrBack)"/>
                                <text x={W/2} y={110} fill="#fbbf2488" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">循环直到找到解</text>
                            </svg>
                        </div>
                    )}
                    {step === 1 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">回溯法本质是DFS，在搜索过程中利用<span className="text-red-400">剪枝</span>提前终止不可能成功的分支，避免无效搜索。</div>
                            <svg viewBox={`0 0 ${W} 162`} className="w-full max-w-lg mx-auto mt-8">
                                <rect x={170} y={4} width={80} height={30} rx="5" fill="rgba(148,163,184,0.1)" stroke="#475569" strokeWidth="1"/>
                                <text x={210} y={19} dominantBaseline="middle" fill="#94a3b8" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">Start</text>
                                <line x1={210} y1={34} x2={100} y2={66} stroke="#475569" strokeWidth="1"/>
                                <line x1={210} y1={34} x2={320} y2={66} stroke="#475569" strokeWidth="1"/>
                                <rect x={58} y={66} width={84} height={30} rx="5" fill="rgba(239,68,68,0.1)" stroke="#ef4444" strokeWidth="1"/>
                                <text x={100} y={81} dominantBaseline="middle" fill="#ef4444" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">A ✗ 剪枝</text>
                                <rect x={278} y={66} width={84} height={30} rx="5" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" strokeWidth="1"/>
                                <text x={320} y={81} dominantBaseline="middle" fill="#22d3ee" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">B 继续</text>
                                <line x1={320} y1={96} x2={240} y2={126} stroke="#475569" strokeWidth="1"/>
                                <line x1={320} y1={96} x2={380} y2={126} stroke="#475569" strokeWidth="1"/>
                                <rect x={196} y={126} width={88} height={30} rx="5" fill="rgba(52,211,153,0.12)" stroke="#34d399" strokeWidth="1"/>
                                <text x={240} y={141} dominantBaseline="middle" fill="#34d399" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">B1 ✓ 解</text>
                                <rect x={348} y={126} width={68} height={30} rx="5" fill="rgba(239,68,68,0.1)" stroke="#ef4444" strokeWidth="1"/>
                                <text x={382} y={141} dominantBaseline="middle" fill="#ef4444" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">B2 ✗</text>
                            </svg>
                        </div>
                    )}
                    {step === 2 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">回溯法的代码结构极为经典，每一层递归均包含相同的三个步骤。</div>
                            <div className="rounded-lg border border-white/10 bg-slate-900/60 p-4 text-base font-mono mb-2">
                                <div className="text-slate-500 mb-2">{'function backtrack(path, choices):'}</div>
                                <div className="text-slate-500 mb-3">{'  if 满足终止条件: 记录结果; return'}</div>
                                <div className="text-slate-500 mb-1">{'  for choice in choices:'}</div>
                                {[
                                    { num: '①', label: '做选择', color: '#fbbf24', code: '    path.add(choice)' },
                                    { num: '②', label: '递归',   color: '#22d3ee', code: '    backtrack(path, remaining)' },
                                    { num: '③', label: '撤销选择', color: '#a78bfa', code: '    path.remove(choice)' },
                                ].map((s, i) => (
                                    <div key={i} className="flex items-baseline gap-2 mb-1">
                                        <span className="shrink-0 px-1.5 py-0.5 rounded text-sm" style={{ color: s.color, background: s.color+'18', border: `1px solid ${s.color}44` }}>{s.num} {s.label}</span>
                                        <span style={{ color: s.color + 'cc' }}>{s.code}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="text-slate-500 text-base">撤销选择是回溯的精髓——递归返回后必须还原状态，以便尝试下一个选择。</div>
                        </div>
                    )}
                    </div>
                    <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                        <div className="text-slate-500 font-mono text-base">{'// 回溯法三要素'}</div>
                        {[
                            { label: '尝试', color: '#fbbf24', desc: '从候选列表中做出一个选择，沿决策树向下探索' },
                            { label: '校验', color: '#f87171', desc: '判断当前路径是否满足约束条件，不满足则剪枝' },
                            { label: '回溯', color: '#a78bfa', desc: '撤销上一步选择，退回上一层，尝试其他候选分支' },
                        ].map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5" style={{ color: item.color, background: item.color+'18', border: `1px solid ${item.color}44` }}>{item.label}</span>
                                <span className="text-slate-400 text-base leading-relaxed">{item.desc}</span>
                            </div>
                        ))}
                        <div className="pt-1 border-t border-white/5 text-base text-slate-400">
                            时间复杂度：最坏情况 <Tex tex="O(b^d)" />（b = 分支数，d = 深度），剪枝可大幅减少实际搜索空间
                        </div>
                    </div>
                    <StepButton step={step} setStep={setStep} maxStep={2} label={['迷宫比喻', 'DFS + 剪枝', '核心三部曲'][step]} />
                </div>
            );
        };

        const PruningPanel = () => {
            const [step, setStep] = useState(0);
            const W = 420;
            const phases = [
                { label: '可行性剪枝', motto: '"违规就停"',        color: '#f87171' },
                { label: '最优性剪枝', motto: '"不够好就停"',      color: '#fbbf24' },
                { label: '搜索顺序剪枝', motto: '"优先触发更多剪枝"', color: '#22d3ee' },
                { label: '排除等效冗余', motto: '"等效分支只走一次"', color: '#a78bfa' },
            ];
            const { label, motto, color } = phases[step];
            return (
                <div className="font-mono">
                    <div className="flex items-center gap-3 mb-3">
                        <span className="text-base font-bold" style={{ color }}>{label}</span>
                        <span className="text-slate-500 text-sm">{motto}</span>
                    </div>
                    <div style={{ minHeight: '17rem' }}>
                    {step === 0 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">最基础的剪枝：一旦不满足约束条件，立即停止当前分支的搜索。例：八皇后中发现列或对角线冲突，直接回溯。</div>
                            <svg viewBox={`0 0 ${W} 168`} className="w-full max-w-lg mx-auto mt-8">
                                <rect x={170} y={4} width={80} height={34} rx="5" fill="rgba(148,163,184,0.1)" stroke="#475569" strokeWidth="1"/>
                                <text x={210} y={21} dominantBaseline="middle" fill="#94a3b8" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">放置皇后</text>
                                <line x1={210} y1={38} x2={90} y2={64} stroke="#475569" strokeWidth="1"/>
                                <line x1={210} y1={38} x2={330} y2={64} stroke="#475569" strokeWidth="1"/>
                                <rect x={34} y={64} width={112} height={48} rx="5" fill="rgba(239,68,68,0.12)" stroke="#ef4444" strokeWidth="1.2"/>
                                <text x={90} y={78} dominantBaseline="middle" fill="#ef4444" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">列冲突 ✗</text>
                                <text x={90} y={98} dominantBaseline="middle" fill="#ef4444aa" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">立即回溯</text>
                                <rect x={274} y={64} width={112} height={48} rx="5" fill="rgba(52,211,153,0.12)" stroke="#34d399" strokeWidth="1.2"/>
                                <text x={330} y={78} dominantBaseline="middle" fill="#34d399" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">位置有效 ✓</text>
                                <text x={330} y={98} dominantBaseline="middle" fill="#34d399aa" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">继续递归</text>
                                <line x1={330} y1={112} x2={330} y2={124} stroke="#34d399" strokeWidth="1" strokeDasharray="3,2"/>
                                <rect x={274} y={124} width={112} height={34} rx="5" fill="rgba(52,211,153,0.08)" stroke="#34d399" strokeWidth="1"/>
                                <text x={330} y={141} dominantBaseline="middle" fill="#34d399aa" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">放置下一行...</text>
                            </svg>
                        </div>
                    )}
                    {step === 1 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">在求最优解时，若当前路径代价已超过已知最优解，继续搜索必然更差，直接剪掉。例：TSP 中当前路径已达 105，已知最优为 100。</div>
                            <svg viewBox={`0 0 ${W} 160`} className="w-full max-w-lg mx-auto mt-8">
                                <text x={10} y={22} dominantBaseline="middle" fill="#34d399" fontSize="14" fontFamily="JetBrains Mono">已知最优</text>
                                <rect x={90} y={8} width={240} height={28} rx="3" fill="rgba(52,211,153,0.15)" stroke="#34d399" strokeWidth="1"/>
                                <text x={210} y={22} dominantBaseline="middle" fill="#34d399" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">总长 = 100</text>
                                <text x={10} y={70} dominantBaseline="middle" fill="#fbbf24" fontSize="14" fontFamily="JetBrains Mono">当前路径</text>
                                <rect x={90} y={56} width={256} height={28} rx="3" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" strokeWidth="1"/>
                                <text x={218} y={70} dominantBaseline="middle" fill="#fbbf24" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">走到一半已达 105</text>
                                <line x1={330} y1={4} x2={330} y2={88} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4,3"/>
                                <text x={334} y={22} dominantBaseline="middle" fill="#ef4444" fontSize="14" fontFamily="JetBrains Mono">超出!</text>
                                <rect x={120} y={100} width={220} height={48} rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444" strokeWidth="1.5"/>
                                <text x={230} y={114} dominantBaseline="middle" fill="#ef4444" fontSize="14" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">✗ 直接回溯</text>
                                <text x={230} y={134} dominantBaseline="middle" fill="#ef4444aa" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">后续路径必然 &gt; 100</text>
                            </svg>
                        </div>
                    )}
                    {step === 2 && (
                        <div>
                            <div className="text-base text-slate-400 mb-3">调整搜索顺序尽早触发剪枝。例：数独中优先填候选数字最少的格子，更快发现矛盾。</div>
                            <svg viewBox={`0 0 ${W} 148`} className="w-full max-w-lg mx-auto mt-8">
                                {[
                                    { x: 40,  candidates: [1,3,5,7,9], label: '5 个候选', highlight: false },
                                    { x: 130, candidates: [4,8],       label: '2 个候选', highlight: true  },
                                    { x: 220, candidates: [2,4,6,9],   label: '4 个候选', highlight: false },
                                    { x: 310, candidates: [1,2,5,6,7,8], label: '6 个候选', highlight: false },
                                ].map((cell, i) => (
                                    <g key={i}>
                                        <rect x={cell.x} y={10} width={70} height={80} rx="6" fill={cell.highlight ? 'rgba(34,211,238,0.15)' : 'rgba(15,23,42,0.6)'} stroke={cell.highlight ? '#22d3ee' : '#1e293b'} strokeWidth={cell.highlight ? 1.5 : 1}/>
                                        <text x={cell.x+35} y={38} dominantBaseline="middle" fill={cell.highlight ? '#22d3ee' : '#475569'} fontSize="20" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">?</text>
                                        <text x={cell.x+35} y={64} dominantBaseline="middle" fill={cell.highlight ? '#22d3ee' : '#334155'} fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">{cell.label}</text>
                                        {cell.highlight && <text x={cell.x+35} y={108} fill="#22d3ee" fontSize="22" textAnchor="middle">↑</text>}
                                        {cell.highlight && <text x={cell.x+35} y={132} dominantBaseline="middle" fill="#22d3ee" fontSize="14" textAnchor="middle" fontFamily="JetBrains Mono">MRV 优先</text>}
                                    </g>
                                ))}
                            </svg>
                        </div>
                    )}
                    {step === 3 && (
                        <div>

        const NQueensAnimation = () => {
            const N = 4;
            const [step, setStep] = useState(0);
            const solveSteps = () => {
                const steps = [];
                const board = Array(N).fill(-1);
                const isValid = (r, c) => {
                    for (let i = 0; i < r; i++) {
                        if (board[i] === c || Math.abs(board[i] - c) === Math.abs(i - r)) return false;
                    }
                    return true;
                };
                const solve = (row) => {
                    if (row === N) { steps.push({ board: [...board], status: 'solution' }); return true; }
                    for (let col = 0; col < N; col++) {
                        steps.push({ board: [...board], trying: [row, col], status: 'trying' });
                        if (isValid(row, col)) {
                            board[row] = col;
                            steps.push({ board: [...board], status: 'placed' });
                            if (solve(row + 1)) return true;
                            board[row] = -1;
                            steps.push({ board: [...board], status: 'backtrack' });
                        } else {
                            steps.push({ board: [...board], conflict: [row, col], status: 'conflict' });
                        }
                    }
                    return false;
                };
                steps.push({ board: [...board], status: 'start' });
                solve(0);
                return steps;
            };
            const steps = solveSteps();
            const current = steps[Math.min(step, steps.length - 1)];
            const cellSize = 50, pad = 10;
            const w = N * cellSize + 2 * pad, h = N * cellSize + 2 * pad;
            return (
                <div>
                    <div className="text-base font-mono mb-2">
                        {current.status === 'trying' && <span className="text-yellow-400">Trying row {current.trying[0]+1}, col {current.trying[1]+1}</span>}

                                const x = pad + c * cellSize, y = pad + r * cellSize;
                                const isQueen = current.board[r] === c;
                                const isTrying = current.trying && current.trying[0] === r && current.trying[1] === c;
                                const isConflict = current.conflict && current.conflict[0] === r && current.conflict[1] === c;
                                let fill = (r + c) % 2 === 0 ? '#1e293b' : '#0f172a';

                                if (isConflict) fill = 'rgba(239, 68, 68, 0.3)';
                                return (
                                    <g key={`${r}-${c}`}>
                                        <rect x={x} y={y} width={cellSize} height={cellSize} fill={fill} stroke="#334155" strokeWidth="0.5" />
                                        {isQueen && <text x={x + cellSize/2} y={y + cellSize/2 + 8} textAnchor="middle" fontSize="28">&#9819;</text>}
                                    </g>
                                );
                            })
                        )}
                    </svg>
                    <StepButton step={step} setStep={setStep} maxStep={steps.length - 1} />
                </div>
            );

        const TSPPanel = () => {
            const [step, setStep] = useState(0);
            const W = 340, H = 240, cr = 18;
            const cities = [
                { x: 140, y: 26,  label: 'A' },
                { x: 30,  y: 120, label: 'B' },
                { x: 290, y: 120, label: 'C' },
                { x: 140, y: 190, label: 'D' },

            const dist = (a, b) => Math.round(Math.sqrt(
                Math.pow(cities[a].x - cities[b].x, 2) + Math.pow(cities[a].y - cities[b].y, 2)

            const allEdges = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
            const steps = [
                { path: [],          pruned: false, best: null,        bestCost: Infinity,

                  desc: '剪枝！当前累计 437；剩余至少 d(B,D)+d(D,A) = 130+164 = 294；预计总费用 ≥ 731 > 618；此分支必然不优' },
                { path: [0,2,3,1,0], pruned: false, best: [0,1,3,2,0], bestCost: 618,
                  desc: '尝试 A→C→D→B→A；费用 177+166+130+145 = 618；与最优相同（对称路径）' },
                { path: [0,1,3,2,0], pruned: false, best: [0,1,3,2,0], bestCost: 618,
                  desc: '搜索完成！最优回路：A→B→D→C→A；最短距离 618' },
            ];
            const s = steps[step];
            const isFinal = step === steps.length - 1;
            const pathEdges = [];
            for (let i = 0; i < s.path.length - 1; i++) pathEdges.push([s.path[i], s.path[i+1]]);
            const sameAsCurrent = s.best && s.path.join('-') === s.best.join('-');
            const bestEdges = [];
            if (s.best && !isFinal && !sameAsCurrent) {
                for (let i = 0; i < s.best.length - 1; i++) bestEdges.push([s.best[i], s.best[i+1]]);
            }
            const prevBestCost = step > 0 ? steps[step - 1].bestCost : Infinity;
            const isNewBest = !s.pruned && s.best && s.bestCost < prevBestCost;
            const edgeColor = isFinal ? '#22d3ee' : s.pruned ? '#ef4444' : isNewBest ? '#34d399' : '#fbbf24';
            return (
                <div className="font-mono">
                    <div style={{ minHeight: '18rem' }} className="flex gap-5 items-start">

                            {pathEdges.map(([a,b], i) => {
                                const mx = (cities[a].x + cities[b].x) / 2;
                                const my = (cities[a].y + cities[b].y) / 2;

                                    <text key={i} x={mx - dy/len*13} y={my + dx/len*13} fill="#64748b" fontSize="10" textAnchor="middle" dominantBaseline="middle" fontFamily="JetBrains Mono">{dist(a,b)}</text>
                                );
                            })}
                            {cities.map((c, i) => {
                                const inPath = s.path.includes(i);
                                const isStart = i === 0;
                                const isPrunedNode = s.pruned && s.path.length > 0 && s.path[s.path.length-1] === i;
                                return (
                                    <g key={i}>
                                        <circle cx={c.x} cy={c.y} r={cr}
                                            fill={isPrunedNode ? 'rgba(239,68,68,0.12)' : isStart ? 'rgba(251,191,36,0.15)' : inPath ? 'rgba(34,211,238,0.12)' : 'rgba(15,23,42,0.7)'}
                                            stroke={isPrunedNode ? '#ef4444' : isStart ? '#fbbf24' : inPath ? '#22d3ee' : '#334155'}
                                            strokeWidth={inPath || isStart ? 2 : 1.5}/>
                                        <text x={c.x} y={c.y} dominantBaseline="middle" fill={isPrunedNode ? '#ef4444' : isStart ? '#fbbf24' : inPath ? '#22d3ee' : '#475569'} fontSize="14" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">{c.label}</text>
                                    </g>
                                );
                            })}
                            {s.pruned && s.path.length > 0 && (
                                <text x={cities[s.path[s.path.length-1]].x + 24} y={cities[s.path[s.path.length-1]].y - 20} fill="#ef4444" fontSize="18" fontWeight="bold" fontFamily="JetBrains Mono">✗</text>

                    <div className="mt-4 p-4 rounded-lg border border-white/10 bg-slate-900/40 space-y-3">
                        <div className="text-slate-500 font-mono text-base">{'// TSP 回溯三要素'}</div>
                        {[
                            { label: '尝试', color: '#fbbf24', desc: '依次将未访问城市加入路径，逐步构建完整回路' },
                            { label: '剪枝', color: '#f87171', desc: '当前费用 + 剩余路径下界 > 已知最优 → 立即回溯，不再继续' },

                        ].map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="text-base font-mono px-1.5 py-0.5 rounded shrink-0 mt-0.5" style={{ color: item.color, background: item.color+'18', border: `1px solid ${item.color}44` }}>{item.label}</span>
                                <span className="text-slate-400 text-base leading-relaxed">{item.desc}</span>
                            </div>
                        ))}
                        <div className="pt-1 border-t border-white/5 text-base text-slate-400">
                            时间复杂度：<Tex tex="O((n-1)!)" />，最优性剪枝可大幅减少实际搜索量
                        </div>
                    </div>
                    <StepButton step={step} setStep={setStep} maxStep={7} label={['问题定义','首条回路','回溯探索','发现更优','新分支','最优性剪枝','对称路径','搜索完成'][step]} />
                </div>
            );
        };

        const BacktrackingSection = () => {
            const [activePanel, setActivePanel] = useState('basics');
            const titles = {
                basics:   '基本思想 (Backtracking Basics)',
                pruning:  '剪枝策略 (Pruning Strategies)',
                coloring: '图着色问题 (Graph Coloring)',
                nqueens:  '4皇后问题 (4-Queens)',
                tsp:      '旅行商问题 (Traveling Salesman)',
            };
            return (
                <section id="backtrack" className="py-20">
                    <div className="container mx-auto px-6">
                        <SectionHeader title="回溯法" subtitle="BACKTRACKING" />
                        <div className="grid lg:grid-cols-[3fr_7fr] gap-8">
                            <div className="space-y-4">
                                <KnowledgeCard title="基本思想" onClick={() => setActivePanel('basics')} active={activePanel === 'basics'} />
                                <KnowledgeCard title="剪枝策略" onClick={() => setActivePanel('pruning')} active={activePanel === 'pruning'} />
                                <KnowledgeCard title="N皇后问题" onClick={() => setActivePanel('nqueens')} active={activePanel === 'nqueens'} />
                                <KnowledgeCard title="图着色问题" onClick={() => setActivePanel('coloring')} active={activePanel === 'coloring'} />
                                <KnowledgeCard title="旅行商问题" onClick={() => setActivePanel('tsp')} active={activePanel === 'tsp'} />
                            </div>
                            <div className="glass-panel p-6 rounded-xl">
                                <h4 className="text-white font-bold mb-4">{titles[activePanel]}</h4>
                                {activePanel === 'basics'   ? <BasicIdeasPanel /> :
                                 activePanel === 'pruning'  ? <PruningPanel /> :
                                 activePanel === 'coloring' ? <GraphColoringPanel /> :
                                 activePanel === 'nqueens'  ? <NQueensAnimation /> :
                                 <TSPPanel />}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileNav, setMobileNav] = useState(false);
            const currentId = 'backtrack';

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
                    <BackgroundCanvas />
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-300 border-b border-white/5 backdrop-blur-md ${scrolled ? 'bg-slate-950/80 py-3' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="algorithm.html" className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors no-underline group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <span className="font-mono text-sm">Back to Course</span>
                            </a>
                            <div className="hidden lg:flex gap-4">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`text-xs font-mono transition-colors no-underline ${s.id === currentId ? 'text-cyan-400' : 'text-slate-500 hover:text-cyan-400'}`}>
                                        <span className="text-cyan-600">{s.num}</span> {s.titleEn}
                                    </a>
                                ))}
                            </div>
                            <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setMobileNav(!mobileNav)}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                            </button>
                        </div>
                        {mobileNav && (
                            <div className="lg:hidden bg-slate-950/95 border-t border-white/5 px-6 py-4 space-y-2">
                                {sections.map((s) => (
                                    <a key={s.id} href={`${s.id}.html`} className={`block text-sm font-mono transition-colors no-underline py-1 ${s.id === currentId ? 'text-cyan-400' : 'text-slate-400 hover:text-cyan-400'}`} onClick={() => setMobileNav(false)}>
                                        <span className="text-cyan-600">{s.num}</span> {s.title}
                                    </a>
                                ))}
                            </div>
                        )}
                    </nav>
                    <BacktrackingSection />
                    <footer className="py-12 border-t border-white/5 bg-black/40 backdrop-blur-md">
                        <div className="container mx-auto px-6 text-center">
                            <p className="text-sm text-gray-600 font-mono">
                                © {new Date().getFullYear()} Dingming Wu. Algorithm Design and Analysis Course Material.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
